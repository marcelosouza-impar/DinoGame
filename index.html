    {tx:14.5,ty:5.5, vx:-0.4,vy:0,    frame:0,frameT:0,c:'#4ade80'},
    {tx:20.5,ty:3.0, vx:0,   vy:-0.3, frame:0,frameT:0,c:'#fbbf24'},
    {tx:26.5,ty:0.5, vx:-0.3,vy:0,    frame:0,frameT:0,c:'#c084fc'},
    {tx:7.5, ty:5.5, vx:0.3, vy:0,    frame:0,frameT:0,c:'#fb923c'},
  ];
  frCoins=[];
  for(let ty=0;ty<FR_SZ;ty++)for(let tx=0;tx<FR_SZ;tx++){
    if((FR_MAP[ty][tx]===0||FR_MAP[ty][tx]===1||FR_MAP[ty][tx]===2)&&Math.random()<0.07)
      frCoins.push({tx:tx+0.5+Math.random()*0.3,ty:ty+0.5+Math.random()*0.3,bob:Math.random()*Math.PI*2,collected:false});
  }
  frCars=[
    {tx:2.5, ty:0.5,color:'#ef4444',occupied:false,facing:0},
    {tx:8.5, ty:3.0,color:'#3b82f6',occupied:false,facing:0},
    {tx:14.5,ty:0.5,color:'#22c55e',occupied:false,facing:0},
    {tx:20.5,ty:3.0,color:'#f97316',occupied:false,facing:Math.PI},
    {tx:27.5,ty:0.5,color:'#eab308',occupied:false,facing:0},
  ];
  frDriving=null;
  frCoinCount=0;
  state='freeroam';
}

function updateFreeRoam(){
  if(frDriving){
    const turn=0.052,spd=0.11;
    if(keys['KeyA']||keys['ArrowLeft'])frDriving.facing-=turn;
    if(keys['KeyD']||keys['ArrowRight'])frDriving.facing+=turn;
    let move=0;
    if(keys['KeyW']||keys['ArrowUp'])move=spd;
    if(keys['KeyS']||keys['ArrowDown'])move=-spd*0.6;
    if(move){
      const nx=frDriving.tx+Math.cos(frDriving.facing)*move;
      const ny=frDriving.ty+Math.sin(frDriving.facing)*move;
      if(!frBlocked(nx,frDriving.ty)&&nx>0.3&&nx<FR_SZ-0.3)frDriving.tx=nx;
      if(!frBlocked(frDriving.tx,ny)&&ny>0.3&&ny<FR_SZ-0.3)frDriving.ty=ny;
    }
    frPlayer.tx=frDriving.tx;frPlayer.ty=frDriving.ty;frPlayer.facing=frDriving.facing;
    frPlayer.frameT++;if(frPlayer.frameT>6){frPlayer.frame=(frPlayer.frame+1)%4;frPlayer.frameT=0;}
  } else {
    const turn=0.055,spd=0.055;
    if(keys['KeyA']||keys['ArrowLeft'])frPlayer.facing-=turn;
    if(keys['KeyD']||keys['ArrowRight'])frPlayer.facing+=turn;
    let move=0;
    if(keys['KeyW']||keys['ArrowUp'])move=spd;
    if(keys['KeyS']||keys['ArrowDown'])move=-spd*0.6;
    if(move){
      const nx=frPlayer.tx+Math.cos(frPlayer.facing)*move;
      const ny=frPlayer.ty+Math.sin(frPlayer.facing)*move;
      if(!frBlocked(nx,frPlayer.ty)&&nx>0.1&&nx<FR_SZ-0.1)frPlayer.tx=nx;
      if(!frBlocked(frPlayer.tx,ny)&&ny>0.1&&ny<FR_SZ-0.1)frPlayer.ty=ny;
      frPlayer.frameT++;if(frPlayer.frameT>8){frPlayer.frame=(frPlayer.frame+1)%4;frPlayer.frameT=0;}
    } else frPlayer.frame=0;
  }
  frCoins.forEach(c=>{
    c.bob+=0.06;
    if(c.collected)return;
    if(Math.abs(c.tx-frPlayer.tx)<0.65&&Math.abs(c.ty-frPlayer.ty)<0.65){
      c.collected=true;frCoinCount++;frTotalCoins++;totalCoins++;saveProgress();
    }
  });
  frNPCs.forEach(n=>{
    const nx2=n.tx+n.vx*0.04,ny2=n.ty+n.vy*0.04;
    if(frBlocked(nx2,n.ty)||nx2<0.5||nx2>FR_SZ-0.5)n.vx*=-1;else n.tx=nx2;
    if(frBlocked(n.tx,ny2)||ny2<0.5||ny2>6.5)n.vy*=-1;else n.ty=ny2;
    n.frameT++;if(n.frameT>10){n.frame=(n.frame+1)%4;n.frameT=0;}
  });
}

function frGroundColor(t,tx,ty){
  if(t===9) return ty%2===0?'#5BC0FF':'#6CC8FF';
  if(t===2) return (tx+ty)%2===0?'#7ED957':'#8EDF68';
  if(t===1) return '#FFE9B8';
  return '#7A7798';
}
function frZoneName(ty){ return ty<7 ? 'Centro' : ty<10 ? 'Floresta' : 'Praia'; }
const FR_PIN = new Path2D('M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z');
function frKeycap(x,y,label){
  hudFont(700,14,'d');
  const w=Math.max(28,ctx.measureText(label).width+14);
  ctx.fillStyle=HUD_INK; roundRect(ctx,x,y+3,w,28,9,true,false);
  ctx.fillStyle='#FFFFFF'; ctx.strokeStyle=HUD_INK; ctx.lineWidth=2.5; roundRect(ctx,x,y,w,28,9,true,true);
  ctx.fillStyle=HUD_INK; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label,x+w/2,y+15);
  return w;
}

function drawFreeRoam(){
  // câmera 3D atrás do jogador
  const FOCAL=370, CAM_BACK=1.9, CAM_H=0.62;
  const HOR=Math.round(H*0.4);
  const camA=frDriving?frDriving.facing:frPlayer.facing;
  const camX=frPlayer.tx-Math.cos(camA)*CAM_BACK;
  const camY=frPlayer.ty-Math.sin(camA)*CAM_BACK;
  const cosA=Math.cos(-camA),sinA=Math.sin(-camA);
  const INK=HUD_INK, SKY='142,216,255';
  function proj(wx,wy,wz){
    const dx=wx-camX,dy=wy-camY;
    const lz=dx*cosA-dy*sinA;  // profundidade
    const lx=dx*sinA+dy*cosA;  // lateral
    if(lz<0.08)return null;
    const sc=FOCAL/lz;
    return{x:W/2+lx*sc,y:HOR+(CAM_H-wz)*sc,sc,d:lz};
  }
  const quad=(pts)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();};
  const lw=(p)=>Math.max(.6,Math.min(3.2,p.sc*.012));
  const tileAt=(x,y)=>(x<0||y<0||x>=FR_SZ||y>=FR_SZ)?-1:FR_MAP[y][x];
  const cat=t=>t===0?'r':t===1?'s':t===2?'g':t===9?'o':t<0?'x':'b';

  // CÉU
  ctx.fillStyle='#8ED8FF'; ctx.fillRect(0,0,W,HOR+2);
  ctx.fillStyle='#FFE27A'; ctx.beginPath(); ctx.arc(640,62,30,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFFFFF';
  [[180,70,1],[520,108,.75]].forEach(([cx,cy,k])=>{
    [[0,0,16],[22,-8,22],[46,2,15]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(cx+dx*k,cy+dy*k,r*k,0,Math.PI*2);ctx.fill();});
    roundRect(ctx,cx-10*k,cy,66*k,14*k,7*k,true,false);
  });
  ctx.fillStyle='#9BE66F'; ctx.beginPath(); ctx.ellipse(260,HOR+6,170,30,0,Math.PI,0); ctx.fill();
  ctx.fillStyle='#7ED957'; ctx.beginPath(); ctx.ellipse(540,HOR+8,200,36,0,Math.PI,0); ctx.fill();
  // base do chão além do alcance de desenho
  const farX=Math.floor(frPlayer.tx+Math.cos(camA)*16), farY=Math.floor(frPlayer.ty+Math.sin(camA)*16);
  const farT=tileAt(farX,farY);
  ctx.fillStyle = farY>=10||farT===9 ? '#5BC0FF' : farT<0 ? '#9BE66F' : frGroundColor(farT,farX,farY);
  ctx.fillRect(0,HOR,W,H-HOR);

  // CHÃO + PRÉDIOS — do mais longe para o mais perto
  const draws=[];
  for(let ty=0;ty<FR_SZ;ty++)for(let tx=0;tx<FR_SZ;tx++){
    const tile=FR_MAP[ty][tx];
    const dist=(tx+0.5-camX)**2+(ty+0.5-camY)**2;
    if(dist<(tile===9?400:196))draws.push({tx,ty,tile,dist});
  }
  draws.sort((a,b)=>b.dist-a.dist);
  const fullRow=y=>FR_MAP[y].every(t=>t===0);

  draws.forEach(({tx,ty,tile,dist})=>{
    const fog=Math.min(.6,dist/240);
    const pa=proj(tx,ty,0),pb=proj(tx+1,ty,0),pc=proj(tx+1,ty+1,0),pd=proj(tx,ty+1,0);
    if(tile<3||tile===9){
      if(!pa||!pb||!pc||!pd) return;
      const xs=[pa.x,pb.x,pc.x,pd.x],ys=[pa.y,pb.y,pc.y,pd.y];
      if(Math.min(...xs)>W+30||Math.max(...xs)<-30||Math.min(...ys)>H+10)return;
      ctx.fillStyle=frGroundColor(tile,tx,ty); quad([pa,pb,pc,pd]); ctx.fill();
      if(tile===9){ // ondas
        const w0=proj(tx+.2,ty+.5,0),w1=proj(tx+.8,ty+.5,0);
        if(w0&&w1){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=lw(w0);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(w0.x,w0.y);ctx.lineTo(w1.x,w1.y);ctx.stroke();}
      }
      if(tile===0){ // faixa central amarela
        const dash=(x0,y0,x1,y1)=>{const q=[proj(x0,y0,.002),proj(x1,y0,.002),proj(x1,y1,.002),proj(x0,y1,.002)];if(q.some(v=>!v))return;
          ctx.fillStyle='#FFD23F';quad(q);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=Math.max(.5,lw(q[0])*.6);ctx.stroke();};
        if(fullRow(ty)) dash(tx+.3,ty+.45,tx+.7,ty+.55);
        else if(tileAt(tx+1,ty)===0) dash(tx+.95,ty+.3,tx+1.05,ty+.7);
        else if(tileAt(tx-1,ty)!==0) dash(tx+.45,ty+.3,tx+.55,ty+.7);
      }
      // contorno onde o tipo de chão muda
      ctx.strokeStyle=INK; ctx.lineCap='round';
      const me=cat(tile);
      [[pa,pb,tx,ty-1],[pb,pc,tx+1,ty],[pc,pd,tx,ty+1],[pd,pa,tx-1,ty]].forEach(([u,v,nx,ny])=>{
        const o=cat(tileAt(nx,ny)); if(o===me||o==='b'||o==='x') return;
        ctx.lineWidth=lw(u)*.8; ctx.beginPath(); ctx.moveTo(u.x,u.y); ctx.lineTo(v.x,v.y); ctx.stroke();
      });
      if(fog>.02){ctx.fillStyle=`rgba(${SKY},${fog})`;quad([pa,pb,pc,pd]);ctx.fill();}
    } else {
      const b=FR_BLDG[tile]; if(!b) return;
      const wh=b.fl*0.28;
      const pat=proj(tx,ty,wh),pbt=proj(tx+1,ty,wh),pct=proj(tx+1,ty+1,wh),pdt=proj(tx,ty+1,wh);
      const lerp=(p,q,t)=>({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t});
      function face(p0,p1,p1t,p0t,clr){
        if(!p0||!p1||!p1t||!p0t) return;
        const xs=[p0.x,p1.x,p1t.x,p0t.x],ys=[p0.y,p1.y,p1t.y,p0t.y];
        if(Math.min(...xs)>W+40||Math.max(...xs)<-40||Math.min(...ys)>H+40||Math.max(...ys)<-40) return;
        const pt=(u,v)=>lerp(lerp(p0t,p1t,u),lerp(p0,p1,u),v);
        ctx.fillStyle=clr; quad([p0,p1,p1t,p0t]); ctx.fill();
        // faixa escura no alto
        ctx.fillStyle=b.t; quad([pt(0,0),pt(1,0),pt(1,.1/b.fl*2),pt(0,.1/b.fl*2)]); ctx.fill();
        // janelas por andar
        const faceH=Math.abs(p0.y-p0t.y);
        if(faceH>24){
          for(let f=0;f<b.fl;f++){
            const v0=(f+.32)/b.fl, v1=(f+.78)/b.fl;
            [[.16,.42],[.58,.84]].forEach(([u0,u1])=>{
              const q=[pt(u0,v0),pt(u1,v0),pt(u1,v1),pt(u0,v1)];
              ctx.fillStyle='#D6F1FF'; quad(q); ctx.fill();
              ctx.strokeStyle=INK; ctx.lineWidth=Math.max(.6,lw(p0)*.7); ctx.stroke();
            });
          }
        }
        ctx.strokeStyle=INK; ctx.lineWidth=lw(p0); ctx.lineJoin='round'; quad([p0,p1,p1t,p0t]); ctx.stroke();
        if(fog>.02){ctx.fillStyle=`rgba(${SKY},${fog})`;quad([p0,p1,p1t,p0t]);ctx.fill();}
      }
      if(camY>ty+0.5)face(pd,pc,pct,pdt,b.c);else face(pa,pb,pbt,pat,b.d);
      if(camX>tx+0.5)face(pb,pc,pct,pbt,b.c);else face(pa,pd,pdt,pat,b.d);
      if(pat&&pbt&&pct&&pdt){
        ctx.fillStyle=b.t; quad([pat,pbt,pct,pdt]); ctx.fill();
        ctx.strokeStyle=INK; ctx.lineWidth=lw(pat); ctx.stroke();
        if(fog>.02){ctx.fillStyle=`rgba(${SKY},${fog})`;quad([pat,pbt,pct,pdt]);ctx.fill();}
      }
    }
  });

  // ÁRVORES
  FR_TREES.forEach(([tx,ty])=>{
    const dist2=(tx+0.5-camX)**2+(ty+0.5-camY)**2;if(dist2>250)return;
    const p0=proj(tx+0.5,ty+0.5,0),p1=proj(tx+0.5,ty+0.5,0.28),p2=proj(tx+0.5,ty+0.5,0.62);
    if(!p0||!p1||!p2)return;
    const l=lw(p0);
    ctx.globalAlpha=Math.max(0.15,1-dist2/250);
    ctx.fillStyle='#C98B5B'; ctx.strokeStyle=INK; ctx.lineWidth=l;
    ctx.beginPath(); ctx.rect(p1.x-p1.sc*0.045,p1.y,p1.sc*0.09,p0.y-p1.y); ctx.fill(); ctx.stroke();
    const r=p2.sc*0.3;
    ctx.fillStyle='#5CC96B'; ctx.beginPath(); ctx.arc(p2.x,p2.y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#9BE66F'; ctx.beginPath(); ctx.arc(p2.x-r*0.3,p2.y-r*0.35,r*0.45,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  });

  // NPCs, MOEDAS E CARROS
  const sprites=[];
  frNPCs.forEach(n=>sprites.push({tx:n.tx,ty:n.ty,type:'npc',data:n,dist2:(n.tx-camX)**2+(n.ty-camY)**2}));
  frCars.forEach(c=>{if(!c.occupied)sprites.push({tx:c.tx,ty:c.ty,type:'car',data:c,dist2:(c.tx-camX)**2+(c.ty-camY)**2});});
  frCoins.forEach(c=>{if(!c.collected)sprites.push({tx:c.tx,ty:c.ty,type:'coin',data:c,dist2:(c.tx-camX)**2+(c.ty-camY)**2});});
  sprites.sort((a,b)=>b.dist2-a.dist2);
  let carPrompt=null;
  sprites.forEach(sp=>{
    const pf=proj(sp.tx,sp.ty,0);if(!pf||pf.d<0.3||pf.d>13)return;
    ctx.globalAlpha=Math.max(0.15,1-sp.dist2/160);
    const l=lw(pf); ctx.strokeStyle=INK; ctx.lineWidth=l; ctx.lineJoin='round';
    if(sp.type==='coin'){
      const c=sp.data,pc=proj(c.tx,c.ty,0.14+Math.sin(c.bob)*0.03);if(!pc)return;
      const r=Math.max(2.5,pc.sc*0.11);
      ctx.fillStyle='#FFD23F'; ctx.beginPath(); ctx.arc(pc.x,pc.y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      if(r>6){ctx.fillStyle=INK; hudFont(700,r*1.1,'d'); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',pc.x,pc.y+1);}
    } else if(sp.type==='npc'){
      const n=sp.data,ph=proj(n.tx,n.ty,0.5);if(!ph)return;
      const h=Math.max(6,pf.y-ph.y),w=h*0.55;
      ctx.fillStyle=n.c;
      roundRect(ctx,ph.x-w/2,ph.y+h*0.38,w,h*0.6,w*0.3,true,true);
      ctx.beginPath(); ctx.arc(ph.x,ph.y+h*0.2,w*0.42,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(ph.x+w*0.12,ph.y+h*0.16,w*0.14,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(ph.x+w*0.15,ph.y+h*0.16,w*0.07,0,Math.PI*2); ctx.fill();
    } else if(sp.type==='car'){
      const car=sp.data,pt=proj(car.tx,car.ty,0.3);if(!pt)return;
      const ch=Math.max(5,pf.y-pt.y),cw=ch*1.9;
      ctx.fillStyle=INK;
      roundRect(ctx,pt.x-cw*0.42,pf.y-ch*0.25,cw*0.18,ch*0.3,ch*0.08,true,false);
      roundRect(ctx,pt.x+cw*0.24,pf.y-ch*0.25,cw*0.18,ch*0.3,ch*0.08,true,false);
      ctx.fillStyle=car.color;
      roundRect(ctx,pt.x-cw*0.32,pt.y-ch*0.15,cw*0.64,ch*0.45,ch*0.2,true,true);
      ctx.fillStyle='#D6F1FF'; roundRect(ctx,pt.x-cw*0.24,pt.y-ch*0.07,cw*0.48,ch*0.3,ch*0.12,true,true);
      ctx.fillStyle=car.color; roundRect(ctx,pt.x-cw/2,pt.y+ch*0.25,cw,ch*0.55,ch*0.22,true,true);
      ctx.fillStyle='#FFD23F';
      roundRect(ctx,pt.x-cw*0.42,pt.y+ch*0.38,cw*0.14,ch*0.14,ch*0.07,true,true);
      roundRect(ctx,pt.x+cw*0.28,pt.y+ch*0.38,cw*0.14,ch*0.14,ch*0.07,true,true);
      if((car.tx-frPlayer.tx)**2+(car.ty-frPlayer.ty)**2<2.2) carPrompt={x:pt.x,y:pt.y-ch*0.3};
    }
    ctx.globalAlpha=1;
  });
  if(carPrompt && !frDriving){
    hudFont(900,13);
    const tw=ctx.measureText('Entrar').width, w=4+24+6+tw+12;
    const x=carPrompt.x-w/2, y=carPrompt.y-36;
    hudPill(x,y,w,32);
    ctx.fillStyle='#FFFFFF'; ctx.strokeStyle=INK; ctx.lineWidth=2.5; roundRect(ctx,x+4,y+4,24,24,8,true,true);
    hudFont(700,12,'d'); ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('C',x+16,y+17);
    hudFont(900,13); ctx.textAlign='left'; ctx.fillText('Entrar',x+34,y+17);
  }

  // JOGADOR
  if(!frDriving){
    drawDinoOn(ctx,W/2-20,H-62,frPlayer.frame,false,0.72);
  } else {
    ctx.strokeStyle=INK; ctx.lineWidth=16; ctx.lineCap='round';
    drawDinoOn(ctx,W/2-60,H-78,frPlayer.frame,false,0.5);
    drawDinoOn(ctx,W/2+14,H-78,frPlayer.frame,false,0.5);
    ctx.beginPath(); ctx.arc(W/2,H+10,70,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
    ctx.strokeStyle='#7A7798'; ctx.lineWidth=9; ctx.stroke();
  }

  // HUD — moedas e bairro
  ctx.save();
  ctx.textBaseline='middle';
  hudFont(900,16);
  const ct=String(frCoinCount);
  let w=6+26+8+ctx.measureText(ct).width+12;
  hudPill(12,12,w,36); drawCoin(12+6+13,30,12);
  hudFont(900,16); ctx.fillStyle=INK; ctx.textAlign='left'; ctx.fillText(ct,12+6+26+8,31);
  const zone=frZoneName(frPlayer.ty);
  hudFont(700,16,'d');
  const zx=12+w+10, zw=12+20+6+ctx.measureText(zone).width+14;
  hudPill(zx,14,zw,32,'#5BC0FF');
  ctx.save(); ctx.translate(zx+10,18); ctx.scale(20/24,20/24); ctx.fillStyle='#FFFFFF'; ctx.fill(FR_PIN,'evenodd'); ctx.strokeStyle=INK; ctx.lineWidth=2.6; ctx.stroke(FR_PIN); ctx.restore();
  ctx.fillStyle=INK; ctx.textAlign='left'; ctx.fillText(zone,zx+10+20+6,31);

  // HUD — teclas
  const moveHint=frDriving?'acelerar e virar':'andar', carHint=frDriving?'sair do carro':'entrar no carro';
  hudFont(900,13);
  const panelW=12+4*28+12+8+ctx.measureText(moveHint).width+14+28+8+ctx.measureText(carHint).width+12;
  const py=H-16-46;
  ctx.fillStyle=INK; roundRect(ctx,12,py+4,panelW,46,20,true,false);
  ctx.fillStyle='#FFFFFF'; ctx.strokeStyle=INK; ctx.lineWidth=3; roundRect(ctx,12,py,panelW,46,20,true,true);
  let kx=24;
  ['W','A','S','D'].forEach(k=>{kx+=frKeycap(kx,py+8,k)+4;});
  hudFont(900,13); ctx.fillStyle=INK; ctx.textAlign='left'; ctx.textBaseline='middle';
  kx+=8; ctx.fillText(moveHint,kx,py+23); kx+=ctx.measureText(moveHint).width+14;
  kx+=frKeycap(kx,py+8,'C')+8;
  hudFont(900,13); ctx.fillStyle=INK; ctx.textAlign='left'; ctx.fillText(carHint,kx,py+23);

  // HUD — minimapa redondo
  const R=56, mcx=W-16-R, mcy=H-16-R, MS=(R*2)/14;
  ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(mcx,mcy+4,R+2,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(mcx,mcy,R,0,Math.PI*2); ctx.clip();
  ctx.fillStyle='#FFE9B8'; ctx.fillRect(mcx-R,mcy-R,R*2,R*2);
  const mx0=mcx-frPlayer.tx*MS, my0=mcy-frPlayer.ty*MS;
  for(let y=0;y<FR_SZ;y++)for(let x=0;x<FR_SZ;x++){
    if(Math.abs(x+.5-frPlayer.tx)>8||Math.abs(y+.5-frPlayer.ty)>8) continue;
    const t=FR_MAP[y][x];
    ctx.fillStyle=t>=3&&t!==9?FR_BLDG[t].d:frGroundColor(t,x,y);
    ctx.fillRect(mx0+x*MS,my0+y*MS,MS+.5,MS+.5);
  }
  frCars.forEach(c=>{ctx.fillStyle=c.color;ctx.strokeStyle=INK;ctx.lineWidth=1;ctx.beginPath();ctx.arc(mx0+c.tx*MS,my0+c.ty*MS,2.5,0,Math.PI*2);ctx.fill();ctx.stroke();});
  ctx.translate(mx0+frPlayer.tx*MS,my0+frPlayer.ty*MS); ctx.rotate(camA+Math.PI/2);
  ctx.fillStyle='#FF6B6B'; ctx.strokeStyle=INK; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,5); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(mcx,mcy,R,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function startMenuAnimation(){
  if(menuAnimRAF) cancelAnimationFrame(menuAnimRAF);
  function step(){
    const cvs = document.getElementById('menuDinoAnim');
    if(!cvs){ menuAnimRAF = null; return; }
    const c = cvs.getContext('2d');
    c.clearRect(0,0,cvs.width,cvs.height);
    menuAnimTick++;
    c.fillStyle='rgba(43,42,76,.16)';
    c.beginPath(); c.ellipse(90, cvs.height-8, 46, 6, 0, 0, Math.PI*2); c.fill();
    if(typeof drawDinoOn === 'function') drawDinoOn(c, 40, cvs.height-8, 0, false, 1.5);
    menuAnimRAF = requestAnimationFrame(step);
  }
  step();
}
function stopMenuAnimation(){
  if(menuAnimRAF){ cancelAnimationFrame(menuAnimRAF); menuAnimRAF = null; }
}

function loop(){
  try{
    if(state==='freeroam'){ updateFreeRoam(); drawFreeRoam(); requestAnimationFrame(loop); return; }
    if(state==='editor'){ updateEditor(); drawEditor(); updateMobileControls(); requestAnimationFrame(loop); return; }
    if(!paused){ update(); draw(); }
    else { draw(); drawPauseOverlay(); }
    updateMobileControls();
  } catch(e){
    // Never let a draw/update error kill the game loop
    console.error('DinoGame loop error:', e);
  }
  requestAnimationFrame(loop);
}
// ─── LOADING SCREEN ──────────────────────────────────────────────────────────
(function initLoading(){
  const bar = document.getElementById('loadBar');
  const ls = document.getElementById('loadingScreen');
  const ov = document.getElementById('overlay');
  let pct = 0;
  const tick = setInterval(()=>{
    pct = Math.min(pct + 8 + Math.random()*12, 90);
    if(bar) bar.style.width = pct+'%';
  }, 120);
  document.fonts.ready.then(()=>{
    clearInterval(tick);
    if(bar) bar.style.width = '100%';
    setTimeout(()=>{
      if(ls) ls.style.display = 'none';
      if(ov) ov.style.display = 'flex';
    }, 400);
  });
  // fallback se fonts.ready não disparar
  setTimeout(()=>{
    clearInterval(tick);
    if(ls) ls.style.display = 'none';
    if(ov) ov.style.display = 'flex';
  }, 4000);
})();

initMobileDpad();
requestAnimationFrame(loop);
</script>
