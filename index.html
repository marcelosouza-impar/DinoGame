  ctx.fillText(name,x+32,y+1);
  ctx.restore();
}

// ─── SCENE HELPERS ────────────────────────────────────────────────────────────
function roundRect(c,x,y,w,h,r,fill,stroke){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y);
  c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
  if(fill) c.fill();
  if(stroke) c.stroke();
}

function drawCloud(x,y,w,theme){
  const alpha = theme.stars ? 0.18 : 0.82;
  ctx.fillStyle = theme.stars ? 'rgba(140,180,220,'+alpha+')' : 'rgba(255,255,255,'+alpha+')';
  ctx.beginPath();
  ctx.ellipse(x+w*.5,  y,    w*.45, 18, 0,0,Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x+w*.28, y+10, w*.28, 15, 0,0,Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x+w*.72, y+8,  w*.26, 14, 0,0,Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x+w*.5,  y+14, w*.42, 14, 0,0,Math.PI*2); ctx.fill();
}

function drawMountains(offset,color,heightA,heightB,spacing){
  ctx.fillStyle=color;
  const mo = offset%spacing;
  for(let i=-1;i<Math.ceil(W/spacing)+2;i++){
    const mx=i*spacing-mo;
    ctx.beginPath();
    ctx.moveTo(mx,GROUND);
    ctx.bezierCurveTo(mx+spacing*.2,GROUND, mx+spacing*.25,GROUND-heightA, mx+spacing*.5,GROUND-heightA);
    ctx.bezierCurveTo(mx+spacing*.75,GROUND-heightA, mx+spacing*.8,GROUND, mx+spacing,GROUND);
    ctx.closePath(); ctx.fill();

    const ox=mx+spacing*.55;
    ctx.beginPath();
    ctx.moveTo(ox,GROUND);
    ctx.bezierCurveTo(ox+spacing*.18,GROUND, ox+spacing*.22,GROUND-heightB, ox+spacing*.45,GROUND-heightB);
    ctx.bezierCurveTo(ox+spacing*.68,GROUND-heightB, ox+spacing*.72,GROUND, ox+spacing*.9,GROUND);
    ctx.closePath(); ctx.fill();
  }
}

function drawTree(x,y,h,w,theme,opacity){
  ctx.globalAlpha=opacity;
  // trunk
  ctx.fillStyle=theme.treeTrunk;
  const tw=w*.32; const tx=x-tw/2;
  roundRect(ctx, tx, y-h*.45, tw, h*.45, tw/2, true, false);
  // canopy – multi-circle
  ctx.fillStyle=theme.treeLeaf;
  [[x,y-h*.72,w*.55],[x-w*.3,y-h*.55,w*.38],[x+w*.28,y-h*.52,w*.36]].forEach(([cx,cy,cr])=>{
    ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawWeather(){
  if(!weatherParticles.length) return;
  ctx.save();
  weatherParticles.forEach(w=>{
    const a = Math.min(1, w.life/40);
    if(w.type==='rain'){
      ctx.strokeStyle=`rgba(180,210,255,${a*0.55})`; ctx.lineWidth=1.2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(w.x,w.y); ctx.lineTo(w.x+w.vx*3,w.y-8); ctx.stroke();
    } else if(w.type==='ash'){
      ctx.fillStyle=`rgba(160,80,20,${a*0.5})`;
      ctx.beginPath(); ctx.arc(w.x,w.y,2+Math.random(),0,Math.PI*2); ctx.fill();
    } else if(w.type==='snow'){
      ctx.fillStyle=`rgba(220,240,255,${a*0.75})`;
      ctx.beginPath(); ctx.arc(w.x,w.y,2.5,0,Math.PI*2); ctx.fill();
    } else if(w.type==='spore'){
      ctx.fillStyle=`rgba(0,230,160,${a*0.6})`;
      ctx.beginPath(); ctx.arc(w.x,w.y,1.8,0,Math.PI*2); ctx.fill();
    }
  });
  ctx.restore();
}

function drawPetSpeech(){
  if(!petSpeech.timer || !petSpeech.text) return;
  const alpha = Math.min(1, petSpeech.timer/20);
  const bx = pet.x - 10;
  const by = pet.y - 70;
  const tw = petSpeech.text.length * 7 + 18;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  roundRect(ctx, bx, by, tw, 22, 6, true, false);
  ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 1.5;
  roundRect(ctx, bx, by, tw, 22, 6, false, true);
  // tail
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.moveTo(bx+14, by+22);
  ctx.lineTo(bx+10, by+30);
  ctx.lineTo(bx+22, by+22);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(bx+14, by+22); ctx.lineTo(bx+10, by+30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx+22, by+22); ctx.lineTo(bx+10, by+30); ctx.stroke();
  // text
  ctx.fillStyle = '#1a1a2e';
  ctx.font = '7px "Press Start 2P"';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(petSpeech.text, bx+9, by+11);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function drawGround(t){
  ctx.fillStyle=t.ground;
  ctx.fillRect(0,GROUND,W,H-GROUND);

  ctx.fillStyle=t.groundMid;
  ctx.fillRect(0,GROUND,W,14);

  ctx.fillStyle=t.groundTop;
  const humpOff = (scrollX*.8)%60;
  ctx.beginPath();
  ctx.moveTo(0,GROUND+4);
  for(let i=0;i<Math.ceil(W/60)+2;i++){
    const bx=i*60-humpOff;
    ctx.quadraticCurveTo(bx+15,GROUND-6, bx+30,GROUND+2);
    ctx.quadraticCurveTo(bx+45,GROUND+8, bx+60,GROUND+4);
  }
  ctx.lineTo(W,GROUND+12); ctx.lineTo(0,GROUND+12); ctx.closePath(); ctx.fill();

  ctx.strokeStyle=t.groundTop;
  ctx.lineWidth=2.5;
  for(let i=0;i<18;i++){
    const gx=((i*113+37)-scrollX*.95)%W;
    const gy=GROUND-1;
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx-3,gy-7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx+4,gy); ctx.lineTo(gx+4,gy-9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx+8,gy); ctx.lineTo(gx+11,gy-6); ctx.stroke();
  }

  ctx.fillStyle='rgba(0,0,0,.18)';
  for(let i=0;i<14;i++){
    const px=((i*173+91)-scrollX*.9)%W;
    ctx.beginPath(); ctx.ellipse(px,GROUND+22,8,5,0,0,Math.PI*2); ctx.fill();
  }
}

// ─── FLAT DESIGN HELPERS ──────────────────────────────────────────────────────
const OL='#1a1a2e'; // outline color
function flat(c,fill,outline=OL,lw=2.5){ c.fillStyle=fill; c.strokeStyle=outline; c.lineWidth=lw; }
function circle(c,x,y,r,fill,outline=OL,lw=2.5){
  flat(c,fill,outline,lw);
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.stroke();
}
function block(c,x,y,w,h,r,fill,outline=OL,lw=2.5){
  flat(c,fill,outline,lw);
  roundRect(c,x,y,w,h,r,true,false);
  c.strokeStyle=outline; c.lineWidth=lw;
  roundRect(c,x,y,w,h,r,false,true);
}

function drawPlatform(x, y, w, type){
  const h=20;
  // sombra
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(x+w/2,y+7,w*.42,5,0,0,Math.PI*2); ctx.fill();

  if(type==='stone'){
    block(ctx,x,y-h,w,h,6,'#94a3b8','#334155',2.5);
    // divisórias dos blocos
    ctx.strokeStyle='#64748b'; ctx.lineWidth=2;
    for(let i=40;i<w;i+=40){ ctx.beginPath(); ctx.moveTo(x+i,y-h+3); ctx.lineTo(x+i,y-3); ctx.stroke(); }
    // topo claro
    ctx.fillStyle='rgba(255,255,255,0.25)';
    roundRect(ctx,x+4,y-h+3,w-8,5,2,true,false);
  } else if(type==='wood'){
    block(ctx,x,y-h,w,h,6,'#d97706','#78350f',2.5);
    ctx.strokeStyle='#92400e'; ctx.lineWidth=1.5;
    for(let i=40;i<w;i+=40){ ctx.beginPath(); ctx.moveTo(x+i,y-h+3); ctx.lineTo(x+i,y-3); ctx.stroke(); }
    ctx.fillStyle='rgba(255,255,255,0.2)';
    roundRect(ctx,x+4,y-h+3,w-8,4,2,true,false);
  } else {
    block(ctx,x,y-h+7,w,h-7,5,'#92400e','#1a1a2e',2.5);
    block(ctx,x,y-h,w,10,5,currentTheme.groundTop,'#1a1a2e',2.5);
    ctx.strokeStyle=currentTheme.groundTop; ctx.lineWidth=2.5; ctx.lineCap='round';
    for(let i=0;i<Math.floor(w/16);i++){
      const gx=x+8+i*16;
      ctx.beginPath(); ctx.moveTo(gx,y-h); ctx.lineTo(gx-2,y-h-6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx+5,y-h); ctx.lineTo(gx+5,y-h-8); ctx.stroke();
    }
  }
}

function drawEgg(x,y,r,kind='normal'){
  const configs = {
    normal: {top:'#fef3c7',mid:'#fbbf24',bot:'#b45309',band:'#f59e0b',glow:'rgba(251,191,36,0.35)'},
    gold:   {top:'#fef9c3',mid:'#facc15',bot:'#a16207',band:'#fde68a',glow:'rgba(250,204,21,0.45)'},
    blue:   {top:'#eff6ff',mid:'#60a5fa',bot:'#1d4ed8',band:'#93c5fd',glow:'rgba(96,165,250,0.4)'},
    red:    {top:'#fff1f2',mid:'#f87171',bot:'#b91c1c',band:'#fca5a5',glow:'rgba(248,113,113,0.4)'},
    rainbow:{top:'#fdf4ff',mid:'#e879f9',bot:'#7e22ce',band:'#f0abfc',glow:'rgba(232,121,249,0.4)'},
    fossil: {top:'#fafaf9',mid:'#a8a29e',bot:'#44403c',band:'#78716c',glow:'rgba(120,113,108,0.3)'},
    ghost:  {top:'#f5f3ff',mid:'#a5b4fc',bot:'#4338ca',band:'#c4b5fd',glow:'rgba(165,180,252,0.4)'},
    dragon: {top:'#fff7ed',mid:'#fb923c',bot:'#c2410c',band:'#fed7aa',glow:'rgba(251,146,60,0.4)'},
  };
  const cfg = configs[kind] || configs.normal;

  // outer glow pulse (uses frameCount for animation)
  const pulse = 0.6 + Math.sin(frameCount * 0.08) * 0.4;
  ctx.save();
  ctx.globalAlpha = pulse * 0.5;
  const grd0 = ctx.createRadialGradient(x,y,r*0.6,x,y,r*2.4);
  grd0.addColorStop(0, cfg.glow); grd0.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = grd0;
  ctx.beginPath(); ctx.ellipse(x,y,r*2.2,r*2.5,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // body gradient
  const grd = ctx.createRadialGradient(x-r*.2,y-r*.35,r*.05, x,y,r*1.1);
  grd.addColorStop(0, cfg.top);
  grd.addColorStop(0.45, cfg.mid);
  grd.addColorStop(1, cfg.bot);
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(x,y,r*.82,r,0,0,Math.PI*2); ctx.fill();

  // outline with shadow
  ctx.shadowColor = cfg.bot; ctx.shadowBlur = 4;
  ctx.strokeStyle = cfg.bot; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.ellipse(x,y,r*.82,r,0,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  // equator band
  ctx.strokeStyle = cfg.band; ctx.lineWidth = 2;
  ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.ellipse(x,y,r*.82,r*.42,0,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;

  // kind-specific decoration
  if(kind==='rainbow'){
    ['#ef4444','#f97316','#facc15','#22c55e','#3b82f6','#a855f7'].forEach((col,i)=>{
      ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.arc(x,y,r*.28+i*2.4,Math.PI*.18,Math.PI*.82); ctx.stroke();
    });
    ctx.globalAlpha=1;
  } else if(kind==='fossil'){
    ctx.strokeStyle='#57534e'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-r*.4,y+r*.3); ctx.lineTo(x+r*.4,y-r*.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-r*.3,y-r*.35); ctx.lineTo(x+r*.3,y+r*.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-r*.5); ctx.lineTo(x-r*.25,y+r*.1); ctx.lineTo(x+r*.25,y+r*.1); ctx.closePath(); ctx.stroke();
  } else if(kind==='ghost'){
    ctx.fillStyle='rgba(99,102,241,0.85)';
    ctx.beginPath(); ctx.ellipse(x-r*.28,y-r*.18,r*.16,r*.22,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+r*.28,y-r*.18,r*.16,r*.22,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(99,102,241,0.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y+r*.2,r*.18,.1,Math.PI-.1); ctx.stroke();
  } else if(kind==='dragon'){
    ctx.fillStyle='#dc2626'; ctx.strokeStyle=OL; ctx.lineWidth=1.2;
    [[-r*.32,-r*.85],[0,-r*1.15],[r*.32,-r*.85]].forEach(([dx,dy])=>{
      ctx.beginPath(); ctx.moveTo(x+dx-r*.12,y+dy+r*.18);
      ctx.lineTo(x+dx,y+dy-r*.1); ctx.lineTo(x+dx+r*.12,y+dy+r*.18);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    });
  } else if(kind==='gold'){
    // star burst
    ctx.strokeStyle='rgba(255,255,200,0.7)'; ctx.lineWidth=1.5;
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r*.28,y+Math.sin(a)*r*.34);
      ctx.lineTo(x+Math.cos(a)*r*.58,y+Math.sin(a)*r*.68); ctx.stroke();
    }
  }

  // specular highlight
  const hl = ctx.createRadialGradient(x-r*.28,y-r*.35,0, x-r*.18,y-r*.2,r*.42);
  hl.addColorStop(0,'rgba(255,255,255,0.82)');
  hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl;
  ctx.beginPath(); ctx.ellipse(x-r*.2,y-r*.28,r*.3,r*.2,-0.3,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawObstacle(obs,x){
  const t=obs.type, oy=obs.y, ow=obs.w, oh=obs.h;
  if(t==='rock'){
    ctx.fillStyle='#94a3b8';
    ctx.beginPath();
    ctx.moveTo(x+ow*.15,oy);
    ctx.bezierCurveTo(x,oy, x+ow*.05,oy-oh*.7, x+ow*.2,oy-oh);
    ctx.bezierCurveTo(x+ow*.4,oy-oh*1.12, x+ow*.6,oy-oh*1.12, x+ow*.8,oy-oh);
    ctx.bezierCurveTo(x+ow*.95,oy-oh*.7, x+ow,oy, x+ow*.85,oy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#475569'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(x+ow*.28,oy-oh*.68,ow*.12,oh*.08,-.3,0,Math.PI*2); ctx.fill();

  } else if(t==='cactus'){
    const cc='#22c55e', cd='#15803d';
    block(ctx,x+ow*.33,oy-oh,ow*.34,oh,8,cc,cd,2.5);
    block(ctx,x+ow*.04,oy-oh*.68,ow*.3,ow*.22,8,cc,cd,2.5);
    block(ctx,x+ow*.04,oy-oh*.88,ow*.22,oh*.22,8,cc,cd,2.5);
    block(ctx,x+ow*.66,oy-oh*.62,ow*.3,ow*.22,8,cc,cd,2.5);
    block(ctx,x+ow*.74,oy-oh*.82,ow*.22,oh*.22,8,cc,cd,2.5);

  } else if(t==='fire'){
    const ft=frameCount*.12, mx=x+ow/2;
    [['#fde047',oh*.9],['#fb923c',oh*.7],['#ef4444',oh*.5]].forEach(([col,h2],i)=>{
      ctx.fillStyle=col;
      ctx.beginPath();
      ctx.moveTo(x+4,oy);
      ctx.quadraticCurveTo(mx+Math.sin(ft+i)*8,oy-h2*.5, mx+Math.cos(ft+i*1.3)*5,oy-h2+Math.sin(ft*1.4+i)*5);
      ctx.quadraticCurveTo(mx+Math.sin(ft+i+1)*8,oy-h2*.5, x+ow-4,oy);
      ctx.closePath(); ctx.fill();
    });

  } else if(t==='log'){
    block(ctx,x,oy-oh,ow,oh,6,'#b45309','#78350f',2.5);
    ctx.strokeStyle='#92400e'; ctx.lineWidth=1.5;
    for(let i=1;i<4;i++){
      ctx.beginPath(); ctx.moveTo(x+5,oy-oh+i*oh/3); ctx.lineTo(x+ow-5,oy-oh+i*oh/3); ctx.stroke();
    }
    ctx.fillStyle='rgba(255,255,255,0.18)';
    roundRect(ctx,x+5,oy-oh+3,ow-10,5,2,true,false);
  }
}

// ─── ENEMY DRAW ───────────────────────────────────────────────────────────────
function drawEnemy(enemy,ex){
  const flip=enemy.vx>0;
  ctx.save();
  if(flip){ctx.translate(ex+enemy.w,0); ctx.scale(-1,1); ex=0;}
  const legOff=Math.sin(frameCount*.22)*5;
  if(enemy.type==='ptero')   drawPtero(ex, enemy.y, enemy.frame);
  else if(enemy.type==='trex')   drawTRex(ex,  enemy.y, legOff);
  else if(enemy.type==='anky')   drawAnky(ex,  enemy.y, legOff);
  else if(enemy.type==='raptor') drawRaptor(ex,enemy.y, legOff);
  ctx.restore();
}

function pill(c,x,y,w,h,r){
  roundRect(c,x,y,w,h,Math.min(r,w/2,h/2),true,false);
}

function drawPtero(x,y,frame){
  const wUp=frame===0;
  const wy = wUp ? -48 : 8;
  // wing membrane — curved bezier
  ctx.fillStyle='#6d28d9'; ctx.strokeStyle=OL; ctx.lineWidth=2;
  // left wing
  ctx.beginPath();
  ctx.moveTo(x+18,y-26);
  ctx.bezierCurveTo(x+4,y-30, x-10,y+wy*.6, x-6,y+wy);
  ctx.bezierCurveTo(x+2,y+wy*.3, x+10,y-22, x+18,y-26);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // right wing
  ctx.beginPath();
  ctx.moveTo(x+34,y-26);
  ctx.bezierCurveTo(x+48,y-30, x+62,y+wy*.6, x+58,y+wy);
  ctx.bezierCurveTo(x+50,y+wy*.3, x+42,y-22, x+34,y-26);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // wing inner detail
  ctx.strokeStyle='rgba(139,92,246,.5)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(x+18,y-26); ctx.bezierCurveTo(x+6,y-28,x-4,y+wy*.4,x-6,y+wy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+34,y-26); ctx.bezierCurveTo(x+46,y-28,x+56,y+wy*.4,x+58,y+wy); ctx.stroke();

  // body
  ctx.fillStyle='#8b5cf6'; ctx.strokeStyle=OL; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.ellipse(x+26,y-30,13,10,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // belly
  ctx.fillStyle='#c4b5fd';
  ctx.beginPath(); ctx.ellipse(x+26,y-26,6,6,0,0,Math.PI*2); ctx.fill();

  // neck
  ctx.fillStyle='#8b5cf6'; ctx.strokeStyle=OL; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.ellipse(x+37,y-34,5,8,.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // head
  ctx.fillStyle='#a78bfa'; ctx.strokeStyle=OL; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(x+46,y-36,10,8,-.1,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // crest on head
  ctx.fillStyle='#7c3aed'; ctx.strokeStyle=OL; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x+39,y-41); ctx.lineTo(x+44,y-52); ctx.lineTo(x+50,y-41); ctx.closePath(); ctx.fill(); ctx.stroke();
  // beak
  ctx.fillStyle='#fbbf24'; ctx.strokeStyle=OL; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(x+54,y-36); ctx.lineTo(x+66,y-33); ctx.lineTo(x+54,y-30); ctx.closePath(); ctx.fill(); ctx.stroke();
  // eye
  ctx.fillStyle='#fff'; ctx.strokeStyle=OL; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(x+48,y-38,3.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#1e1b4b'; ctx.beginPath(); ctx.arc(x+49,y-38,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+50,y-39,0.8,0,Math.PI*2); ctx.fill();
}

function drawTRex(x,y,lo){
  const a=Math.abs(lo);
  // tail — thick tapering
  ctx.strokeStyle='#991b1b'; ctx.lineWidth=15; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+10,y-32);
  ctx.bezierCurveTo(x-2,y-20,x-20,y-6,x-24,y-1); ctx.stroke();
  ctx.strokeStyle='#ef4444'; ctx.lineWidth=8; ctx.stroke();
  ctx.strokeStyle=OL; ctx.lineWidth=2; ctx.stroke();

  // back leg
  ctx.fillStyle='#b91c1c'; ctx.strokeStyle=OL; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(x+10,y-28+a*1.1,13,28,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#991b1b'; ctx.strokeStyle=OL; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(x+16,y+1,15,6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  [[-6,0],[0,1],[6,-1]].forEach(([dx])=>{
    ctx.strokeStyle=OL; ctx.lineWidth=1.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x+16+dx,y+5); ctx.lineTo(x+15+dx,y+11); ctx.stroke();
  });

  // body
  ctx.fillStyle='#ef4444'; ctx.strokeStyle=OL; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(x+28,y-42,22,21,-.08,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // belly
  ctx.fillStyle='#fca5a5';
  ctx.beginPath(); ctx.ellipse(x+30,y-36,10,14,-.1,0,Math.PI*2); ctx.fill();

  // front leg
  ctx.fillStyle='#b91c1c'; ctx.strokeStyle=OL; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(x+26,y-28+a,14,28,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#991b1b'; ctx.strokeStyle=OL; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(x+33,y+1,16,6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  [[-6,0],[0,1],[6,-1]].forEach(([dx])=>{
    ctx.strokeStyle=OL; ctx.lineWidth=1.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x+33+dx,y+5); ctx.lineTo(x+32+dx,y+11); ctx.stroke();
  });

  // tiny arms with claws
  ctx.strokeStyle='#b91c1c'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+42,y-52); ctx.lineTo(x+52,y-45); ctx.stroke();
  ctx.strokeStyle=OL; ctx.lineWidth=1.5; ctx.stroke();
  ctx.strokeStyle=OL; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(x+52,y-45); ctx.lineTo(x+57,y-41); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+52,y-45); ctx.lineTo(x+56,y-49); ctx.stroke();

  // neck
  ctx.fillStyle='#ef4444'; ctx.strokeStyle=OL; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(x+36,y-58,9,15,.15,0,Math.PI*2); ctx.fill(); ctx.stroke();

  // head — large, menacing
  ctx.fillStyle='#f87171'; ctx.strokeStyle=OL; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(x+43,y-70,18,13,-.05,0,Math.PI*2); ctx.fill(); ctx.stroke();

  // upper jaw
  ctx.fillStyle='#ef4444'; ctx.strokeStyle=OL; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x+28,y-64); ctx.bezierCurveTo(x+36,y-61,x+56,y-60,x+63,y-63);
  ctx.lineTo(x+63,y-68); ctx.bezierCurveTo(x+54,y-70,x+36,y-70,x+28,y-68);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // lower jaw
  ctx.fillStyle='#dc2626'; ctx.strokeStyle=OL; ctx.lineWidth=1.8;
  ctx.beginPath();
  ctx.moveTo(x+28,y-64); ctx.bezierCurveTo(x+36,y-66,x+54,y-66,x+63,y-64);
  ctx.lineTo(x+63,y-60); ctx.bezierCurveTo(x+54,y-58,x+36,y-58,x+28,y-60);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // teeth
  ctx.fillStyle='#fff'; ctx.strokeStyle=OL; ctx.lineWidth=1;
  for(let i=0;i<4;i++){
    ctx.beginPath(); ctx.moveTo(x+31+i*7,y-64); ctx.lineTo(x+33+i*7,y-57); ctx.lineTo(x+35+i*7,y-64);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // nostril
  ctx.fillStyle='#991b1b';
  ctx.beginPath(); ctx.ellipse(x+59,y-66,2.5,1.5,.3,0,Math.PI*2); ctx.fill();
  // eye — slit pupil
  ctx.fillStyle='#fef08a'; ctx.strokeStyle=OL; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(x+47,y-74,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#7f1d1d';
  ctx.beginPath(); ctx.ellipse(x+48,y-74,2.5,5,0,0,Math.PI*2); ctx.fill();

function drawAnky(x,y,lo){
  const a=Math.abs(lo);
  // tail with club
  ctx.strokeStyle='#4d7c0f'; ctx.lineWidth=8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+4,y-18);
  ctx.bezierCurveTo(x-4,y-14, x-14,y-8, x-20,y-16); ctx.stroke();
  ctx.strokeStyle=OL; ctx.lineWidth=2; ctx.stroke();
  // tail club (spiky ball)
  ctx.fillStyle='#65a30d'; ctx.strokeStyle=OL; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x-22,y-17,9,0,Math.PI*2); ctx.fill(); ctx.stroke();
  for(let i=0;i<5;i++){
    const ca=i*Math.PI*2/5, cr=9;
    ctx.fillStyle='#84cc16'; ctx.strokeStyle=OL; ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(x-22+Math.cos(ca)*cr, y-17+Math.sin(ca)*cr);
    ctx.lineTo(x-22+Math.cos(ca)*(cr+6), y-17+Math.sin(ca)*(cr+6));
    ctx.lineTo(x-22+Math.cos(ca+.4)*cr, y-17+Math.sin(ca+.4)*cr);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // 4 stubby legs
  [4,16,28,40].forEach(lx=>{
    ctx.fillStyle='#4d7c0f'; ctx.strokeStyle=OL; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.roundRect(x+lx,y-15+a,9,15,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#3a5c09';
    ctx.beginPath(); ctx.ellipse(x+lx+4,y+1,7,4,0,0,Math.PI*2); ctx.fill();

  // armoured body — wide dome
  ctx.fillStyle='#84cc16'; ctx.strokeStyle=OL; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(x+27,y-26,30,16,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // armour plates (hexagon-like patches)
  ctx.fillStyle='#65a30d'; ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=1;
  [[x+10,y-32,8],[x+22,y-38,9],[x+34,y-38,9],[x+46,y-32,8],[x+16,y-28,6],[x+38,y-28,6]].forEach(([px,py,pr])=>{
    ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fill(); ctx.stroke();
  });
  // dorsal spikes (alternating)
  ctx.strokeStyle=OL; ctx.lineWidth=1.5;
  [0,1,2,3,4,5].forEach(i=>{
    const sh=i%2===0?14:10;
    ctx.fillStyle=i%2===0?'#a3e635':'#65a30d';
    ctx.beginPath();
    ctx.moveTo(x+6+i*9,y-38); ctx.lineTo(x+10+i*9,y-38-sh); ctx.lineTo(x+14+i*9,y-38);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });
  // head (small, beaked)
  ctx.fillStyle='#bef264'; ctx.strokeStyle=OL; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(x+56,y-22,10,8,-.1,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // beak
  ctx.fillStyle='#a3e635'; ctx.strokeStyle=OL; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x+64,y-22); ctx.lineTo(x+72,y-19); ctx.lineTo(x+72,y-25); ctx.closePath(); ctx.fill(); ctx.stroke();
  // eye
  ctx.fillStyle='#fff'; ctx.strokeStyle=OL; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(x+55,y-25,3.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#14532d'; ctx.beginPath(); ctx.arc(x+56,y-25,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+57,y-26,0.8,0,Math.PI*2); ctx.fill();
}

  ctx.beginPath(); ctx.arc(x+38,y-72,5,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#164e63';
  ctx.beginPath(); ctx.ellipse(x+39,y-72,1.8,4,0,0,Math.PI*2); ctx.fill();

// ─── COINS ────────────────────────────────────────────────────────────────────
function drawCoins(){
  phaseCoins.forEach(coin=>{
    if(coin.collected) return;
    const cx = coin.x - scrollX;
    if(cx < -30 || cx > W + 30) return;
    const cy = coin.y + Math.sin(coin.bob) * 4;
    // glow
    ctx.fillStyle='rgba(251,191,36,0.25)';
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.fill();
    // outer circle
    ctx.fillStyle='#fbbf24';
    ctx.strokeStyle='#92400e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // inner highlight
    ctx.fillStyle='#fde68a';
    ctx.beginPath(); ctx.arc(cx - 2, cy - 2, 4, 0, Math.PI*2); ctx.fill();
  });
}

// ─── SPIKE TRAPS ──────────────────────────────────────────────────────────────
function drawTraps(){
  phaseTraps.forEach(trap=>{
    const tx = trap.x - scrollX;
    if(tx < -60 || tx > W + 60) return;
    const ty = trap.y;
    const spikeW = 7, spikeH = trap.h, count = 4;
    for(let i = 0; i < count; i++){
      const sx = tx + i * spikeW;
      ctx.fillStyle='#475569';
      ctx.strokeStyle=OL; ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(sx, ty);
      ctx.lineTo(sx + spikeW/2, ty - spikeH);
      ctx.lineTo(sx + spikeW, ty);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  });
}

// ─── POWER-UP ITEMS ───────────────────────────────────────────────────────────
function drawPowerupItems(){
  const puColors = {speed:'#fb923c', shield:'#60a5fa', fire:'#ef4444'};
  const puIcons  = {speed:'⚡', shield:'🛡', fire:'🔥'};
  powerupItems.forEach(item=>{
    if(item.collected) return;
    const ix = item.x - scrollX;
    if(ix < -40 || ix > W + 40) return;
    const iy = item.y + Math.sin(item.bob) * 4;
    // glow
    ctx.fillStyle = puColors[item.type] + '44';
    ctx.beginPath(); ctx.arc(ix + 10, iy - 10, 18, 0, Math.PI*2); ctx.fill();
    // box
    ctx.fillStyle = puColors[item.type];
    ctx.strokeStyle = OL; ctx.lineWidth = 2;
    roundRect(ctx, ix, iy - 20, 20, 20, 5, true, true);
    // icon
    ctx.font = '12px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(puIcons[item.type], ix + 10, iy - 10);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  });
}

function drawSecrets(){
  phaseSecrets.forEach(sec=>{
    if(sec.found) return;
    const sx = sec.x - scrollX;
    if(sx < -40 || sx > W+40) return;
    const sy = sec.y + Math.sin(frameCount*.08)*3;
    ctx.save();
    ctx.globalAlpha = 0.38 + Math.sin(frameCount*.08)*0.18;
    ctx.fillStyle='#a78bfa';
    ctx.strokeStyle=OL; ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+i*Math.PI*2/5;
      const r=i%2===0?12:5;
      const px=sx+Math.cos(a)*r, py=sy+Math.sin(a)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  });
}

function drawCheckpoint(){
  const x = checkpointX - scrollX;
  if(x < -50 || x > W+50) return;
  const y = GROUND;
  ctx.save();
  ctx.strokeStyle = checkpointReached ? '#4ecdc4' : '#64748b';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-82); ctx.stroke();
  ctx.fillStyle = checkpointReached ? '#4ecdc4' : '#94a3b8';
  ctx.strokeStyle = OL; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x+2,y-78); ctx.lineTo(x+44,y-66); ctx.lineTo(x+2,y-54);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  if(checkpointReached){
    ctx.fillStyle='rgba(78,205,196,.16)';
    ctx.beginPath(); ctx.arc(x,y-38,34,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}


// ─── PORTAL ───────────────────────────────────────────────────────────────────
function drawPortal(x,active){
  const t=frameCount*.05;
  const pw=64,ph=110,py=GROUND-ph;
  const cx2=x+pw/2;
  if(active){
    ctx.fillStyle=`rgba(20,184,166,${.12+Math.sin(t)*.06})`;
    ctx.beginPath(); ctx.ellipse(cx2,py+ph*.5,pw*.9,ph*.72,0,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = active ? `rgba(20,184,166,${.28+Math.sin(t)*.1})` : 'rgba(60,60,80,.1)';
  ctx.beginPath();
  ctx.moveTo(x+4,py+ph); ctx.lineTo(x+4,py+ph*.35);
  ctx.bezierCurveTo(x+4,py,x+pw-4,py,x+pw-4,py+ph*.35);
  ctx.lineTo(x+pw-4,py+ph); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=OL; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x+4,py+ph); ctx.lineTo(x+4,py+ph*.35);
  ctx.bezierCurveTo(x+4,py,x+pw-4,py,x+pw-4,py+ph*.35);
  ctx.lineTo(x+pw-4,py+ph); ctx.stroke();
  ctx.strokeStyle=active?'#14b8a6':'#475569'; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x+4,py+ph); ctx.lineTo(x+4,py+ph*.35);
  ctx.bezierCurveTo(x+4,py,x+pw-4,py,x+pw-4,py+ph*.35);
  ctx.lineTo(x+pw-4,py+ph); ctx.stroke();
  if(active){
    for(let i=0;i<5;i++){
      const ang = Math.PI + i*(Math.PI/4) + t*.5;
      const rx=cx2+Math.cos(ang)*28, ry=(py+ph*.35-22)+Math.sin(ang)*22;
      circle(ctx,rx,ry,4,'#5eead4');
    }
  }
  ctx.fillStyle=active?'#14b8a6':'#64748b';
  ctx.font='7px "Press Start 2P"';
  ctx.textAlign='center';
  ctx.fillText(active?tr('enter'):tr('collectEggs'),cx2,py-10);
  ctx.textAlign='left';
}

function drawSecretPortal(x){
  const t=frameCount*.08, pw=54, ph=96, py=GROUND-ph;
  ctx.save();
  ctx.fillStyle=`rgba(167,139,250,${.22+Math.sin(t)*.08})`;
  ctx.beginPath(); ctx.ellipse(x+pw/2,py+ph/2,pw*.75,ph*.62,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=OL; ctx.lineWidth=4;
  ctx.beginPath();

// ─── PLAYER SPRITES ───────────────────────────────────────────────────────────
// drawDinoOn / drawCavemanOn: desenha no contexto c passado, com escala s
// drawAccessory: desenha TODOS os acessórios ativos do personagem
function drawAccessory(c,char,x,y,ducking=false){
  const accs = Array.isArray(selectedAccessory[char])
    ? selectedAccessory[char]
    : (selectedAccessory[char] && selectedAccessory[char]!=='none' ? [selectedAccessory[char]] : []);
  if(accs.length===0) return;
  const isDino = char === 'dino';
  const ax0 = isDino ? (ducking ? x+43 : x+42) : x+24;
  const ay0 = isDino ? (ducking ? y-30 : y-70) : y-60;
  c.save();
  c.lineCap='round'; c.lineJoin='round';
  // cada acessório tem posição fixa na cabeça (não empilha)
  accs.forEach((acc)=>{
    const ax = ax0, ay = ay0;
    if(acc==='sunglasses'){
      c.fillStyle='#111827'; c.strokeStyle=OL; c.lineWidth=1.5;
      c.beginPath(); c.roundRect(ax-8,ay-3,7,5,2); c.fill(); c.stroke();
      c.beginPath(); c.roundRect(ax+1,ay-3,7,5,2); c.fill(); c.stroke();
      c.strokeStyle='#111827'; c.lineWidth=2; c.beginPath(); c.moveTo(ax-1,ay-1); c.lineTo(ax+1,ay-1); c.stroke();
    } else if(acc==='glasses'){
      c.strokeStyle='#0f172a'; c.lineWidth=1.8;
      c.beginPath(); c.arc(ax-5,ay-1,4,0,Math.PI*2); c.stroke();
      c.beginPath(); c.arc(ax+5,ay-1,4,0,Math.PI*2); c.stroke();
      c.beginPath(); c.moveTo(ax-1,ay-1); c.lineTo(ax+1,ay-1); c.stroke();
    } else if(acc==='cap'){
      // boné fica no topo da cabeça
      c.fillStyle='#ef4444'; c.strokeStyle=OL; c.lineWidth=1.8;
      c.beginPath(); c.ellipse(ax,ay-15,13,7,0,Math.PI,Math.PI*2); c.fill(); c.stroke();
      c.fillStyle='#dc2626'; c.beginPath(); c.ellipse(ax+9,ay-12,10,3.5,.15,0,Math.PI*2); c.fill(); c.stroke();
    } else if(acc==='headphones'){
      // fone envolve a cabeça
      c.strokeStyle='#111827'; c.lineWidth=3;
      c.beginPath(); c.arc(ax,ay-9,15,Math.PI*1.05,Math.PI*1.95); c.stroke();
      c.fillStyle='#38bdf8'; c.strokeStyle=OL; c.lineWidth=1.5;
      c.beginPath(); c.roundRect(ax-16,ay-8,7,12,3); c.fill(); c.stroke();
      c.beginPath(); c.roundRect(ax+9,ay-8,7,12,3); c.fill(); c.stroke();
    } else if(acc==='bow'){
      // laço no topo da cabeça (lado)
      c.fillStyle='#f472b6'; c.strokeStyle=OL; c.lineWidth=1.5;
      c.beginPath(); c.moveTo(ax+6,ay-16); c.lineTo(ax-4,ay-23); c.lineTo(ax-1,ay-11); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(ax+8,ay-16); c.lineTo(ax+19,ay-23); c.lineTo(ax+16,ay-11); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.arc(ax+7,ay-16,3,0,Math.PI*2); c.fill(); c.stroke();
    }
  });
  c.restore();
}

function drawDinoOn(c,x,y,frame,ducking,s){
  const ft=frameCount*.14;
  const moving=Math.abs(player.vx)>0.1;
  const lo=ducking?0:(moving?Math.sin(ft)*5:0);
  const skin = skinPalette('dino');
  c.save(); c.translate(x,y); c.scale(s,s); c.translate(-x,-y);

  // ground shadow
  c.fillStyle='rgba(0,0,0,0.18)';
  c.beginPath(); c.ellipse(x+26,y+2,28,7,0,0,Math.PI*2); c.fill();

  if(!ducking){
    // tail — thick bezier with gradient
    const tg = c.createLinearGradient(x+12,y-28,x-22,y-1);
    tg.addColorStop(0,skin.dark); tg.addColorStop(1,skin.primary);
    c.strokeStyle=tg; c.lineWidth=13; c.lineCap='round';
    c.beginPath(); c.moveTo(x+12,y-28);
    c.bezierCurveTo(x-2,y-18, x-18,y-6, x-22,y-1); c.stroke();
    c.strokeStyle=skin.light; c.lineWidth=5; c.globalAlpha=0.35; c.stroke();
    c.globalAlpha=1;

    // back leg
    const lg1 = c.createLinearGradient(x+14,0,x+26,0);
    lg1.addColorStop(0,skin.dark); lg1.addColorStop(1,skin.foot);
    c.fillStyle=lg1; c.strokeStyle=OL; c.lineWidth=2;
    c.beginPath(); c.roundRect(x+14,y-26+Math.abs(lo*.8),12,26,5); c.fill(); c.stroke();
    c.fillStyle=skin.foot; c.strokeStyle=OL; c.lineWidth=1.5;
    c.beginPath(); c.ellipse(x+20,y+1,14,5,0,0,Math.PI*2); c.fill(); c.stroke();
    [[-5,0],[0,1],[5,-1]].forEach(([dx])=>{
      c.strokeStyle=skin.dark; c.lineWidth=2; c.lineCap='round';
      c.beginPath(); c.moveTo(x+20+dx,y+5); c.lineTo(x+19+dx,y+10); c.stroke();
    });

    // body — radial gradient for 3D look
    const bg = c.createRadialGradient(x+20,y-42,4, x+26,y-36,26);
    bg.addColorStop(0,skin.light); bg.addColorStop(0.5,skin.primary); bg.addColorStop(1,skin.dark);
    c.fillStyle=bg; c.strokeStyle=OL; c.lineWidth=2.5;
    c.beginPath(); c.ellipse(x+26,y-36,21,24,-.05,0,Math.PI*2); c.fill(); c.stroke();
    // belly highlight
    c.fillStyle=skin.belly;
    c.beginPath(); c.ellipse(x+29,y-30,9,14,-.1,0,Math.PI*2); c.fill();

function drawCavemanOn(c,x,y,frame,ducking,s){
  const ft=frameCount*.14;
  const bh=ducking?30:56;
  const moving = Math.abs(player.vx) > 0.1;
  const lo=ducking?0:(moving?Math.sin(ft)*5:0);
  const look = skinPalette('caveman');
  // flip horizontalmente se virado para a esquerda
  const facingDir = (s===1) ? player.facing : 1;
  c.save();
  if(facingDir===-1){
    c.translate(x + player.w, y); c.scale(-s, s); c.translate(-x, -y);
  } else {
    c.translate(x,y); c.scale(s,s); c.translate(-x,-y);
  }

  const skinDark=look.bodyDark, skin=look.body, skinLight=look.skin;

  // club (in hand) — swing animado quando atacando
  if(!ducking){
    // progresso do swing: 0=início, 1=fim
    const swingP = player.attacking ? 1-(player.attackTimer/22) : 0;
    // ângulo: repouso=0.4rad (diagonal pra baixo), swing: -1.1rad (acima) → 1.0rad (abaixo)
    const baseAngle = 0.4;
    const swingAngle = player.attacking
      ? (-1.1 + swingP * 2.3) * player.attackDir
      : baseAngle * (player.attackDir>0?1:1);
    const armX = x + (player.attackDir>0 ? 40 : 8);
    const armY = y-40;
    const clavLen = 28;
    const tipX = armX + Math.cos(swingAngle)*clavLen * player.attackDir;
    const tipY = armY + Math.sin(swingAngle)*clavLen;

    // trail de swing (linhas amarelas nos frames ativos)
    if(player.attacking && player.attackTimer<=18 && player.attackTimer>=6){
      for(let t2=0;t2<4;t2++){
        const tp = 1-((player.attackTimer+t2*2)/22);
        const ta = (-1.1+tp*2.3)*player.attackDir;
        const tx2=armX+Math.cos(ta)*clavLen*player.attackDir, ty2=armY+Math.sin(ta)*clavLen;
        c.globalAlpha=(t2+1)/7;
        c.strokeStyle='#fbbf24'; c.lineWidth=6; c.lineCap='round';
        c.beginPath(); c.moveTo(armX,armY); c.lineTo(tx2,ty2); c.stroke();
      }
      c.globalAlpha=1;
    }

    // cabo
    c.strokeStyle=look.club; c.lineWidth=7; c.lineCap='round';
    c.beginPath(); c.moveTo(armX,armY); c.lineTo(tipX,tipY); c.stroke();
    // cabeça da clava
    c.fillStyle=look.club; c.strokeStyle=OL; c.lineWidth=2;
    c.beginPath(); c.ellipse(tipX,tipY,9,7,swingAngle,0,Math.PI*2); c.fill(); c.stroke();
    // espinhos da clava
    for(let i=0;i<5;i++){
      const sa=swingAngle+i*(Math.PI*2/5);
      c.strokeStyle='#9ca3af'; c.lineWidth=2;
      c.beginPath();
      c.moveTo(tipX+Math.cos(sa)*7,tipY+Math.sin(sa)*6);
      c.lineTo(tipX+Math.cos(sa)*13,tipY+Math.sin(sa)*11);
      c.stroke();
    }
  }

  // legs
  if(!ducking){
    block(c,x+12,y-22+Math.abs(lo),13,22,7,skinDark);
    block(c,x+28,y-22+Math.abs(lo),13,22,7,skinDark);
    block(c,x+9,y-5,16,7,4,look.boot);
    block(c,x+26,y-5,16,7,4,look.boot);
  } else {
    block(c,x+8,y-14,14,14,6,skinDark);
    block(c,x+26,y-14,14,14,6,skinDark);
  }

  // waistband
  c.fillStyle=skinDark; c.strokeStyle=OL; c.lineWidth=1.5;
  c.beginPath(); c.ellipse(x+24,y-13,17,8,0,0,Math.PI*2); c.fill(); c.stroke();

  // body
  c.fillStyle=skin; c.strokeStyle=OL; c.lineWidth=2.5;
  c.beginPath(); c.ellipse(x+24,y-(ducking?20:36),19,ducking?13:22,0,0,Math.PI*2); c.fill(); c.stroke();

  if(!ducking){
    // arm
    block(c,x+36,y-40,10,5,4,skin);
    // head
    c.fillStyle=skinLight; c.strokeStyle=OL; c.lineWidth=2.5;
    c.beginPath(); c.arc(x+24,y-60,15,0,Math.PI*2); c.fill(); c.stroke();
    // hair base
    c.fillStyle=look.hair; c.strokeStyle=OL; c.lineWidth=1.5;
    c.beginPath(); c.ellipse(x+24,y-72,14,6,0,Math.PI,Math.PI*2); c.fill(); c.stroke();
    // hair triangles
    for(let i=0;i<3;i++){
      c.beginPath(); c.moveTo(x+13+i*8,y-72); c.lineTo(x+17+i*8,y-84+Math.sin(ft+i)*.4); c.lineTo(x+21+i*8,y-72);
      c.closePath(); c.fill(); c.stroke();
    }
    // eyebrows
    c.strokeStyle=look.hair; c.lineWidth=3; c.lineCap='round';
    c.beginPath(); c.moveTo(x+14,y-65); c.lineTo(x+21,y-68); c.stroke();
    c.beginPath(); c.moveTo(x+27,y-68); c.lineTo(x+34,y-65); c.stroke();
    // eyes
    c.fillStyle='#fff'; c.strokeStyle=OL; c.lineWidth=1.5;
    c.beginPath(); c.arc(x+17,y-61,4.5,0,Math.PI*2); c.fill(); c.stroke();
    c.beginPath(); c.arc(x+31,y-61,4.5,0,Math.PI*2); c.fill(); c.stroke();
    c.fillStyle='#1c1917'; c.beginPath(); c.arc(x+18,y-61,2.8,0,Math.PI*2); c.fill();
    c.fillStyle='#1c1917'; c.beginPath(); c.arc(x+32,y-61,2.8,0,Math.PI*2); c.fill();
    c.fillStyle='#fff'; c.beginPath(); c.arc(x+16,y-62,1.2,0,Math.PI*2); c.fill();
    c.fillStyle='#fff'; c.beginPath(); c.arc(x+30,y-62,1.2,0,Math.PI*2); c.fill();
    // nose (circle, simpler)
    circle(c,x+24,y-57,4,skinDark);
    // beard (semicircle)
    c.fillStyle=skinDark; c.strokeStyle=OL; c.lineWidth=1.5;
    c.beginPath(); c.arc(x+24,y-50,10,.1,Math.PI-.1); c.fill(); c.stroke();
    drawAccessory(c,'caveman',x,y,false);
  }
  c.restore();
}

  c.beginPath(); c.ellipse(x+32,y-27,7,10,.15,0,Math.PI*2); c.fill(); c.stroke();

  // head — round big cat head
  c.fillStyle=skin.light; c.strokeStyle=OL; c.lineWidth=2;
  c.beginPath(); c.ellipse(x+37,y-36,13,11,0,0,Math.PI*2); c.fill(); c.stroke();

  // ears
  c.fillStyle=skin.primary; c.strokeStyle=OL; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(x+27,y-44); c.lineTo(x+30,y-53); c.lineTo(x+34,y-44); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(x+38,y-45); c.lineTo(x+41,y-54); c.lineTo(x+45,y-45); c.closePath(); c.fill(); c.stroke();
  // inner ear
  c.fillStyle='#fca5a5';
  c.beginPath(); c.moveTo(x+28,y-45); c.lineTo(x+30,y-51); c.lineTo(x+33,y-45); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(x+39,y-46); c.lineTo(x+41,y-51); c.lineTo(x+44,y-46); c.closePath(); c.fill();

  // muzzle bump
  c.fillStyle='#fef3c7'; c.strokeStyle=OL; c.lineWidth=1.5;
  c.beginPath(); c.ellipse(x+37,y-33,7,5,0,0,Math.PI*2); c.fill(); c.stroke();

  // nose
  c.fillStyle=skin.nose; c.strokeStyle=OL; c.lineWidth=1;
  c.beginPath(); c.ellipse(x+37,y-30,3.5,2.5,0,0,Math.PI*2); c.fill(); c.stroke();

  // eyes (front-facing big cat eyes)
  c.fillStyle='#fff'; c.strokeStyle=OL; c.lineWidth=1.5;
  c.beginPath(); c.arc(x+30,y-38,4.5,0,Math.PI*2); c.fill(); c.stroke();
  c.beginPath(); c.arc(x+42,y-38,4.5,0,Math.PI*2); c.fill(); c.stroke();
  // amber irises
  c.fillStyle='#d97706';
  c.beginPath(); c.arc(x+30,y-38,3,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+42,y-38,3,0,Math.PI*2); c.fill();
  // slit pupils
  c.fillStyle=OL;
  c.beginPath(); c.ellipse(x+30,y-38,1.2,2.8,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+42,y-38,1.2,2.8,0,0,Math.PI*2); c.fill();
  // highlights
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x+29,y-39,1,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+41,y-39,1,0,Math.PI*2); c.fill();

  // long saber fangs
  c.fillStyle='#fefce8'; c.strokeStyle=OL; c.lineWidth=1.2;
  c.beginPath(); c.moveTo(x+31,y-29); c.bezierCurveTo(x+30,y-24,x+29,y-21,x+30,y-18); c.lineTo(x+33,y-21); c.bezierCurveTo(x+34,y-24,x+34,y-29,x+33,y-29); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(x+40,y-29); c.bezierCurveTo(x+39,y-24,x+38,y-21,x+39,y-18); c.lineTo(x+42,y-21); c.bezierCurveTo(x+43,y-24,x+43,y-29,x+42,y-29); c.closePath(); c.fill(); c.stroke();

  // whisker lines
  c.strokeStyle='rgba(255,255,255,0.7)'; c.lineWidth=1; c.lineCap='round';
  [[-1,0],[1,2],[3,4]].forEach(([a,b])=>{
    c.beginPath(); c.moveTo(x+42,y-32+a); c.lineTo(x+50,y-31+b); c.stroke();
    c.beginPath(); c.moveTo(x+32,y-32+a); c.lineTo(x+24,y-31+b); c.stroke();
  });

  c.restore();
}

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
// ─── FIRE BREATH ──────────────────────────────────────────────────────────────
function drawFireBreath(){
  if(!player.attacking || selectedChar!=='dino') return;
  const progress = 1 - player.attackTimer/26; // 0→1 over attack duration
  const fade = player.attackTimer <= 6 ? player.attackTimer/6 : 1;
  const dir = player.attackDir;
  // origin: dino snout
  const ox = dir>0 ? player.x+60 : player.x-12;
  const oy = player.y-60;
  const maxLen = activeEffects.fire > 0 ? 138 : 96;
  const len = maxLen * Math.min(1, progress*2.4);
  const layers = [
    { col:'#fef08a', rad:13, offset:0    },
    { col:'#fb923c', rad:10, offset:.25  },
    { col:'#ef4444', rad:7,  offset:.55  },
  ];
  ctx.save();
  for(const {col,rad,offset} of layers){
    const count = 5;
    for(let i=0;i<count;i++){
      const t2 = (i/count) + offset;
      if(t2 > progress) continue;
      const fx = ox + dir * t2 * len + Math.sin(frameCount*.3+i*1.3)*(3+i*1.5)*(1-t2);
      const fy = oy + Math.cos(frameCount*.25+i*0.9)*(2+i*1.2)*(1-t2);
      const r  = rad * (1 - t2*.55);
      ctx.globalAlpha = fade * (0.85 - t2*.4);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI*2); ctx.fill();
    }
  }
  // heat shimmer ring at tip
  if(progress > .4){
    const tx = ox + dir*len, ty = oy;
    ctx.globalAlpha = fade * .5;
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(tx, ty, 8+progress*6, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ─── WIN SCENE ────────────────────────────────────────────────────────────────
function drawCrackingEgg(ex, ey, t, idx){
  const eggColors  = ['#fef3c7','#fce7f3','#e0f2fe','#d1fae5','#ede9fe'];
  const dinoColors = ['#22c55e','#f97316','#60a5fa','#facc15','#e879f9'];
  const col = eggColors[idx];
  const dcol = dinoColors[idx];
  const shake = (t>3 && t<48) ? Math.sin(t*1.1)*(3-t/20) : 0;
  const cx = ex + shake;

  if(t < 55){
    // whole egg
    ctx.fillStyle=col; ctx.strokeStyle=OL; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.ellipse(cx, ey, 22, 28, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // cracks appear at t>18
    if(t>18){
      const cp = Math.min(1,(t-18)/30);
      ctx.strokeStyle=OL; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(cx,ey-12); ctx.lineTo(cx+7*cp,ey-2); ctx.lineTo(cx-5*cp,ey+9*cp); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-10,ey-6); ctx.lineTo(cx-3*cp,ey+6*cp); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+8,ey-8); ctx.lineTo(cx+4*cp,ey+4*cp); ctx.stroke();
    }
  } else {
    // egg splits open
    const openP = Math.min(1,(t-55)/35);
    const liftY  = openP * 30;

    // bottom shell
    ctx.fillStyle=col; ctx.strokeStyle=OL; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.ellipse(cx, ey+6, 22, 20, 0, 0, Math.PI); ctx.fill(); ctx.stroke();

    // baby dino peeks out — proper dino silhouette
    if(t > 65){
      const peekP = Math.min(1,(t-65)/30);
      const hy = ey + 4 - peekP*22;
      const sc = peekP;
      const headColors=['#86efac','#fdba74','#bfdbfe','#fef08a','#f5d0fe'];
      const hcol = headColors[idx];

      // tail hint (left side)
      ctx.strokeStyle=dcol; ctx.lineWidth=Math.max(1,5*sc); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(cx-8*sc,hy+6); ctx.quadraticCurveTo(cx-18*sc,hy+2,cx-20*sc,hy-4); ctx.stroke();

      // body
      ctx.fillStyle=dcol; ctx.strokeStyle=OL; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(cx, hy+5, 14*sc, 10*sc, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

      if(peekP > 0.4){
        // dorsal spike
        ctx.fillStyle='#fbbf24'; ctx.strokeStyle=OL; ctx.lineWidth=1.2;
        ctx.beginPath();
        ctx.moveTo(cx-5,hy-4); ctx.lineTo(cx,hy-14*sc); ctx.lineTo(cx+5,hy-4);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // neck
        ctx.fillStyle=dcol; ctx.strokeStyle=OL; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.ellipse(cx+10*sc, hy, 5*sc, 8*sc, 0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        // head (offset to right)
        ctx.fillStyle=hcol; ctx.strokeStyle=OL; ctx.lineWidth=1.8;
        ctx.beginPath(); ctx.arc(cx+17*sc, hy-5, 9*sc, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        // snout triangle (pointing right)
        ctx.fillStyle=dcol; ctx.strokeStyle=OL; ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(cx+22*sc,hy-5); ctx.lineTo(cx+29*sc,hy-2); ctx.lineTo(cx+29*sc,hy-8);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // eye (single, on head)
        ctx.fillStyle='#fff'; ctx.strokeStyle=OL; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(cx+15*sc, hy-8, 3.5*sc, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#1e3a8a'; ctx.beginPath(); ctx.arc(cx+16*sc, hy-8, 2*sc, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx+17*sc, hy-9, 0.9, 0, Math.PI*2); ctx.fill();
      }
    }

    // top shell rises above baby
    ctx.fillStyle=col; ctx.strokeStyle=OL; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.ellipse(cx, ey-6-liftY, 22, 20, 0, Math.PI, Math.PI*2); ctx.fill(); ctx.stroke();

    // burst sparkles when egg first opens
    if(t >= 55 && t < 78){
      const sp = (t-55)/23;
      for(let s=0;s<8;s++){
        const ang = (s/8)*Math.PI*2;
        const sr = 18+sp*40;
        const sx2 = cx+Math.cos(ang)*sr, sy2 = ey+Math.sin(ang)*sr*.55;
        ctx.globalAlpha = 1-sp;
        ctx.fillStyle = ['#fbbf24','#34d399','#60a5fa','#f472b6','#a78bfa'][s%5];
        ctx.beginPath(); ctx.arc(sx2,sy2,3.5,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
    }
  }
}

function drawWinScene(){
  // dark overlay fade in
  const fadeA = Math.min(0.88, winTimer/40);
  ctx.fillStyle=`rgba(4,8,28,${fadeA})`;
  ctx.fillRect(0,0,W,H);

  // title
  const ta = Math.min(1,(winTimer-10)/25);
  if(ta>0){
    ctx.globalAlpha=ta;
    ctx.fillStyle='#fbbf24'; ctx.font='bold 20px "Press Start 2P"';
    ctx.textAlign='center';
    ctx.fillText(tr('win'), W/2, 68);
    ctx.fillStyle='#a5f3fc'; ctx.font='8px "Press Start 2P"';
    ctx.fillText(tr('hatching'), W/2, 96);
    ctx.globalAlpha=1;
  }

  // 5 eggs staggered
  const delays = [0, 35, 70, 105, 140];
  const ey = 300;
  const spacing = 130;
  const startX = W/2 - spacing*2;
  for(let i=0;i<5;i++){
    const t = Math.max(0, winTimer - delays[i]);
    drawCrackingEgg(startX + i*spacing, ey, t, i);
  }

  // score fades in after all eggs open
  if(winTimer > 260){
    const sa = Math.min(1,(winTimer-260)/30);
    ctx.globalAlpha=sa;
    ctx.fillStyle='#fef9c3'; ctx.font='11px "Press Start 2P"';
    ctx.textAlign='center';
    ctx.fillText(tr('finalScore', score), W/2, 400);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

function quitGame(){
  if(state === 'menu') return;
  if(!confirm(`${tr('quitTitle')}\n${tr('quitBody')}`)) return;
  paused = false;
  stopBGM();
  state = 'menu';
  renderMainMenu();
}

function togglePause(){
  if(state !== 'playing') return;
  paused = !paused;
  const btn = document.getElementById('pauseBtn');
  if(btn){ btn.textContent = paused ? '▶' : '⏸'; btn.classList.toggle('paused', paused); }
  if(paused) stopBGM(); else startBGM((phase-1) % BGMS.length);
}

function drawPauseOverlay(){
  ctx.fillStyle='rgba(4,8,18,.72)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fbbf24';
  ctx.font='bold 28px "Press Start 2P"';
  ctx.textAlign='center';
  ctx.fillText(tr('paused'),W/2,H/2-18);
  ctx.fillStyle='#7a8fa8';
  ctx.font='8px "Press Start 2P"';
  ctx.fillText(tr('pauseHint'),W/2,H/2+16);
  ctx.textAlign='left';
}

setHudButtonTitles();

function loop(){
  try{
    if(!paused){ update(); draw(); }
    else { draw(); drawPauseOverlay(); }
    updateMobileControls();
  } catch(e){
    // Never let a draw/update error kill the game loop
    console.error('DinoGame loop error:', e);
  }
  requestAnimationFrame(loop);
}
// ─── LOADING SCREEN ──────────────────────────────────────────────────────────
(function initLoading(){
  const bar = document.getElementById('loadBar');
  const ls = document.getElementById('loadingScreen');
  const ov = document.getElementById('overlay');
  let pct = 0;
  const tick = setInterval(()=>{
    pct = Math.min(pct + 8 + Math.random()*12, 90);
    if(bar) bar.style.width = pct+'%';
  }, 120);
  document.fonts.ready.then(()=>{
    clearInterval(tick);
    if(bar) bar.style.width = '100%';
    setTimeout(()=>{
      if(ls) ls.style.display = 'none';
      if(ov) ov.style.display = 'flex';
    }, 400);
  });
  // fallback se fonts.ready não disparar
  setTimeout(()=>{
    clearInterval(tick);
    if(ls) ls.style.display = 'none';
    if(ov) ov.style.display = 'flex';
  }, 4000);
})();

initMobileDpad();
requestAnimationFrame(loop);
</script>
