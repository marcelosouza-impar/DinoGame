<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DinoGame</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* ── DESIGN TOKENS (Bubble Day) ── */
  :root{
    --sky:#8ED8FF; --grass:#7ED957; --grass-dark:#5CC96B; --sun:#FFD23F; --cream:#FFF8E7;
    --ink:#2B2A4C; --ink-soft:#4A4968; --coral:#FF6B6B; --orange:#FF9F6B; --grape:#B18CFF;
    --blue:#5BC0FF; --dirt:#C98B5B; --sidewalk:#FFE9B8; --road:#7A7798; --white:#FFFFFF;
    --font-display:'Fredoka',system-ui,sans-serif;
    --font-ui:'Nunito',system-ui,sans-serif;
    --fs-title:48px; --fs-btn-1:28px; --fs-btn-2:21px; --fs-ui:16px; --fs-label:13px; --fs-min:12px;
    --stroke:3px; --stroke-strong:4px; --radius-card:22px; --radius-pill:999px;
    --shadow-1:0 4px 0 var(--ink); --shadow-2:0 5px 0 var(--ink); --shadow-3:0 7px 0 var(--ink);
    --hit-min:44px;
    --spring:cubic-bezier(.34,1.56,.64,1); --t-fast:.15s;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    background:var(--sky);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;font-family:var(--font-ui);
    user-select:none;
  }
  #gameContainer{
    position:relative;
    /* overflow NOT hidden — allows overlays/menus to scroll */
    transform-origin:top left;
    box-shadow:var(--shadow-2);
    border-radius:14px;
  }
  canvas{display:block;border-radius:14px;image-rendering:pixelated;}

  /* ── HUD BUTTONS ── */
  #hudBtns{position:absolute;top:8px;right:10px;display:flex;gap:6px;z-index:10;}
  .hbtn,.btn-icon{width:44px;height:44px;border-radius:50%;background:var(--white);
    border:var(--stroke) solid var(--ink);box-shadow:var(--shadow-1);
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink);font-family:var(--font-ui);font-size:16px;padding:0;
    cursor:pointer;transition:transform var(--t-fast) var(--spring);}
  .hbtn:hover,.btn-icon:hover{transform:translateY(-3px) scale(1.03);}
  .hbtn:active,.btn-icon:active{transform:translateY(3px);}
  .hbtn.muted{opacity:.5;}
  .hbtn.paused{border-color:var(--sun);}
  .hbtn.quit{border-color:var(--coral);color:var(--coral);}
  .hbtn.quit:hover{background:rgba(255,107,107,.12);}

  /* ── OVERLAY ── */
  #overlay{
    position:fixed;inset:0;
    background:var(--sky);
    display:flex;flex-direction:column;align-items:center;
    padding:0;
    z-index:20;color:var(--ink);text-align:center;
    overflow:hidden;justify-content:center;
  }
  #overlay > *{transform-origin:center center;flex-shrink:0;margin:0;}
  #overlay.ov-center{justify-content:center;padding:0;}
  #overlay.win-mode{
    background:transparent !important;
    justify-content:flex-end !important;padding-bottom:36px;
    overflow:hidden;
  }
  .ocard,.card{
    background:var(--cream);border:var(--stroke) solid var(--ink);border-radius:var(--radius-card);
    padding:16px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;
    box-shadow:var(--shadow-2);
    max-width:460px;width:94%;flex-shrink:0;
    margin:auto;
  }
  #overlay h1{font-size:26px;color:var(--ink);font-family:var(--font-display);line-height:1.2;}
  #overlay h2{font-size:18px;color:var(--ink);font-family:var(--font-display);}
  .sub{font-size:var(--fs-min);color:var(--ink-soft);line-height:1.8;letter-spacing:.2px;}
  .khint{
    font-size:var(--fs-min);color:var(--ink);line-height:2;
    background:rgba(255,255,255,.6);border:var(--stroke) solid var(--ink);
    border-radius:var(--radius-card);padding:12px 16px;
  }
  .khint b{color:var(--ink);}
  .divider{width:100%;height:2px;background:var(--ink);opacity:.12;}
  .score-big{font-size:28px;color:var(--ink);font-family:var(--font-display);}
  /* ── BOTÃO PRIMÁRIO ── */
  .btn,.btn-primary{height:46px;padding:0 26px;background:var(--sun);
    border:var(--stroke-strong) solid var(--ink);border-radius:var(--radius-pill);
    box-shadow:var(--shadow-2);font:700 20px var(--font-display);
    color:var(--ink);cursor:pointer;transition:transform var(--t-fast) var(--spring);
    display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;}
  .btn:hover,.btn-primary:hover{transform:translateY(-3px) scale(1.03);}
  .btn:active,.btn-primary:active{transform:translateY(3px);}
  /* ── BOTÃO SECUNDÁRIO ── */
  .btn.sec,.btn-secondary{height:38px;padding:0 18px;background:var(--white);
    border:var(--stroke) solid var(--ink);border-radius:var(--radius-pill);
    box-shadow:var(--shadow-1);font:600 15px var(--font-display);
    color:var(--ink);cursor:pointer;transition:transform var(--t-fast) var(--spring);
    display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;}
  .btn.sec:hover,.btn-secondary:hover{transform:translateY(-3px) scale(1.03);}
  .btn.sec:active,.btn-secondary:active{transform:translateY(3px);}
  .diff-row{display:flex;gap:8px;justify-content:center;margin-top:2px;flex-wrap:wrap;}
  .diff-btn{padding:0 16px;height:38px;font:700 15px var(--font-display);
    border-radius:var(--radius-pill);border:var(--stroke) solid var(--ink);cursor:pointer;
    box-shadow:var(--shadow-1);transition:transform var(--t-fast) var(--spring);
    display:inline-flex;align-items:center;justify-content:center;}
  .diff-btn:hover{transform:translateY(-2px);}
  .diff-btn.facil  {background:#7ED957;color:var(--ink);}
  .diff-btn.normal {background:var(--blue);color:var(--ink);}
  .diff-btn.dificil{background:var(--coral);color:var(--ink);}
  .diff-btn.active {outline:var(--stroke-strong) solid var(--ink);outline-offset:2px;}
  .lang-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .lang-btn{min-width:100px;padding:0 14px;height:38px;font:700 15px var(--font-display);
    border-radius:var(--radius-pill);border:var(--stroke) solid var(--ink);cursor:pointer;
    background:var(--white);color:var(--ink);
    box-shadow:var(--shadow-1);transition:transform var(--t-fast) var(--spring);
    display:inline-flex;align-items:center;justify-content:center;}
  .lang-btn:hover{transform:translateY(-2px);}
  .credits{font-size:var(--fs-min);color:var(--ink-soft);letter-spacing:.2px;margin-top:4px;line-height:1.8;}

  /* ── CHARACTER SELECT ── */
  .char-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .char-card{
    width:130px;border:var(--stroke) solid var(--ink);border-radius:var(--radius-card);
    background:var(--white);padding:14px 10px 10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    box-shadow:var(--shadow-1);
    transition:box-shadow .2s,transform var(--t-fast) var(--spring);
  }
  .char-card:hover{transform:translateY(-3px);}
  .char-card.selected{background:var(--sun);border-width:var(--stroke-strong);box-shadow:0 8px 0 var(--ink);transform:translateY(-4px);}
  .char-card canvas{border-radius:8px;background:rgba(142,216,255,.2);}
  .char-name{font-size:var(--fs-min);color:var(--ink);letter-spacing:.2px;font-weight:800;}
  .char-desc{font-size:var(--fs-min);color:var(--ink-soft);letter-spacing:.1px;line-height:1.6;text-align:center;}
  .map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;}
  .map-node{border:var(--stroke) solid var(--ink);border-radius:var(--radius-card);background:var(--white);
    color:var(--ink);font-family:var(--font-ui);font-size:var(--fs-min);line-height:1.6;padding:12px 10px;cursor:pointer;text-align:left;
    box-shadow:var(--shadow-1);}
  .map-node.unlocked:hover{transform:translateY(-2px);}
  .map-node.locked{opacity:.38;cursor:not-allowed;}
  .map-node.active{border-color:var(--sun);box-shadow:0 0 0 var(--stroke-strong) var(--sun),var(--shadow-2);}
  .album-card{max-width:500px;padding:18px 24px;gap:7px;}
  .album-card h2{font-size:22px !important;}
  .album-card .sub{font-size:var(--fs-min);line-height:1.6;}
  .album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;}
  .album-node{min-height:44px;border-radius:12px;font-size:var(--fs-min);line-height:1.4;padding:8px 6px;}
  .shop-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%;}
  .shop-item{width:128px;min-height:78px;border:var(--stroke) solid var(--ink);border-radius:var(--radius-card);
    background:var(--white);color:var(--ink);font-family:var(--font-ui);font-size:var(--fs-min);line-height:1.6;padding:10px;cursor:pointer;
    box-shadow:var(--shadow-1);}
  .shop-item:hover{transform:translateY(-2px);}
  .shop-item.bought{background:var(--sun);cursor:default;}
  .shop-item b{display:block;font-size:14px;margin-bottom:2px;}
  .story-art{width:100%;height:90px;border-radius:12px;background:rgba(255,255,255,.4);border:var(--stroke) solid var(--ink);}
  .wardrobe-card{max-width:760px;padding:12px;gap:6px;}
  .wardrobe-card h2{font-size:22px !important;}
  .wardrobe-card .sub{font-size:var(--fs-min);line-height:1.4;}
  .wardrobe-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;width:100%;}
  .skin-card{width:92px;border:var(--stroke) solid var(--ink);border-radius:10px;background:var(--white);
    color:var(--ink);font-family:var(--font-ui);font-size:var(--fs-min);line-height:1.2;padding:4px;cursor:pointer;text-align:center;
    box-shadow:var(--shadow-1);}
  .skin-card canvas{width:32px;height:24px;margin:0 auto 2px;border-radius:4px;background:rgba(142,216,255,.2);}
  .skin-card:hover{transform:translateY(-2px);}
  .skin-card.selected{background:var(--sun);border-width:var(--stroke-strong);}


  /* ── DINO SVG (design/dino/dino-animations.css) ── */
  .dino-svg .rig,.dino-svg .rig g,.dino-svg .shadow{transform-box:fill-box}
  .dino-svg .rig{transform-origin:50% 100%}
  .dino-svg .tail{transform-origin:100% 40%}
  .dino-svg .headP{transform-origin:30% 90%}
  .dino-svg .legN,.dino-svg .legF{transform-origin:50% 10%}
  .dino-svg .torso{transform-origin:50% 100%}
  .dino-svg .lid{transform-origin:50% 0%;transform:scaleY(0)}
  .dino-svg .shadow{transform-origin:50% 50%}
  @keyframes dinoBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
  @keyframes dinoSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
  @keyframes dinoBlink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
  @keyframes dinoNod{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg) translateY(-1px)}}
  .dino-svg.m-idle .torso{animation:dinoBreathe 2.4s ease-in-out infinite}
  .dino-svg.m-idle .tail{animation:dinoSway 2.4s ease-in-out infinite}
  .dino-svg.m-idle .lid{animation:dinoBlink 3.6s infinite}
  .dino-svg.m-idle .headP{animation:dinoNod 2.4s ease-in-out infinite}

  .keycap{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;background:var(--white);
    border:var(--stroke) solid var(--ink);border-radius:9px;box-shadow:0 3px 0 var(--ink);font:700 13px var(--font-display);color:var(--ink);vertical-align:middle;}

  .tag{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:1px 8px 1px 2px;background:var(--white);border:2px solid var(--ink);
    border-radius:999px;font:900 12px var(--font-ui);color:var(--ink);white-space:nowrap;}
  .tag .tag-dot{width:18px;height:18px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font:700 11px var(--font-display);}
  .tag svg{display:block;}
  .ocard.wide{max-width:760px;}
  .map-node b{display:block;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
  .row-card{display:flex;align-items:center;gap:10px;width:100%;background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;text-align:left;}

  /* ── CENA 800x450 (menu e mapa) ── */
  .scene{position:relative;width:800px;height:450px;color:var(--ink);font-family:var(--font-ui);}
  .scene-bg{position:absolute;inset:0;overflow:visible;pointer-events:none;}
  .scene button{font-family:var(--font-ui);color:var(--ink);}
  .chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 6px;background:var(--white);
    border:var(--stroke) solid var(--ink);border-radius:var(--radius-pill);box-shadow:var(--shadow-1);
    font:900 16px var(--font-ui);color:var(--ink);white-space:nowrap;}
  button.chip{cursor:pointer;transition:transform var(--t-fast) var(--spring);}
  button.chip:hover{transform:translateY(-3px) scale(1.03);}
  .chip-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:inline-flex;align-items:center;
    justify-content:center;font:700 15px var(--font-display);flex-shrink:0;}
  .round-btn{width:50px;height:50px;border-radius:50%;background:var(--white);border:var(--stroke) solid var(--ink);
    box-shadow:var(--shadow-1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    transition:transform var(--t-fast) var(--spring);}
  .round-btn:hover{transform:translateY(-3px) scale(1.04);}
  .logo{position:absolute;left:60px;top:92px;display:flex;flex-direction:column;gap:6px;transform:rotate(-4deg);pointer-events:none;}
  .logo span{font:700 76px/.9 var(--font-display);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);}
  .menu-col{position:absolute;right:48px;top:100px;width:280px;display:flex;flex-direction:column;gap:14px;}
  .menu-col .btn,.menu-col .btn.sec{width:100%;gap:10px;}
  .menu-col .btn{height:68px;font-size:30px;box-shadow:var(--shadow-3);}
  .menu-col .btn.sec{height:52px;font-size:21px;box-shadow:var(--shadow-2);}
  .btn-locked{height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#E6F6FF;
    border:var(--stroke) dashed var(--ink);border-radius:var(--radius-pill);font:800 15px var(--font-ui);color:var(--ink);cursor:not-allowed;}
  .shortcuts{position:absolute;right:30px;bottom:18px;display:flex;gap:14px;}
  .ico{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;padding:0;cursor:pointer;
    font:900 12px var(--font-ui);color:var(--ink);transition:transform .2s var(--spring);}
  .ico:hover{transform:translateY(-4px) rotate(-6deg);}
  .ico-box{position:relative;width:52px;height:52px;border-radius:18px;border:var(--stroke) solid var(--ink);box-shadow:var(--shadow-1);
    display:flex;align-items:center;justify-content:center;}
  .ico-lbl{background:var(--white);border-radius:var(--radius-pill);padding:1px 8px;}
  .badge{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--coral);
    border:2px solid var(--ink);font:900 12px/18px var(--font-ui);color:var(--ink);text-align:center;}
  .topbar{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;}
  .node{position:absolute;border-radius:50%;border:var(--stroke-strong) solid var(--ink);display:flex;align-items:center;justify-content:center;
    font:700 28px var(--font-display);color:var(--ink);padding:0;transition:transform var(--t-fast) var(--spring);}
  .node:not([disabled]){cursor:pointer;}
  .node:not([disabled]):hover{transform:translateY(-3px) scale(1.06);}
  .node[disabled]{cursor:not-allowed;}
  .balloon{display:flex;flex-direction:column;align-items:center;gap:4px;animation:bob 1.4s ease-in-out infinite;pointer-events:none;}
  .balloon b{background:var(--ink);color:var(--white);font:900 12px var(--font-ui);padding:4px 10px;border-radius:999px;white-space:nowrap;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;padding:8px 14px;background:var(--white);
    border:var(--stroke) solid var(--ink);border-radius:26px;box-shadow:var(--shadow-2);}
  .dock button{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border:var(--stroke) solid var(--ink);
    border-radius:var(--radius-pill);font:900 14px var(--font-ui);cursor:pointer;white-space:nowrap;transition:transform var(--t-fast) var(--spring);}
  .dock button:hover{transform:translateY(-3px) scale(1.04);}
  .dock .chip-dot{background:var(--white);}

  /* ── MOBILE D-PAD (HTML buttons, not canvas) ── */
  #mobileControls{
    display:none;position:absolute;bottom:0;left:0;right:0;
    height:120px;pointer-events:none;z-index:15;
  }
  #mobileControls.active{display:block;}
  .mbtn{
    position:absolute;pointer-events:auto;
    background:rgba(255,255,255,.85);border:var(--stroke) solid var(--ink);box-shadow:var(--shadow-1);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--ink);font:700 15px var(--font-display);padding:0;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    touch-action:none;transition:transform .08s,box-shadow .08s;
  }
  .mbtn:active,.mbtn.pressed{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
  #mbAtk{background:var(--orange);}
  #mbJump{background:var(--sun);border-width:var(--stroke-strong);box-shadow:0 6px 0 var(--ink);font-size:18px;}
  #pauseBtn{background:var(--sun);}
  .hbtn svg{display:block;}
</style>
</head>
<body>
<div id="gameContainer">
  <div id="hudBtns">
    <button class="hbtn" id="muteBtn" onclick="toggleMute()" title="Música [M]" aria-label="Música"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
    <button class="hbtn" id="pauseBtn" onclick="togglePause()" title="Pausar [P]" aria-label="Pausar"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#2B2A4C"><rect x="5" y="4" width="5" height="16" rx="2"/><rect x="14" y="4" width="5" height="16" rx="2"/></svg></button>
    <button class="hbtn quit" onclick="quitGame()" title="Sair para o Menu" aria-label="Sair"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <canvas id="c" width="800" height="450"></canvas>
  <!-- Mobile D-Pad (HTML buttons, positioned absolutely over canvas) -->
  <div id="mobileControls">
    <button class="mbtn" id="mbLeft"  aria-label="Esquerda" style="left:18px;bottom:18px;width:64px;height:64px"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="mbtn" id="mbRight" aria-label="Direita"  style="left:94px;bottom:18px;width:64px;height:64px"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="mbtn" id="mbDuck"  aria-label="Abaixar"  style="left:62px;bottom:94px;width:52px;height:52px"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
    <button class="mbtn" id="mbAtk"   aria-label="Atacar"   style="right:116px;bottom:18px;width:60px;height:60px">Fogo</button>
    <button class="mbtn" id="mbJump"  aria-label="Pular"    style="right:18px;bottom:36px;width:82px;height:82px">Pular</button>
  </div>
  <!-- Loading screen -->
  <div id="loadingScreen" style="position:absolute;inset:0;z-index:99;background:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-family:var(--font-display);">
    <div style="font-size:36px;font-weight:700;margin-bottom:18px;">DinoGame</div>
    <div style="width:220px;height:16px;background:var(--white);border:3px solid var(--ink);border-radius:999px;overflow:hidden;">
      <div id="loadBar" style="width:0%;height:100%;background:var(--sun);transition:width .3s;"></div>
    </div>
    <div style="font-size:14px;font-family:var(--font-ui);font-weight:800;margin-top:10px;">Carregando...</div>
  </div>
</div>

<div id="overlay" style="display:none;">
    <div class="ocard" id="menuCard">

// ─── RESPONSIVE SCALING ────────────────────────────────────────────────────────
(function applyScale(){
  const CW=800,CH=450;
  const SIZE=1.0;
  function resize(){
    const vw=window.innerWidth, vh=window.innerHeight;
    const s=Math.min(vw/CW, vh/CH) * SIZE;
    const el=document.getElementById('gameContainer');
    el.style.width=CW+'px'; el.style.height=CH+'px';
    el.style.transform='scale('+s+')';
    el.style.left=((vw-CW*s)/2)+'px';
    el.style.top=((vh-CH*s)/2)+'px';
    el.style.position='absolute';
    // show mobile D-pad when touch available
    const mob=document.getElementById('mobileControls');
    if(mob){
      const isTouch=('ontouchstart' in window)||((window.navigator&&window.navigator.maxTouchPoints)||0)>0;
      mob.classList.toggle('active',isTouch);
    }
  }
  function fitOverlay(){
    const ov=document.getElementById('overlay');
    if(!ov||ov.classList.contains('win-mode'))return;
    const vw=window.innerWidth, vh=window.innerHeight;
    const base=Math.min(vw/CW, vh/CH);
    [...ov.children].forEach(card=>{
      card.style.transform='none';
      const w=card.offsetWidth, h=card.offsetHeight;
      if(!w||!h)return;
      const pad=card.classList.contains('scene')?1:0.96;
      const s=Math.min(base, (vw*pad)/w, (vh*pad)/h);
      card.style.transform='scale('+s+')';
    });
  }
  window.fitOverlay=fitOverlay;
  resize();
  fitOverlay();
  window.addEventListener('resize',()=>{resize();fitOverlay();});
  new MutationObserver(()=>requestAnimationFrame(fitOverlay))
    .observe(document.getElementById('overlay'),{childList:true,attributes:true,attributeFilter:['style','class']});
  document.fonts&&document.fonts.ready.then(fitOverlay);
})();

function scheduleBGM(){
  if(!audioCtx||!bgmOn) return;
  const bgmArr = nightMusicActive ? BGMS_NIGHT : BGMS;
  const bgm=bgmArr[bgmThemeIdx%bgmArr.length];
  const now=audioCtx.currentTime, ahead=0.14;
  while(bgmMelT<now+ahead){
    const [f,b]=bgm.mel[bgmMelIdx%bgm.mel.length]; const d=b*bgm.bpm;
    if(f){
      const o=audioCtx.createOscillator(),g=audioCtx.createGain(),flt=audioCtx.createBiquadFilter();
      flt.type='lowpass'; flt.frequency.value=1600;
      o.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
      o.type=bgm.melType; o.frequency.setValueAtTime(f,bgmMelT);
      g.gain.setValueAtTime(bgm.melVol,bgmMelT); g.gain.linearRampToValueAtTime(0,bgmMelT+d*.88);
      o.start(bgmMelT); o.stop(bgmMelT+d);
    }
    bgmMelT+=d; bgmMelIdx++;
  }
  while(bgmBasT<now+ahead){
    const [f,b]=bgm.bas[bgmBasIdx%bgm.bas.length]; const d=b*bgm.bpm;
    if(f){
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type=bgm.basType; o.frequency.setValueAtTime(f,bgmBasT);
      g.gain.setValueAtTime(bgm.basVol,bgmBasT); g.gain.linearRampToValueAtTime(0,bgmBasT+d*.82);
      o.start(bgmBasT); o.stop(bgmBasT+d);
    }
    bgmBasT+=d; bgmBasIdx++;
  }
  requestAnimationFrame(scheduleBGM);
}

function startBGM(themeIdx=0){
  if(bgmMuted) return;
  ensureAudio();
  bgmThemeIdx=themeIdx;
  bgmOn=true; bgmMelIdx=0; bgmBasIdx=0;
  bgmMelT=bgmBasT=audioCtx.currentTime;
  scheduleBGM();
}

function stopBGM(){ bgmOn=false; }

function toggleMute(){

  lastInputAt = performance.now();

  keys[e.code] = true;
  if(e.code==='Space' && state==='cutscene'){ skipCutscene(); return; }
  if(e.code==='KeyM'){ toggleMute(); return; }
  if(e.code==='Escape'&&state==='freeroam'){ state='menu'; renderMainMenu(); return; }
  if(e.code==='KeyC'&&state==='freeroam'){
    if(frDriving){
      frDriving.occupied=false;
      frPlayer.tx=frDriving.tx+0.9;frPlayer.ty=frDriving.ty;
      frDriving=null;
    } else {
      const nc=frCars.find(c=>!c.occupied&&Math.abs(c.tx-frPlayer.tx)<1.5&&Math.abs(c.ty-frPlayer.ty)<1.5);
      if(nc){nc.occupied=true;frDriving=nc;frPlayer.tx=nc.tx;frPlayer.ty=nc.ty;}
    }
    return;
  }
  if(['KeyP','Escape'].includes(e.code)){ togglePause(); return; }
  if(paused) return;
  if(state === 'playing'){
    if(['ArrowUp','KeyW','Space'].includes(e.code)) tryJump();
    if(['ArrowDown','KeyS'].includes(e.code)) player.ducking = true;
    if(['KeyZ','KeyX','KeyF'].includes(e.code) && !player.attacking){
      player.attacking=true;
      player.attackTimer = selectedChar==='caveman' ? 22 : 26;
      player.attackDir = player.facing;
      if(selectedChar==='dino') sfxFire();
    }
  }
  if(state === 'playing'){
    if(e.code === 'KeyQ' && inventory.length >= 1){ activatePowerup(0); }
    if(e.code === 'KeyE' && inventory.length >= 2){ activatePowerup(1); }
  }
  if(e.code==='Space' && state==='dead')      restartPhase();
  if(e.code==='Space' && state==='phaseclear') nextPhase();
  if(state==='editor'){
    if(['Space','ArrowUp','KeyW'].includes(e.code) && (player.onGround||player.jumpCount<2)){
      player.vy=JUMP_FORCE; player.onGround=false; player.jumpCount++;
    }
    if(e.code==='KeyB') placeEditorBlock(player.x+scrollX, player.y);
    if(e.code==='Enter') renderEditorFinish();
    if(e.code==='KeyZ' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); if(e.shiftKey) edRedoAction(); else edUndoAction(); return; }
    if(e.code==='Backspace'||e.code==='Delete') edUndoAction();
    if(e.code==='KeyX') editorErase=!editorErase;
    const kNum=parseInt(e.key);
    const cat=editorTab==='items'?EDITOR_ITEMS:editorTab==='enemies'?EDITOR_ENEMIES:EDITOR_BTYPES;
    if(kNum>=1&&kNum<=cat.length){
      if(editorTab==='items') editorItemType=kNum-1; else if(editorTab==='enemies') editorEnemyType=kNum-1; else editorBlockType=kNum-1;
    }
  }
});

// ─── MOUSE INPUT ──────────────────────────────────────────────────────────────
let mouseX = W / 2;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
});
canvas.addEventListener('mousedown', e => {
  if(state==='editor'){
    e.preventDefault();
    const r=canvas.getBoundingClientRect();
    const cx=(e.clientX-r.left)*(W/r.width);
    const cy=(e.clientY-r.top)*(H/r.height);
    const hit=edButtons.find(b=>cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h);
    if(hit){ hit.fn(); return; }
    if(cy>=ED_DRAWER_Y) return;
    const wx=cx+scrollX, wy=Math.min(cy+ED_OFF,GROUND);
    if(editorErase) edEraseAt(wx,wy);
    else if(editorTab==='items') edAdd('items',{kind:EDITOR_ITEMS[editorItemType].kind,x:Math.round(wx),y:Math.round(Math.min(wy,GROUND-14))});
    else if(editorTab==='enemies'){
      const t=EDITOR_ENEMIES[editorEnemyType].type;
      edAdd('enemies',{type:t,x:Math.round(wx-27),y:t==='ptero'?Math.round(Math.min(wy,GROUND-60)):GROUND});
    }
    else placeEditorBlock(wx, wy);
    return;
  }
  if(state !== 'playing' || paused) return;
  e.preventDefault();
  if(e.button === 0) tryJump();
  else if(e.button === 2 && !player.attacking){
    player.attacking = true;
    player.attackTimer = selectedChar==='caveman' ? 22 : 26;
    player.attackDir = player.facing;
    if(selectedChar==='dino') sfxFire();
  }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ─── HTML MOBILE D-PAD WIRING ────────────────────────────────────────────────
// Uses HTML button elements (not canvas-drawn) wired via pointer events.
// This means they work outside the canvas clipping area on all screen sizes.
function wireMobileBtn(id, downFn, upFn){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('pointerdown', e=>{
    lastInputAt = performance.now();
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    el.classList.add('pressed');
    if(downFn) downFn();
  });
  el.addEventListener('pointerup', e=>{
    e.preventDefault(); el.classList.remove('pressed');
    if(upFn) upFn();
  });
  el.addEventListener('pointercancel', e=>{
    el.classList.remove('pressed');
    if(upFn) upFn();
  });
}

// Called after DOM is ready (at end of script)
function initMobileDpad(){
  wireMobileBtn('mbLeft',
    ()=>{ keys['ArrowLeft']=true; },
    ()=>{ keys['ArrowLeft']=false; }
  );
  wireMobileBtn('mbRight',
    ()=>{ keys['ArrowRight']=true; },
    ()=>{ keys['ArrowRight']=false; }
  );
  wireMobileBtn('mbDuck',
    ()=>{ keys['ArrowDown']=true; player.ducking=true; },
    ()=>{ keys['ArrowDown']=false; player.ducking=false; }
  );
  wireMobileBtn('mbJump',
    ()=>{ if(state==='playing'&&!paused) tryJump(); },
    null
  );
  wireMobileBtn('mbAtk',
    ()=>{
      if(state!=='playing'||paused||player.attacking) return;
      player.attacking=true;
      player.attackTimer=selectedChar==='caveman'?22:26;
      player.attackDir=player.facing;
      if(selectedChar==='dino') sfxFire();
    },
    null
  );
}

// Hide mobile controls when not playing
function updateMobileControls(){
  const mc = document.getElementById('mobileControls');
  if(!mc) return;
  const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  mc.classList.toggle('active', isTouch && state==='playing' && !paused);
  const atk=document.getElementById('mbAtk'); if(atk) atk.textContent = selectedChar==='caveman' ? 'Bater' : 'Fogo';
}

function tryJump(){
  if(player.onGround){
    player.vy = jumpForce(); player.onGround = false; player.jumpCount = 1;
    spawnParticles(player.x+player.w/2, player.y, '#4ecdc4', 6);
    sfxJump();
  } else if(player.jumpCount===1){
    player.vy = jumpForce() * 0.82; player.jumpCount = 2;
    spawnParticles(player.x+player.w/2, player.y-20, '#ffe66d', 8);
    sfxJump();
  }
}

// ─── PHASE GENERATION ─────────────────────────────────────────────────────────
function generatePhase(p){
  const secret = p === SECRET_PHASE;
  const cp = (p === 99 && customPhaseConfig) ? customPhaseConfig : null;
  if(cp){ currentTheme = THEMES[cp.theme]; }
  else { currentTheme = secret ? THEMES[3] : THEMES[(p-1) % THEMES.length]; }
  let len = cp ? (cp.platforms ? 5000 : 3200) : (secret ? 2600 : 4000 + (p-1)*800);
  if(onlineChallenge && onlineChallenge.short) len = Math.floor(len * .72);
  currentLen = len;
  portalX = len - 220;
  secretPortalX = secret ? 0 : Math.floor(len * 0.68);

  weatherParticles = [];

  // stars
  stars = [];
  if(currentTheme.stars){
    for(let i=0;i<120;i++)
      stars.push({x:Math.random()*len, y:Math.random()*(GROUND-80), s:Math.random()*1.8+0.4, b:Math.random()});
  }

  // clouds
  clouds = [];
  for(let i=0;i<14;i++)
    clouds.push({x:200+i*(len/14)+Math.random()*150, y:35+Math.random()*90, w:70+Math.random()*90, speed:0.25+Math.random()*0.35});

  // background trees
  trees = [];
  for(let i=0;i<Math.floor(len/160);i++)
    trees.push({x:100+i*160+Math.random()*80, h:50+Math.random()*50, w:18+Math.random()*14, layer:Math.random()<0.5?'far':'near'});

  // plataformas no ar — grupos variados estilo Mario
  if(cp && cp.platforms){ phasePlatforms = cp.platforms; }
  else {
  phasePlatforms = [];
  const platTypes = ['stone','wood','grass'];
  let cx = 380;
  while(cx < len - 350){
    const style = Math.random();
    const ptype = platTypes[Math.floor(Math.random()*platTypes.length)];
    if(style < 0.35){
      // escada ascendente
      const steps = 3 + Math.floor(Math.random()*3);
      for(let s=0;s<steps;s++){
        phasePlatforms.push({x:cx+s*100, y:GROUND-100-s*55, w:90, type:ptype});
      }
      cx += steps*100 + 180;
    } else if(style < 0.65){
      // ilha flutuante dupla
      const h = GROUND - 110 - Math.random()*80;
      phasePlatforms.push({x:cx,       y:h,    w:110+Math.random()*60, type:ptype});
      phasePlatforms.push({x:cx+180,   y:h-50, w:90+Math.random()*40,  type:ptype});
      cx += 360 + Math.random()*80;
    } else {
      // plataforma única larga
      phasePlatforms.push({x:cx, y:GROUND-95-Math.random()*100, w:140+Math.random()*80, type:ptype});
      cx += 260 + Math.random()*100;
    }
  }
  } // end platforms else

  // eggs — metade no chão, metade em cima de plataformas
  phaseEggs = [];
  const cpItems = (cp && cp.items) || [];
  const cpEnemies = (cp && cp.enemies) || [];
  const cpEggs = cpItems.filter(o=>o.kind==='egg');
  const eggCount = cpEggs.length ? 0 : cp ? cp.eggs : ((secret ? 6 : 2+p) + (onlineChallenge ? (onlineChallenge.bonusEggs || 0) : 0));
  const eggKinds = ['normal','normal','gold','blue','red','rainbow','fossil','ghost','dragon'];
  for(let i=0;i<eggCount;i++){
    const onPlat = phasePlatforms.length>0 && i%2===1;
    const plat   = onPlat ? phasePlatforms[Math.floor(Math.random()*phasePlatforms.length)] : null;
    phaseEggs.push({
      x: plat ? plat.x + plat.w/2 + (Math.random()*30-15) : 450 + i*Math.floor((len-650)/eggCount) + Math.random()*80,
      y: plat ? plat.y - 24 : GROUND - 28 - Math.random()*60,
      r:16, collected:false, bob:Math.random()*Math.PI*2,
      kind: i===0 ? 'normal' : eggKinds[Math.floor(Math.random()*eggKinds.length)],
    });
  }
  cpEggs.forEach(o=>phaseEggs.push({x:o.x,y:o.y,r:16,collected:false,bob:Math.random()*Math.PI*2,kind:'normal'}));

  // obstáculos
  phaseObstacles = [];
  if(((p >= 3 && !secret) || cp) && !cpEnemies.length){
    const obsTypes = ['rock','cactus','fire','log'];
    const obsCount = cp ? [1,3,6][cp.enemy] : (DIFF[difficulty].obsBase + (p-2)*2);
    for(let i=0;i<obsCount;i++){
      const t = obsTypes[Math.floor(Math.random()*obsTypes.length)];
      phaseObstacles.push({
        x: 500 + i*Math.floor((len-700)/obsCount) + Math.random()*50,
        y: GROUND, type:t,
        w: t==='log'?80 : t==='rock'?44 : 38,
        h: t==='rock'?44 : t==='log'?30 : 56,
      });
    }
  }

  // coins
  phaseCoins = [];
  const cpCoins = cpItems.filter(o=>o.kind==='coin');
  const coinCount = cpCoins.length ? 0 : secret ? 24 : 8 + phase * 2;
  cpCoins.forEach(o=>phaseCoins.push({x:o.x,y:o.y,collected:false,bob:Math.random()*Math.PI*2}));
  for(let i = 0; i < coinCount; i++){
    phaseCoins.push({
      x: 300 + Math.random() * (len - 700),
      y: GROUND - 15,
      collected: false,
      bob: Math.random() * Math.PI * 2,
    });
  }

  // spike traps removidos
  phaseTraps = [];

  // power-up items
  powerupItems = []; inventory = []; activeEffects = {speed:0, shield:0, fire:0};
  const puTypes = ['speed','shield','fire'];
  const cpPowerups = cpItems.filter(o=>['speed','shield','fire'].includes(o.kind));
  const puCount = cpPowerups.length ? 0 : secret ? 4 : 1 + phase;
  cpPowerups.forEach(o=>powerupItems.push({x:o.x-10,y:o.y,type:o.kind,collected:false,bob:Math.random()*Math.PI*2}));
  for(let i = 0; i < puCount; i++){
    powerupItems.push({
      x: 400 + i * Math.floor((len - 600) / puCount) + Math.random() * 80,
      y: GROUND - 20,
      type: puTypes[i % puTypes.length],
      collected: false,
      bob: Math.random() * Math.PI * 2,
    });
  }

  checkpointX = Math.floor(len * 0.52);
  checkpointReached = false;

  phaseSecrets = [];
  for(let i=0;i<2;i++){
    const plat = phasePlatforms[Math.floor(Math.random()*phasePlatforms.length)];
    phaseSecrets.push({
      x: plat ? plat.x + Math.min(plat.w-24, 18+Math.random()*(plat.w-36)) : 700+Math.random()*(len-1200),
      y: plat ? plat.y - 42 : GROUND - 95 - Math.random()*70,
      found:false,
    });
  }

  // enemies
  phaseEnemies = [];
  const enemyTypes = ['ptero','trex','anky','raptor'];
  const enemyCount = cpEnemies.length ? 0 : cp ? [1,3,6][cp.enemy] : (secret ? 0 : DIFF[difficulty].enemyBase + p + (onlineChallenge ? (onlineChallenge.enemyBonus || 0) : 0));
  const speedMult = DIFF[difficulty].speedMult;
  for(let i=0;i<enemyCount;i++){
    const t = enemyTypes[Math.floor(Math.random()*enemyTypes.length)];
    const flying = t==='ptero';
    phaseEnemies.push({
      x: 620 + i*Math.floor((len-820)/enemyCount) + Math.random()*70,
      y: flying ? GROUND-110-Math.random()*50 : GROUND,
      type:t, w:54, h:flying?38:54,
      vx: -(0.8 + Math.random()*(0.3+p*0.12)) * speedMult,
      flying, frame:0, frameTimer:0, alive:true,
      bobOffset:Math.random()*Math.PI*2,
    });
  }

  cpEnemies.forEach(o=>{
    const flying=o.type==='ptero';
    phaseEnemies.push({x:o.x,y:o.y,type:o.type,w:54,h:flying?38:54,
      vx:-(0.8+Math.random()*0.3)*speedMult, flying, frame:0, frameTimer:0, alive:true, bobOffset:Math.random()*Math.PI*2});
  });

  // boss + alavanca na última fase
  phaseChaser = (p >= 2 && p <= MAX_PHASES && !secret && !cp && Math.random() < 1/3)
    ? {x:0, y:GROUND, vy:0, onGround:true, active:false, alive:true, mode:Math.random()<.5?'seventy':'random', spawnAt:null, hp:3, hitCd:0, hitFlash:0, facing:1}
    : null;
  phaseBoss = null; phaseLever = null; boulderRoll = null;
  if((p === 4 || p === MAX_PHASES) && !secret && !cp){
    const bossHp = p === MAX_PHASES ? 12 : 8;
    phaseBoss = {
      x: len - 600, y: GROUND,
      w:90, h:90, hp:bossHp, maxHp:bossHp,
      vx:-0.7, frame:0, frameTimer:0, alive:true,
      hitFlash:0,
    };
    phaseLever = {x: len - 1100, y: GROUND, activated: false};
  }
}

function dateSeed(){
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}
function weekSeed(){
  const d = new Date();
  const start = new Date(d.getFullYear(),0,1);
  return Math.floor((d - start) / 604800000) + 1;
}
function challengeCode(cfg){
  const raw = `${cfg.kind}-${cfg.phase}-${cfg.difficulty}-${Math.round(cfg.timeMult*100)}-${cfg.enemyBonus||0}-${cfg.bonusEggs||0}`;
  let n = 0;
  for(let i=0;i<raw.length;i++) n = (n*31 + raw.charCodeAt(i)) % 99991;
  return 'DINO-' + String(n).padStart(5,'0');
}
function dailyChallenge(){
  const seed = dateSeed();
  return {kind:'daily', title:'Desafio do dia', phase:(seed%4)+1, difficulty:seed%3===0?'dificil':seed%3===1?'normal':'facil', timeMult:.88, scoreMult:1.2, enemyBonus:1, bonusEggs:1};
}
function weeklyChallenge(){
  const seed = weekSeed();
  return {kind:'weekly', title:'Evento semanal', phase:(seed%4)+1, difficulty:seed%2?'normal':'dificil', timeMult:.95, scoreMult:1.35, enemyBonus:2, bonusEggs:2};
}
function lightningChallenge(){
  return {kind:'lightning', title:'Desafio relâmpago', phase:1+Math.floor(Math.random()*4), difficulty:'normal', timeMult:.55, scoreMult:1.6, enemyBonus:0, bonusEggs:0, short:true};
}
function ghostChallenge(){
  return {kind:'ghost', title:'Corrida fantasma', phase:1, difficulty:'normal', timeMult:1, scoreMult:1.1, enemyBonus:0, bonusEggs:0, ghost:true};
}

function buyShopItem(id){
  const costs = {petRange:6, extraLife:10, starterShield:8, jumpBoost:7, speedBoost:7, timeBoost:6, tough:8};
  const maxLevels = {petRange:3, jumpBoost:3, speedBoost:3, timeBoost:3, tough:3};
  if(maxLevels[id] !== undefined){
    if(shopUpgrades[id] >= maxLevels[id]) return;
    const cost = costs[id] || 0;
    if(totalCoins < cost){ alert(tr('notEnough')); return; }
    totalCoins -= cost;
    shopUpgrades[id]++;
    saveProgress();
    renderShop();
    return;
  }
  if(id==='petRange' && shopUpgrades.petRange>=3) return;
  if(id!=='petRange' && shopUpgrades[id]) return;
  const cost = costs[id] || 0;
  if(totalCoins < cost){ alert(tr('notEnough')); return; }
  totalCoins -= cost;
  if(id==='petRange') shopUpgrades.petRange++;
  else {
    shopUpgrades[id]=true;
    if(id==='extraLife') lives = Math.min(5, lives+1);
  }
  saveProgress();
  renderShop();
}

function chooseSkin(char,id){
  const skin = SKINS[char].find(s=>s.id===id);
  if(!skin) return;
  if(!ownedSkins[char].has(id)){
    if(totalCoins < skin.cost){ alert(tr('notEnough')); return; }
    totalCoins -= skin.cost;
    ownedSkins[char].add(id);
  }
  selectedSkin[char] = id;
  saveProgress();
  renderWardrobe();
}

function chooseAccessory(char,id){
  const acc = ACCESSORIES[char].find(a=>a.id===id);
  if(!acc) return;
  // buy if not owned
  if(!ownedAccessories[char].has(id)){
    if(totalCoins < acc.cost){ alert(tr('notEnough')); return; }
    totalCoins -= acc.cost;
    ownedAccessories[char].add(id);
  }
  // toggle: remove se já selecionado, adicionar se < 5
  const arr = selectedAccessory[char];
  const idx = arr.indexOf(id);
  if(idx !== -1){
    arr.splice(idx, 1); // desequipar
  } else if(arr.length < 5){
    arr.push(id);       // equipar
  } else {
    // substituir o mais antigo
    arr.shift();
    arr.push(id);
  }
  saveProgress();
  renderWardrobe();
}

function beginPhase(){
  scrollX=0;
  player.x=100; player.y=GROUND;
  player.vx=0; player.vy=0;
  player.onGround=true; player.ducking=false;
  player.invincible=0; player.jumpCount=0; player.hp=3; hpBarAnim=3;
  phaseNoDamage=true; stompCombo=0; stompComboTimer=0;
  particles=[]; phasePlatforms=[]; frameCount=0;
  pet.x=60; pet.y=GROUND; pet.vy=0; pet.onGround=true;
  pet.frame=0; pet.facing=1; pet.history=[];
  generatePhase(phase);
  if(shopUpgrades.starterShield) activeEffects.shield = Math.max(activeEffects.shield, 240);
  phaseFramesLeft = calcPhaseFrames(phase) + shopUpgrades.timeBoost * 600;
  updateUI();
  const ti=(phase-1)%BGMS.length;
  stopBGM(); startBGM(ti);
}

function restartPhase(){
  if(lives<=0){ showOverlay('gameover'); return; }
  if(checkpointReached){
    resumeFromCheckpoint();
  } else {
    beginPhase();
  }
  document.getElementById('overlay').style.display='none';
  state='playing';
}

function resumeFromCheckpoint(){
  if(phaseChaser && phaseChaser.alive){ phaseChaser.active=false; phaseChaser.mode='random'; phaseChaser.spawnAt=frameCount+600; }
  scrollX = Math.max(0, Math.min(currentLen-W, checkpointX - W*0.28));
  player.x = W*0.28; player.y = GROUND;
  player.vx=0; player.vy=0; player.hp=3; player.invincible=90;
  player.onGround=true; player.ducking=false; player.jumpCount=0;
  pet.x = player.x - 48; pet.y = GROUND; pet.vy=0; pet.history=[];
  phaseFramesLeft = Math.max(phaseFramesLeft, Math.floor(calcPhaseFrames(phase)*0.35));
  stopBGM(); startBGM((phase-1)%BGMS.length);
}

function nextPhase(){
  if(phase === 99){ customPhaseConfig = null; showOverlay('win'); return; }
  const routes = {1:[2,3],2:[4],3:[4],4:[5],5:[6],6:[7],7:[]};
  const next = routes[phase] || [];
  if(!next.length){ showOverlay('win'); return; }
  next.forEach(p=>unlockedPhase = Math.max(unlockedPhase, p));
  saveProgress();
  phase = next[0];
  renderWorldMap();
}

function finishOnlineChallenge(){
  if(!onlineChallenge) return '';

  let msg = `<p class="sub" style="color:var(--ink);font-weight:900">${onlineChallenge.title} · ${seconds}s · Código ${challengeCode(onlineChallenge)}</p>`;

      localStorage.setItem('dinogame_ghost_best', String(onlineRunFrames));
      msg += `<p class="sub" style="color:var(--ink);font-weight:900">Novo melhor fantasma local!</p>`;

  return msg;

// ─── UPDATE ───────────────────────────────────────────────────────────────────
function updateTimerUI(){} // desenhado no canvas via drawHUD()

function update(){
  if(state==='cutscene'){ cutsceneTimer++; if(cutsceneTimer>=520) finishCutscene(); return; }
  if(state==='win'){ winTimer++; return; }
  if(state!=='playing') return;
  frameCount++;
  if(onlineChallenge) onlineRunFrames++;
  if(score !== lastScoreVal){ scorePopTimer = 22; lastScoreVal = score; }
  scorePopTimer = Math.max(0, scorePopTimer - 1);
  hpBarAnim += (player.hp - hpBarAnim) * 0.12;

  // phase timer countdown
  if(phaseFramesLeft > 0){
    phaseFramesLeft--;
    if(phaseFramesLeft === 0){
      lives--; player.hp=3; updateUI();
      sfxDie();
      if(lives<=0) showOverlay('gameover');
      else showOverlay('dead');
      return;
    }
  }
  updateTimerUI();

  // day/night cycle
  dayNight = (Math.sin(frameCount / 900 * Math.PI) + 1) / 2;

  // day/night music transition
  const tod = dayNight < 0.4 ? 'night' : 'day';
  if(tod !== lastTimeOfDay && !bgmMuted){
    lastTimeOfDay = tod;
    nightMusicActive = (tod === 'night');
    stopBGM();
    startBGM((phase-1) % 4);
  }

  // power-up effect countdowns
  Object.keys(activeEffects).forEach(k => activeEffects[k] = Math.max(0, activeEffects[k] - 1));
  // shield: keep player invincible
  if(activeEffects.shield > 0) player.invincible = Math.max(player.invincible, 2);

  // horizontal movement
  const mr = keys['ArrowRight']||keys['KeyD'];
  const ml = keys['ArrowLeft'] ||keys['KeyA'];
  const speedMult = activeEffects.speed > 0 ? 1.6 : 1.0;
  const baseMove = moveSpeed();
  player.vx = mr ? baseMove * speedMult : ml ? -baseMove * speedMult : 0;
  if(mr) player.facing=1; else if(ml) player.facing=-1;
  else player.facing = mouseX > player.x + player.w/2 ? 1 : -1;

  player.vy += GRAVITY;
  player.x  += player.vx;
  player.y  += player.vy;
  if(player.x < 20) player.x = 20;

  // colisão com plataformas (top-only — pode pular por baixo)
  let onPlatform = false;
  if(player.vy >= 0){
    phasePlatforms.forEach(plat=>{
      const px = plat.x - scrollX;
      if(px > W+200 || px+plat.w < -100) return;
      const prevBottom = player.y - player.vy;
      if(prevBottom <= plat.y && player.y >= plat.y &&
         player.x+player.w-10 > px && player.x+10 < px+plat.w){
        player.y = plat.y; player.vy = 0; onPlatform = true;
      }
    });
  }

  if(player.y >= GROUND){
    player.y=GROUND; player.vy=0; player.onGround=true; player.jumpCount=0;
  } else if(onPlatform){
    player.onGround=true; player.jumpCount=0;
  } else { player.onGround=false; }

  // camera scroll
  if(player.x > W*0.36){
    const dx = player.x - W*0.36;
    if(scrollX+dx <= currentLen-W){ scrollX+=dx; player.x=W*0.36; }
    else { scrollX=currentLen-W; }
  }
  if(!checkpointReached && player.x + scrollX > checkpointX){
    checkpointReached = true;
    petSpeech.text = tr('checkpoint');
    petSpeech.timer = 150;
    spawnParticles(player.x+player.w/2, player.y-40, '#4ecdc4', 18);
  }

  player.frameTimer++;
  if(player.frameTimer>6){ player.frame=(player.frame+1)%4; player.frameTimer=0; }
  if(player.invincible>0) player.invincible--;
  player.h = player.ducking ? 30 : 56;

  // ataque com clava (caveman)
  if(player.attacking){
    player.attackTimer--;
    if(player.attackTimer<=0){ player.attacking=false; }
    // hitbox da clava ativa nos frames centrais do swing (timer 18→8)
    if(player.attackTimer<=18 && player.attackTimer>=6 && selectedChar==='caveman'){
      const clubX = player.attackDir>0 ? player.x+player.w-4 : player.x-38;
      const clubY = player.y-54;
      phaseEnemies.forEach(enemy=>{
        if(!enemy.alive) return;
        const ex=enemy.x-scrollX;
        const emx=Math.floor(enemy.w*.28), emy=Math.floor(enemy.h*.2);
        if(rectsOverlap(clubX, clubY, 40, 44, ex+emx, enemy.y-enemy.h+emy, enemy.w-emx*2, enemy.h-emy)){
          discoverCreature(enemy.type);
          enemy.alive=false; score+=50;
          spawnParticles(ex+enemy.w/2, enemy.y-enemy.h/2, '#ffb300', 14); updateUI();
        }
      });
      hitChaser(clubX, clubY, 40, 44);
    }
    if(player.attackTimer<=22 && player.attackTimer>=4 && selectedChar==='dino'){
      const fw = activeEffects.fire > 0 ? 138 : 96;
      const fireX = player.attackDir>0 ? player.x+player.w : player.x-fw;
      const fireY = player.y-68, fireW=fw, fireH=activeEffects.fire > 0 ? 46 : 36;
      phaseEnemies.forEach(enemy=>{
        if(!enemy.alive) return;
        const ex=enemy.x-scrollX;
        const emx=Math.floor(enemy.w*.2), emy=Math.floor(enemy.h*.15);
        if(rectsOverlap(fireX, fireY, fireW, fireH, ex+emx, enemy.y-enemy.h+emy, enemy.w-emx*2, enemy.h-emy)){
          discoverCreature(enemy.type);
          enemy.alive=false; score+=50;
          spawnParticles(ex+enemy.w/2, enemy.y-enemy.h/2, '#fb923c', 16); updateUI();
        }
      });
      hitChaser(fireX, fireY, fireW, fireH);
    }
  }

  // player hitbox (tight)
  const ph2 = player.ducking ? 22 : 36;
  const pHX=player.x+15, pHY=player.y-ph2, pHW=player.w-30, pHH=ph2;

  // eggs
  phaseEggs.forEach(egg=>{
    if(egg.collected) return;
    egg.bob+=0.05;
    const ex=egg.x-scrollX, ey=egg.y+Math.sin(egg.bob)*5;
    if(rectsOverlap(pHX,pHY,pHW,pHH, ex-egg.r*.55, ey-egg.r, egg.r*1.1, egg.r*1.8)){
      collectEgg(egg, ex, ey, false);
    }
  });

  // coins
  phaseCoins.forEach(coin=>{
    if(coin.collected) return;
    coin.bob += 0.06;
    const cx = coin.x - scrollX;
    if(Math.abs(cx - (player.x + player.w/2)) < 24 && Math.abs(coin.y - player.y) < 50){
      coin.collected = true; totalCoins++; score += 25;
      saveProgress();
      updateUI(); spawnParticles(cx, coin.y, '#fbbf24', 8); sfxEgg();
    }
  });

  // spike traps
  phaseTraps.forEach(trap=>{
    const tx = trap.x - scrollX;
    if(tx < -60 || tx > W + 60) return;
    if(player.invincible > 0) return;
    if(player.y >= GROUND - 20 &&
       player.x + 8 < tx + trap.w &&
       player.x + player.w - 8 > tx){
      if(selectedChar==='caveman' && shopUpgrades.tough > 0 && Math.random() < shopUpgrades.tough * 0.18){
        player.invincible = 45;
        spawnParticles(player.x+player.w/2, player.y-20, '#fbbf24', 10);
        return;
      }
      hurt();
    }
  });

  // power-up items
  powerupItems.forEach(item=>{
    if(item.collected) return;
    item.bob += 0.07;
    const ix = item.x - scrollX;
    const iy = item.y + Math.sin(item.bob) * 5;
    const playerNear = Math.abs(ix - (player.x + player.w/2)) < 120 && Math.abs(iy - (player.y-24)) < 110;
    const petNear = Math.hypot(ix - (pet.x+14), iy - (pet.y-18)) < petCollectRadius();
    if((playerNear || petNear) && inventory.length < 2){
      collectPowerup(item, ix, iy, petNear);
    }
  });

  // segredos escondidos
  phaseSecrets.forEach(sec=>{
    if(sec.found) return;
    const sx = sec.x - scrollX;
    const sy = sec.y + Math.sin(frameCount*.08)*3;
    const playerNear = Math.hypot(sx-(player.x+player.w/2), sy-(player.y-30)) < 46;
    const petNear = Math.hypot(sx-(pet.x+14), sy-(pet.y-18)) < petCollectRadius();
    if(playerNear || petNear){
      sec.found = true;
      totalCoins += 3;
      score += 120;
      secretUnlocked = true;
      petFriend = Math.min(100, petFriend + 20);
      if(petFriend >= 100) triggerPetFriendPower();
      petSpeech.text = tr('secretFound');
      petSpeech.timer = 140;
      spawnParticles(sx, sy, '#a78bfa', 18);
      sfxEgg();
      saveProgress();
    }
  });

  // pet com habilidade própria
  if(selectedChar==='dino'){
    phaseCoins.forEach(coin=>{
      if(coin.collected) return;
      const cx = coin.x - scrollX;
      if(Math.hypot(cx-(pet.x+14), coin.y-(pet.y-18)) < petCollectRadius() * 0.8){
        coin.collected = true; totalCoins++; score += 25;
        spawnParticles(cx, coin.y, '#fbbf24', 6);
        saveProgress();
      }
    });
  }


  // obstacles
  phaseObstacles.forEach(obs=>{
    const ox=obs.x-scrollX;
    if(ox<-120||ox>W+120) return;
    if(player.invincible>0) return;
    const mx={rock:10,cactus:12,fire:11,log:7}[obs.type]||8;
    const my={rock:12,fire:8,log:6,cactus:6}[obs.type]||6;
    if(rectsOverlap(pHX,pHY,pHW,pHH, ox+mx, obs.y-obs.h+my, obs.w-mx*2, obs.h-my)) hurt();
  });

  // enemies
  phaseEnemies.forEach(enemy=>{
    if(!enemy.alive) return;
    enemy.x+=enemy.vx;
    if(enemy.flying) enemy.y=(GROUND-110)+Math.sin(frameCount*.03+enemy.bobOffset)*28;
    enemy.frameTimer++;
    if(enemy.frameTimer>8){enemy.frame=(enemy.frame+1)%2; enemy.frameTimer=0;}
    const ex=enemy.x-scrollX;
    if(ex>-80 && ex<W+80) discoverCreature(enemy.type);
    if(enemy.x<scrollX-60) enemy.vx=Math.abs(enemy.vx);
    if(enemy.x>scrollX+currentLen) enemy.vx=-Math.abs(enemy.vx);
    if(player.invincible>0) return;
    const emx=Math.floor(enemy.w*.3), emy=Math.floor(enemy.h*.2);
    const eHX=ex+emx, eHY=enemy.y-enemy.h+emy, eHW=enemy.w-emx*2, eHH=enemy.h-emy;
    if(rectsOverlap(pHX,pHY,pHW,pHH, eHX,eHY,eHW,eHH)){
      if(player.vy>1 && player.y<=enemy.y-enemy.h*.4){
        discoverCreature(enemy.type);
        enemy.alive=false; player.vy=JUMP_FORCE*.6; score+=50;
        stompCombo++; stompComboTimer=90;
        const comboBonus=stompCombo>=3?stompCombo*5:0;
        if(comboBonus){totalCoins+=comboBonus;score+=comboBonus*10;floatText(`COMBO x${stompCombo}! +${comboBonus}`,ex+enemy.w/2,enemy.y-enemy.h,'#ffe66d');}
        if(stompCombo>=3){unlockAchievement('combo3');}
        spawnParticles(ex+enemy.w/2, enemy.y-enemy.h/2,'#ff6b6b',12); updateUI();
      } else { hurt(); }
    }
  });

  // ── pet update ──
  pet.history.push({x: player.x + scrollX, y: player.y});
  if(pet.history.length > 52) pet.history.shift();
  const target = pet.history[0] || {x: pet.x + scrollX, y: GROUND};
  const targetScreenX = target.x - scrollX - 36;
  // horizontal lerp suave
  pet.x += (targetScreenX - pet.x) * 0.18;
  if(pet.x < targetScreenX) pet.facing=1; else if(pet.x > targetScreenX+4) pet.facing=-1;
  // gravidade do pet
  pet.vy += GRAVITY;
  pet.y  += pet.vy;
  // colisão com plataformas (top-only)
  if(pet.vy >= 0){
    phasePlatforms.forEach(plat=>{
      const px=plat.x-scrollX;
      const prev=pet.y-pet.vy;
      if(prev<=plat.y && pet.y>=plat.y &&
         pet.x+22>px && pet.x+6<px+plat.w){
        pet.y=plat.y; pet.vy=0; pet.onGround=true;
      }
    });
  }
  if(pet.y >= target.y){ pet.y=target.y; pet.vy=0; pet.onGround=true; }
  else { pet.onGround=false; }
  // pula para alcançar o player se estiver muito abaixo
  if(pet.onGround && target.y < pet.y - 30) { pet.vy=-11; pet.onGround=false; }
  // animação
  pet.frameTimer++;
  if(pet.frameTimer>8){ pet.frame=(pet.frame+1)%4; pet.frameTimer=0; }
  pet.bobPhase += 0.1;

  // ── pet: coleta ovos próximos ──
  phaseEggs.forEach(egg=>{
    if(egg.collected) return;
    const ex = egg.x - scrollX;
    const ey = egg.y + Math.sin(egg.bob) * 5;
    const petDist = Math.hypot(ex - (pet.x+14), ey - (pet.y-18));
    const playerNear = Math.abs(ex - (player.x+player.w/2)) < 120 && Math.abs(ey - (player.y-28)) < 130;
    if(petDist < petCollectRadius() || playerNear){
      collectEgg(egg, ex, ey, petDist < petCollectRadius());
      pet.facing = ex > pet.x ? 1 : -1;
    }
  });

  // portal — depois da coleta do pet, para ativar imediatamente se o pet pegar o último ovo
  const allEggs = phaseEggs.every(e=>e.collected);
  const pxPor = portalX-scrollX;
  if(allEggs && rectsOverlap(player.x+10,player.y-52,player.w-20,52, pxPor,GROUND-110,64,110)){
    score+=500; updateUI();
    // achievements & diary on phase clear
    if(!isSecretPhase){
      unlockAchievement('first_win');
      if(phaseNoDamage) unlockAchievement('no_damage');
      if(phase===MAX_PHASES) unlockAchievement('all_phases');
      const elapsed=Math.round((calcPhaseFrames(phase)+shopUpgrades.timeBoost*600-phaseFramesLeft)/60);
      const diaryEntry={phase,date:new Date().toLocaleDateString('pt-BR'),time:elapsed,coins:totalCoins,noDamage:phaseNoDamage};
      phaseDiary.unshift(diaryEntry);
      if(phaseDiary.length>20) phaseDiary=phaseDiary.slice(0,20);
      localStorage.setItem('dinogame_diary',JSON.stringify(phaseDiary));
      saveProgress();
    }
    showOverlay(isSecretPhase ? 'secretclear' : 'phaseclear');
  }
  // pet speech triggers
  if(petSpeech.timer > 0) petSpeech.timer--;
  if(petSpeech.timer === 0 && Math.random() < 0.014){
    const nearEnemy = phaseEnemies.some(e=>e.alive && Math.abs((e.x-scrollX)-(pet.x+14))<160);
    const portalNear = Math.abs(portalX-scrollX-pet.x) < 220;
    if(player.hp <= 1)                               petSpeech.text = petLine('lowHp');
    else if(nearEnemy)                               petSpeech.text = petLine('enemy');
    else if(portalNear && phaseEggs.every(e=>e.collected)) petSpeech.text = petLine('portal');
    else if(dayNight < 0.35)                         petSpeech.text = petLine('night');
    else if(Math.random() < 0.3)                     petSpeech.text = petLine('weather');
    else                                             petSpeech.text = petLine('idle');
    petSpeech.timer = 200;
  }

  // weather spawn & update
  const wTheme = currentTheme ? THEMES.indexOf(currentTheme) : -1;
  if(wTheme === 0){
    if(Math.random()<0.35) weatherParticles.push({x:Math.random()*W+scrollX*.05, y:-10, vx:-0.5, vy:14+Math.random()*4, life:60, type:'rain'});
  } else if(wTheme === 1){
    if(Math.random()<0.2) weatherParticles.push({x:Math.random()*W, y:Math.random()*H*.6, vx:1.2+Math.random(), vy:0.3+Math.random()*.5, life:120+Math.floor(Math.random()*80), type:'ash'});
  } else if(wTheme === 2){
    if(Math.random()<0.18) weatherParticles.push({x:Math.random()*W, y:-8, vx:Math.sin(frameCount*.02)*.8, vy:1.5+Math.random()*1.5, life:200, type:'snow'});
  } else if(wTheme === 3){
    if(Math.random()<0.15) weatherParticles.push({x:Math.random()*W, y:GROUND-Math.random()*100, vx:(Math.random()-.5)*.6, vy:-1.2-Math.random(), life:180, type:'spore'});
  }
  weatherParticles.forEach(w=>{ w.x+=w.vx; w.y+=w.vy; w.life--; });
  weatherParticles = weatherParticles.filter(w=>w.life>0 && w.y<H+20 && w.y>-30);
  if(weatherParticles.length > 200) weatherParticles = weatherParticles.slice(-200);

  // particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--;});
  particles=particles.filter(p=>p.life>0);
  clouds.forEach(c=>{c.x-=c.speed; if(c.x+c.w<0) c.x=currentLen;});

  // stomp combo timer
  if(stompComboTimer>0){ stompComboTimer--; if(stompComboTimer===0) stompCombo=0; }

  // alavanca
  if(phaseLever && !phaseLever.activated){
    const lx = phaseLever.x - scrollX;
    if(rectsOverlap(player.x+8, player.y-52, player.w-16, 52, lx-22, GROUND-55, 44, 55)){
      phaseLever.activated = true;
      boulderRoll = {x: phaseLever.x + 350, y: GROUND - 40, r: 42, vx: -9, angle: 0, active: true};
      spawnParticles(lx, GROUND-30, '#fbbf24', 14);
    }
  }

  // pedra rolando
  if(boulderRoll && boulderRoll.active){
    boulderRoll.x += boulderRoll.vx;
    boulderRoll.angle += Math.abs(boulderRoll.vx) / boulderRoll.r;
    if(phaseBoss && phaseBoss.alive){
      const bsx = phaseBoss.x - scrollX;
      const brx = boulderRoll.x - scrollX;
      if(Math.abs(brx - (bsx + phaseBoss.w/2)) < phaseBoss.w/2 + boulderRoll.r - 10){
        phaseBoss.hp = 0; phaseBoss.alive = false; boulderRoll.active = false;
        totalCoins += 30; score += 1000; updateUI();
        spawnParticles(bsx + phaseBoss.w/2, phaseBoss.y-phaseBoss.h/2, '#fbbf24', 40);
        spawnParticles(bsx + phaseBoss.w/2, phaseBoss.y-phaseBoss.h/2, '#ef4444', 30);
        unlockAchievement('boss_kill'); saveProgress();
      }
    }
    if(boulderRoll.x < scrollX - 200) boulderRoll.active = false;
  }

  // boss update
  if(phaseBoss && phaseBoss.alive){
    const bx=phaseBoss.x-scrollX;
    phaseBoss.x+=phaseBoss.vx;
    if(phaseBoss.x-scrollX < 80) phaseBoss.vx=Math.abs(phaseBoss.vx);
    phaseBoss.frameTimer++; if(phaseBoss.frameTimer>12){phaseBoss.frame=(phaseBoss.frame+1)%4;phaseBoss.frameTimer=0;}
    if(phaseBoss.hitFlash>0) phaseBoss.hitFlash--;
    const pHX=player.x+10,pHY=player.y-52,pHW=player.w-20,pHH=52;
    const bex=phaseBoss.x-scrollX, bey=phaseBoss.y-phaseBoss.h;
    if(rectsOverlap(pHX,pHY,pHW,pHH, bex+16,bey+10,phaseBoss.w-32,phaseBoss.h-10)){
      if(player.vy>1 && player.y<=phaseBoss.y-phaseBoss.h*.4){
        phaseBoss.hp--; phaseBoss.hitFlash=18;
        player.vy=JUMP_FORCE*.7; score+=200; updateUI();
        spawnParticles(bex+phaseBoss.w/2,bey+phaseBoss.h/2,'#ef4444',16);
        if(phaseBoss.hp<=0){
          phaseBoss.alive=false; totalCoins+=30; score+=1000; updateUI();
          spawnParticles(bex+phaseBoss.w/2,bey+phaseBoss.h/2,'#fbbf24',30);
          unlockAchievement('boss_kill'); saveProgress();
        }
      } else { hurt(); }
    }
  }

  // Dino Rosa de cartola: aparece atrás, persegue e mata com um toque
  if(phaseChaser && phaseChaser.alive){
    const ch=phaseChaser;
    if(ch.spawnAt===null){
      const total = phaseFramesLeft + frameCount;
      if(ch.mode==='seventy' && total <= 75*60) ch.mode='random';
      ch.spawnAt = ch.mode==='seventy' ? total - 70*60 : Math.round(total*(0.15+Math.random()*0.55));
    }
    if(!ch.active && frameCount>=ch.spawnAt){
      const behind = player.x > 220;
      ch.active=true; ch.emerge=45; ch.y=GROUND; ch.vy=0; ch.onGround=true;
      ch.x = scrollX + player.x + (behind ? -190 : 260);
      spawnParticles(ch.x-scrollX+30, GROUND-4, '#C98B5B', 26);
      floatTexts.push({x:scrollX+player.x+24, y:player.y-110, vy:-0.3, life:140, text:'Cuidado! Dino Rosa!', color:'#FF8FC7'});
      petSpeech.text='Corre! Dino Rosa!'; petSpeech.timer=150;
    }
    if(ch.active && ch.emerge>0){
      ch.emerge--;
      if(ch.emerge%6===0) spawnParticles(ch.x-scrollX+30, GROUND-4, '#B37548', 6);
    } else if(ch.active){
      const px=scrollX+player.x+player.w/2, cx=ch.x+28;
      const dir=Math.sign(px-cx)||1;
      ch.facing=dir;
      if(Math.abs(px-cx)>6) ch.x+=dir*moveSpeed()*0.72;
      if(ch.onGround && player.y<GROUND-40 && Math.abs(px-cx)<160){ ch.vy=JUMP_FORCE*0.85; ch.onGround=false; }
      ch.vy+=GRAVITY; ch.y+=ch.vy;
      if(ch.y>=GROUND){ ch.y=GROUND; ch.vy=0; ch.onGround=true; }
      if(ch.hitCd>0) ch.hitCd--;
      if(ch.hitFlash>0) ch.hitFlash--;
      const sx=ch.x-scrollX;
      if(rectsOverlap(pHX,pHY,pHW,pHH, sx+12, ch.y-58, 40, 58)){
        if(activeEffects.shield>0 || player.invincible>0){
          ch.x-=dir*90; ch.vy=-6; ch.onGround=false;
        } else {
          chaserCatch();
          return;
        }
      }
    }
  }

  // achievement: coin 100
  if(totalCoins>=100) unlockAchievement('coin100');
  // notif timer
  if(achieveNotifTimer>0) achieveNotifTimer--;
  else if(achieveNotifQueue.length>0){ achieveNotifTimer=180; }
}

function activatePowerup(slot){
  if(slot >= inventory.length) return;
  const type = inventory[slot];
  inventory.splice(slot, 1);
  const durations = {speed: 480, shield: 360, fire: 600};
  activeEffects[type] = durations[type] || 480;
  spawnParticles(player.x + player.w/2, player.y - 30,
    type==='speed'?'#fb923c':type==='shield'?'#60a5fa':'#ef4444', 14);
  sfxJump();
}

function collectEgg(egg, ex, ey, byPet=false){
  if(egg.collected) return;
  egg.collected = true;
  let bonus = 100;
  if(egg.kind==='gold'){
    bonus = 250;
    totalCoins += 2;
    saveProgress();
    petSpeech.text = tr('specialEggGold');
  } else if(egg.kind==='blue'){
    phaseFramesLeft += 600;
    petSpeech.text = tr('specialEggBlue');
  } else if(egg.kind==='red'){
    activeEffects.shield = Math.max(activeEffects.shield, 300);
    petSpeech.text = tr('specialEggRed');
  } else if(egg.kind==='rainbow'){
    petFriend = 100;
    triggerPetFriendPower();
    petSpeech.text = tr('specialEggRainbow');
  } else if(egg.kind==='fossil'){
    bonus = 150;
    totalCoins += 4;
    petSpeech.text = tr('specialEggFossil');
  } else if(egg.kind==='ghost'){
    activeEffects.shield = Math.max(activeEffects.shield, 520);
    petSpeech.text = tr('specialEggGhost');
  } else if(egg.kind==='dragon'){
    activeEffects.fire = Math.max(activeEffects.fire, 700);
    petSpeech.text = tr('specialEggDragon');
  } else {
    petSpeech.text = petLine('egg');
  }
  if(egg.kind && egg.kind !== 'normal') discoveredEggs.add(egg.kind);
  score += bonus;
  addPetXP(byPet ? 2 : 1);
  if(byPet && petFriend >= 100) triggerPetFriendPower();
  updateUI();
  sfxEgg();
  spawnParticles(ex, ey, egg.kind==='red'?'#f87171':egg.kind==='blue'?'#60a5fa':egg.kind==='gold'?'#fde047':'#fde68a', 14);
  petSpeech.timer = 130;
}

function collectPowerup(item, ix, iy, byPet=false){
  if(item.collected || inventory.length >= 2) return;
  item.collected = true;
  inventory.push(item.type);
  addPetXP(byPet ? 2 : 1);
  pet.facing = ix > pet.x ? 1 : -1;
  petSpeech.text = petLine('egg');
  petSpeech.timer = 120;
  spawnParticles(ix, iy, item.type==='speed'?'#fb923c':item.type==='shield'?'#60a5fa':'#ef4444', 10);
  sfxEgg();
}

function hitChaser(ax,ay,aw,ah){
  const ch=phaseChaser;
  if(!ch || !ch.active || !ch.alive || ch.hitCd>0) return;
  const sx=ch.x-scrollX;
  if(!rectsOverlap(ax,ay,aw,ah, sx+8, ch.y-62, 48, 62)) return;
  ch.hp--; ch.hitCd=24; ch.hitFlash=18; ch.x-=ch.facing*60;
  spawnParticles(sx+30, ch.y-34, '#FF8FC7', 14);
  if(ch.hp<=0){
    ch.alive=false; score+=500; totalCoins+=5; updateUI(); saveProgress();
    spawnParticles(sx+30, ch.y-34, '#FFD23F', 26);
    floatTexts.push({x:ch.x+30, y:ch.y-90, vy:-0.4, life:90, text:'Dino Rosa derrotado! +500', color:'#FFD23F'});
  }
}

function chaserCatch(){
  phaseNoDamage=false; stompCombo=0;
  player.hp=3; lives--; flashTimer=22;
  spawnParticles(player.x+player.w/2,player.y-22,'#FF8FC7',22);
  updateUI();
  if(lives<=0){ sfxDie(); showOverlay('gameover'); } else { sfxHurt(); showOverlay('dead'); }
}

function hurt(){
  if(activeEffects.shield > 0) return;
  if(selectedChar==='caveman' && shopUpgrades.tough > 0 && Math.random() < shopUpgrades.tough * 0.16){
    player.invincible=80;
    petSpeech.text='Pet protegeu!';
    petSpeech.timer=120;
    spawnParticles(player.x+player.w/2,player.y-22,'#60a5fa',14);
    return;
  }
  phaseNoDamage=false; stompCombo=0;
  player.hp--;
  player.invincible=70; flashTimer=22;
  spawnParticles(player.x+player.w/2,player.y-22,'#ff6b6b',16);
  if(player.hp<=0){
    player.hp=3;
    lives--;
    updateUI();
    if(lives<=0){ sfxDie(); showOverlay('gameover'); } else { sfxHurt(); showOverlay('dead'); }
  } else {
    sfxHurt();
    updateUI();
  }
}

function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}
let floatTexts=[];
function floatText(text,x,y,color='#ffe66d'){
  floatTexts.push({text,x,y,color,life:60,vy:-1.2});
}

function drawLever(x, y, activated){
  // base
  ctx.fillStyle='#78350f'; roundRect(ctx,x-18,y-8,36,8,3,true,false);
  // haste
  ctx.fillStyle='#92400e'; ctx.fillRect(x-5,y-48,10,40);
  // cabo — inclina ao ativar
  const ang = activated ? Math.PI/4 : -Math.PI/4;
  ctx.save(); ctx.translate(x, y-48);
  ctx.rotate(ang);
  ctx.fillStyle='#dc2626'; roundRect(ctx,-6,-30,12,32,6,true,false);
  ctx.fillStyle='#fca5a5'; ctx.beginPath(); ctx.arc(0,-30,9,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#7f1d1d'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
  // sinal
  if(!activated){
    hudFont(900,12); ctx.textAlign='center'; ctx.textBaseline='middle';
    const lw=ctx.measureText('ATIVAR → CHEFE').width+18;
    ctx.fillStyle='#FFFFFF'; ctx.strokeStyle=OL; ctx.lineWidth=2.5; roundRect(ctx,x-lw/2,y-84,lw,22,11,true,true);
    ctx.fillStyle=OL; ctx.fillText('ATIVAR → CHEFE',x,y-72);
    ctx.textBaseline='alphabetic';
  } else {
    ctx.font='5px "Press Start 2P"'; ctx.textAlign='center';
    ctx.fillStyle='#4ade80'; ctx.fillText('💥',x,y-62);
  }
  ctx.textAlign='left';
}

function drawBoulder(x, y, r, angle){
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.fillStyle='#6b7280'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#374151'; ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle='#4b5563'; ctx.lineWidth=2.5;
  [[-.6,-.2,.3,.4],[.4,-.5,-.2,.3],[-.3,.6,.5,-.1]].forEach(([x1,y1,x2,y2])=>{
    ctx.beginPath(); ctx.moveTo(x1*r,y1*r); ctx.lineTo(x2*r,y2*r); ctx.stroke();
  });
  ctx.fillStyle='rgba(209,213,219,.4)';
  ctx.beginPath(); ctx.arc(-r*.3,-r*.3,r*.32,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,color,life:20+Math.random()*20,size:3+Math.random()*3.5});
  }
}

// ─── CUTSCENE ─────────────────────────────────────────────────────────────────
function finishCutscene(){
  localStorage.setItem('dinogame_intro_seen','1');
  beginPhase(); state='playing';
}
function skipCutscene(){ if(state==='cutscene') finishCutscene(); }

function drawCutscene(){
  const T = cutsceneTimer;

  // sky
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#8ED8FF'); sg.addColorStop(.6,'#CDEFFF'); sg.addColorStop(1,'#B8E6FF');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);

  // sun
  ctx.fillStyle='#FFE27A';
  ctx.beginPath(); ctx.arc(W*.82,52,26,0,Math.PI*2); ctx.fill();

  // far mountains
  ctx.fillStyle='#5CC96B'; ctx.strokeStyle=OL; ctx.lineWidth=3;
  for(let i=-1;i<4;i++){
    const mx=i*280;
    ctx.beginPath(); ctx.moveTo(mx,GROUND);
    ctx.bezierCurveTo(mx+56,GROUND,mx+70,GROUND-100,mx+140,GROUND-100);
    ctx.bezierCurveTo(mx+210,GROUND-100,mx+224,GROUND,mx+280,GROUND);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  // background trees
  [[80,.55],[180,.7],[320,.5],[470,.8],[580,.6],[690,.75]].forEach(([tx,s])=>{
    const th=80*s,tw=50*s;
    ctx.fillStyle='#C98B5B'; ctx.strokeStyle=OL; ctx.lineWidth=3;
    roundRect(ctx,tx-tw*.15,GROUND-th*.45,tw*.3,th*.45,4,true,true);
    ctx.fillStyle='#7ED957';
    ctx.beginPath(); ctx.arc(tx,GROUND-th*.72,tw*.52,0,Math.PI*2); ctx.fill(); ctx.stroke();
  });

  // ground
  ctx.fillStyle='#7c4a1e'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#4a8f3f'; ctx.fillRect(0,GROUND-6,W,14);
  // grass tufts
  ctx.strokeStyle='#4a8f3f'; ctx.lineWidth=2.2; ctx.lineCap='round';
  for(let i=0;i<22;i++){
    const gx=i*38+4;
    ctx.beginPath(); ctx.moveTo(gx,GROUND-1); ctx.lineTo(gx-2,GROUND-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx+6,GROUND-1); ctx.lineTo(gx+6,GROUND-10); ctx.stroke();
  }

  // home (nest or cave) on far left
  drawCutsceneHome();

  // family waving
  const wave = Math.sin(T*.18)*14;
  // kid tries to follow (T 200-300) then gets held
  const kidStep = T>200&&T<300 ? Math.min((T-200)/40,1)*18 - (T>260?((T-260)/40)*18:0) : 0;
  drawCutsceneFamily(wave, kidStep);

  // player character: stands at x=230 until T=145, then walks right
  const walkP = Math.max(0, Math.min(1,(T-145)/230));
  const charX  = 230 + walkP*(W+80-230);
  const prevVx = player.vx;
  player.vx = walkP>0 ? MOVE_SPEED : 0;
  if(charX < W+90){
    if(selectedChar==='dino') drawDinoOn(ctx,charX,GROUND,0,false,1);
    else                      drawCavemanOn(ctx,charX,GROUND,0,false,1);
  }
  player.vx = prevVx;

  // speech bubble (T 55-135)
  if(T>55 && T<138){
    const a = T<75?(T-55)/20 : T>118?(138-T)/20 : 1;
    const lines = selectedChar==='dino' ? trArray('cutsceneDino') : trArray('cutsceneCaveman');
    drawCutsceneBubble(charX+18, GROUND-88, lines, a);
  }

  // footer text (T 400+)
  if(T>400){
    const a=Math.min(1,(T-400)/35);
    ctx.globalAlpha=a;
    hudFont(700,28,'d'); ctx.textAlign='center';
    ctx.lineWidth=6; ctx.strokeStyle='#FFFFFF'; ctx.lineJoin='round'; ctx.strokeText(tr('cutsceneStart'),W/2,H/2+8);
    ctx.fillStyle=OL; ctx.fillText(tr('cutsceneStart'),W/2,H/2+8);
    ctx.textAlign='left'; ctx.globalAlpha=1;
  }

  // fade in
  if(T<40){ ctx.fillStyle=`rgba(0,0,0,${1-T/40})`; ctx.fillRect(0,0,W,H); }
  // fade out
  if(T>455){ ctx.fillStyle=`rgba(0,0,0,${(T-455)/65})`; ctx.fillRect(0,0,W,H); }

  // skip hint
  if(T<450){
    ctx.fillStyle=OL; hudFont(900,13);
    ctx.textAlign='right'; ctx.fillText(tr('cutsceneSkip'),W-14,H-12); ctx.textAlign='left';
  }
}

function drawCutsceneHome(){
  if(selectedChar==='dino'){
    // nest: woven mound + eggs
    ctx.fillStyle='#78350f'; ctx.strokeStyle='#3a1f0a'; ctx.lineWidth=2;

    ctx.strokeStyle='#92400e'; ctx.lineWidth=1.2;
    for(let i=0;i<5;i++){
      ctx.beginPath(); ctx.arc(52,GROUND+6,20+i*4,Math.PI+.1,Math.PI*2-.1); ctx.stroke();
    }
    ['#fef3c7','#fce7f3','#e0f2fe'].forEach((col,i)=>{
      ctx.fillStyle=col; ctx.strokeStyle='#b45309'; ctx.lineWidth=1.5;

    ctx.bezierCurveTo(8,GROUND-112,94,GROUND-112,94,GROUND-78);
    ctx.lineTo(94,GROUND); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#1c0f00';
    ctx.beginPath();
    ctx.moveTo(18,GROUND); ctx.lineTo(18,GROUND-70);
    ctx.bezierCurveTo(18,GROUND-100,84,GROUND-100,84,GROUND-70);

}

function drawFamDino(x,y,sc,col,wave){
  const c=ctx;
  c.save(); c.translate(x+24*sc,y); c.scale(-sc,sc); c.translate(-(x+24*sc),-y);
  // tail
  c.strokeStyle='#15803d'; c.lineWidth=9*sc; c.lineCap='round';
  c.beginPath(); c.moveTo(x+8,y-26*sc); c.quadraticCurveTo(x-12,y-10*sc,x-14,y-1); c.stroke();
  c.strokeStyle=OL; c.lineWidth=1.8; c.stroke();
  // body
  c.fillStyle=col; c.strokeStyle=OL; c.lineWidth=2;
  c.beginPath(); c.ellipse(x+24,y-34*sc,19*sc,18*sc,0,0,Math.PI*2); c.fill(); c.stroke();
  // wave arm
  const ang=-0.4+wave/55;
  c.strokeStyle=col; c.lineWidth=6*sc; c.lineCap='round';

  c.lineTo(x+38+Math.cos(ang)*18*sc, y-40*sc+Math.sin(ang)*16*sc); c.stroke();
  c.strokeStyle=OL; c.lineWidth=1.5; c.stroke();
  // head

  c.beginPath(); c.arc(x+43,y-54*sc,11*sc,0,Math.PI*2); c.fill(); c.stroke();
  // eye
  c.fillStyle='#fff'; c.beginPath(); c.arc(x+41,y-58*sc,4*sc,0,Math.PI*2); c.fill();
  c.fillStyle='#1e3a8a'; c.beginPath(); c.arc(x+41,y-58*sc,2.2*sc,0,Math.PI*2); c.fill();
  // smile
  c.strokeStyle='#166534'; c.lineWidth=1.5;
  c.beginPath(); c.arc(x+45,y-50*sc,4*sc,.2,Math.PI-.2); c.stroke();
  c.restore();
}
