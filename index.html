<!DOCTYPE html>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    background:radial-gradient(ellipse at 50% 30%,#0d1b2a 0%,#090d14 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;font-family:'Press Start 2P','Courier New',monospace;
    user-select:none;
  }
  #gameContainer{
    position:relative;
    /* overflow NOT hidden — allows overlays/menus to scroll */
    transform-origin:top left;
    box-shadow:0 0 0 2px #4ecdc4,0 0 50px rgba(78,205,196,.35),0 0 100px rgba(78,205,196,.1);
    border-radius:14px;
  }
  canvas{display:block;border-radius:14px;}

  /* ── HUD BUTTONS ── */
  #hudBtns{position:absolute;top:8px;right:10px;display:flex;gap:6px;z-index:10;}
  .hbtn{cursor:pointer;background:rgba(8,12,24,.72);backdrop-filter:blur(6px);
    border:1.5px solid rgba(78,205,196,.35);border-radius:8px;
    color:#4ecdc4;font-family:inherit;font-size:10px;padding:4px 9px;
    transition:background .15s;}
  .hbtn:hover{background:rgba(20,30,50,.9);}
  .hbtn.muted{opacity:.4;}
  .hbtn.paused{border-color:rgba(251,191,36,.6);color:#fbbf24;}
  .hbtn.quit{border-color:rgba(239,68,68,.4);color:#f87171;}
  .hbtn.quit:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.7);}

  /* ── OVERLAY ── */
  #overlay{
    position:absolute;inset:0;
    background:rgba(4,8,18,.84);backdrop-filter:blur(6px);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:16px 8px 24px;
    z-index:20;color:#fff;text-align:center;
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  /* centre content when short enough to fit */
  #overlay.ov-center{justify-content:center;padding:0;}
  #overlay.win-mode{
    background:transparent !important;backdrop-filter:none !important;
    justify-content:flex-end !important;padding-bottom:36px;
    overflow:hidden;
  }
  .ocard{
    background:linear-gradient(160deg,rgba(14,22,44,.96),rgba(10,16,32,.96));
    border:1.5px solid rgba(78,205,196,.3);border-radius:20px;
    padding:26px 36px;display:flex;flex-direction:column;align-items:center;gap:12px;
    box-shadow:0 12px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
    max-width:480px;width:94%;flex-shrink:0;
    margin:auto;
  }
  #overlay h1{font-size:22px;color:#4ecdc4;text-shadow:0 0 28px rgba(78,205,196,.8);line-height:1.4;}
  #overlay h2{font-size:15px;color:#ffe66d;text-shadow:0 0 14px rgba(255,230,109,.6);}
  .sub{font-size:7px;color:#7a8fa8;line-height:2.1;letter-spacing:.4px;}
  .khint{
    font-size:6.5px;color:#4a5a70;line-height:2.3;
    background:rgba(78,205,196,.05);border:1px solid rgba(78,205,196,.12);
    border-radius:10px;padding:9px 14px;
  }
  .khint b{color:#4ecdc4;}
  .divider{width:100%;height:1px;background:rgba(78,205,196,.12);}
  .score-big{font-size:18px;color:#ffe66d;}
  .btn{
    padding:10px 22px;font-size:8.5px;font-family:'Press Start 2P',monospace;
    background:linear-gradient(135deg,#4ecdc4,#38b2ac);border:none;border-radius:10px;
    color:#071418;cursor:pointer;letter-spacing:.4px;
    box-shadow:0 4px 0 #1d6e6a,0 6px 18px rgba(78,205,196,.3);
    transition:transform .12s,box-shadow .12s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #1d6e6a,0 12px 28px rgba(78,205,196,.4);}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1d6e6a;}
  .btn.sec{background:linear-gradient(135deg,#667eea,#764ba2);box-shadow:0 4px 0 #3a2a6e,0 6px 18px rgba(102,126,234,.3);}
  .btn.sec:hover{box-shadow:0 6px 0 #3a2a6e,0 12px 28px rgba(102,126,234,.4);}
  .diff-row{display:flex;gap:8px;justify-content:center;margin-top:2px;flex-wrap:wrap;}
  .diff-btn{padding:8px 15px;font-size:7px;font-family:'Press Start 2P',monospace;
    border-radius:8px;border:2px solid transparent;cursor:pointer;letter-spacing:.3px;
    transition:transform .12s,box-shadow .12s,border-color .15s;}
  .diff-btn:hover{transform:translateY(-2px);}
  .diff-btn.facil  {background:#15803d;color:#fff;}
  .diff-btn.normal {background:#1d4ed8;color:#fff;}
  .diff-btn.dificil{background:#991b1b;color:#fff;}
  .diff-btn.active {border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.5);}
  .lang-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .lang-btn{min-width:110px;padding:10px 12px;font-size:7.5px;font-family:'Press Start 2P',monospace;
    border-radius:10px;border:2px solid rgba(78,205,196,.25);cursor:pointer;
    background:rgba(20,30,55,.82);color:#c8dde8;line-height:1.8;
    transition:transform .12s,border-color .15s,box-shadow .15s;}
  .lang-btn:hover{transform:translateY(-2px);border-color:#4ecdc4;box-shadow:0 8px 28px rgba(78,205,196,.25);}
  .credits{font-size:5.5px;color:#3a4a5a;letter-spacing:.3px;margin-top:4px;line-height:2;}

  /* ── CHARACTER SELECT ── */
  .char-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .char-card{
    width:130px;border:2px solid rgba(78,205,196,.2);border-radius:14px;
    background:rgba(20,30,55,.7);padding:14px 10px 10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:border-color .2s,box-shadow .2s,transform .15s;
  }
  .char-card:hover{border-color:rgba(78,205,196,.6);transform:translateY(-3px);box-shadow:0 8px 30px rgba(78,205,196,.2);}
  .char-card.selected{border-color:#4ecdc4;box-shadow:0 0 0 2px #4ecdc4,0 8px 30px rgba(78,205,196,.35);}
  .char-card canvas{border-radius:8px;background:rgba(255,255,255,.04);}
  .char-name{font-size:6.5px;color:#c8dde8;letter-spacing:.3px;}
  .char-desc{font-size:5.5px;color:#4a6070;letter-spacing:.2px;line-height:1.8;text-align:center;}
  .map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;}
  .map-node{border:1.5px solid rgba(78,205,196,.22);border-radius:12px;background:rgba(20,30,55,.72);
    color:#c8dde8;font-family:inherit;font-size:6.5px;line-height:1.8;padding:10px 8px;cursor:pointer;text-align:left;}
  .map-node.unlocked:hover{border-color:#4ecdc4;box-shadow:0 8px 26px rgba(78,205,196,.22);}
  .map-node.locked{opacity:.38;cursor:not-allowed;}
  .map-node.active{border-color:#ffe66d;box-shadow:0 0 0 2px rgba(255,230,109,.32);}
  .album-card{max-width:500px;padding:18px 24px;gap:7px;}
  .album-card h2{font-size:13px !important;}
  .album-card .sub{font-size:5.5px;line-height:1.45;}
  .album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;}
  .album-node{min-height:42px;border-radius:8px;font-size:5px;line-height:1.45;padding:6px 5px;}
  .shop-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%;}
  .shop-item{width:128px;min-height:78px;border:1.5px solid rgba(255,255,255,.14);border-radius:12px;
    background:rgba(255,255,255,.06);color:#dce8f1;font-family:inherit;font-size:6px;line-height:1.8;padding:8px;cursor:pointer;}
  .shop-item:hover{border-color:#fbbf24;}
  .shop-item.bought{opacity:.48;cursor:default;}
  .story-art{width:100%;height:90px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(78,205,196,.14);}
  .wardrobe-card{max-width:460px;padding:12px 14px;gap:5px;}
  .wardrobe-card h2{font-size:10px !important;}
  .wardrobe-card .sub{font-size:5px;line-height:1.2;}
  .wardrobe-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;width:100%;}
  .skin-card{width:70px;border:1.2px solid rgba(255,255,255,.14);border-radius:7px;background:rgba(255,255,255,.06);
    color:#dce8f1;font-family:inherit;font-size:4.5px;line-height:1.25;padding:4px;cursor:pointer;text-align:center;}
  .skin-card canvas{width:40px;height:30px;margin:0 auto 2px;border-radius:5px;background:rgba(5,10,22,.45);}
  .skin-card:hover{border-color:#4ecdc4;}
  .skin-card.selected{border-color:#ffe66d;box-shadow:0 0 0 2px rgba(255,230,109,.32);}

  /* ── MOBILE D-PAD (HTML buttons, not canvas) ── */
  #mobileControls{
    display:none;position:absolute;bottom:0;left:0;right:0;

  }
  #mobileControls.active{display:block;}
  .mbtn{
    position:absolute;pointer-events:auto;
    background:rgba(10,20,40,0.55);border:2px solid rgba(78,205,196,0.5);
    border-radius:16px;display:flex;align-items:center;justify-content:center;
    color:rgba(200,240,255,0.85);font-size:20px;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    touch-action:none;
    transition:background .08s,border-color .08s;
  }
  .mbtn:active,.mbtn.pressed{background:rgba(78,205,196,0.25);border-color:#4ecdc4;}

<body>
<div id="gameContainer">

  </div>
  <canvas id="c" width="800" height="450"></canvas>
  <!-- Mobile D-Pad (HTML buttons, positioned absolutely over canvas) -->
  <div id="mobileControls">
    <button class="mbtn" id="mbLeft"  style="left:10px;bottom:52px;width:58px;height:54px">◀</button>
    <button class="mbtn" id="mbRight" style="left:76px;bottom:52px;width:58px;height:54px">▶</button>
    <button class="mbtn" id="mbDuck"  style="left:10px;bottom:4px;width:124px;height:42px">▼</button>
    <button class="mbtn" id="mbAtk"   style="right:76px;bottom:52px;width:58px;height:54px">A</button>

    <div style="font-size:22px;margin-bottom:18px;">🦕 DinoGame</div>
    <div style="width:200px;height:8px;background:rgba(78,205,196,.15);border-radius:8px;overflow:hidden;">
      <div id="loadBar" style="width:0%;height:100%;background:linear-gradient(90deg,#4ecdc4,#ffe66d);border-radius:8px;transition:width .3s;"></div>
    </div>
    <div style="font-size:6px;color:#4a6070;margin-top:10px;">Carregando...</div>
  </div>
  <div id="overlay" style="display:none;">
    <div class="ocard" id="menuCard">
      <h1>🌎 DinoGame</h1>
      <div class="divider"></div>
      <h2>Escolha o idioma</h2>
      <p class="sub">Choose language · Elige idioma</p>
      <div class="lang-row">
        <button class="lang-btn" onclick="setLanguage('pt')">🇧🇷<br>Português</button>
        <button class="lang-btn" onclick="setLanguage('en')">🇺🇸<br>English</button>
        <button class="lang-btn" onclick="setLanguage('es')">🇪🇸<br>Español</button>
      </div>
      <p class="credits">Martin Coradi de Souza · 2026 · Co-autoria: Claude Code</p>
    </div>
  </div>
</div>

<script>
// ─── RESPONSIVE SCALING ────────────────────────────────────────────────────────
(function applyScale(){
  const CW=800,CH=450;
  const SIZE=.72;
  function resize(){
    const vw=window.innerWidth, vh=window.innerHeight;
    const s=Math.min(vw/CW, vh/CH) * SIZE;
    const el=document.getElementById('gameContainer');
    el.style.width=CW+'px'; el.style.height=CH+'px';
    el.style.transform='scale('+s+')';
    el.style.left=((vw-CW*s)/2)+'px';
    el.style.top=((vh-CH*s)/2)+'px';
    el.style.position='absolute';
    // show mobile D-pad when touch available
    const mob=document.getElementById('mobileControls');
    if(mob){
      const isTouch=('ontouchstart' in window)||((window.navigator&&window.navigator.maxTouchPoints)||0)>0;
      mob.classList.toggle('active',isTouch);
    }
  }
  resize();
  window.addEventListener('resize',resize);
})();

function scheduleBGM(){
  if(!audioCtx||!bgmOn) return;
  const bgmArr = nightMusicActive ? BGMS_NIGHT : BGMS;
  const bgm=bgmArr[bgmThemeIdx%bgmArr.length];
  const now=audioCtx.currentTime, ahead=0.14;
  while(bgmMelT<now+ahead){
    const [f,b]=bgm.mel[bgmMelIdx%bgm.mel.length]; const d=b*bgm.bpm;
    if(f){
      const o=audioCtx.createOscillator(),g=audioCtx.createGain(),flt=audioCtx.createBiquadFilter();
      flt.type='lowpass'; flt.frequency.value=1600;
      o.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
      o.type=bgm.melType; o.frequency.setValueAtTime(f,bgmMelT);
      g.gain.setValueAtTime(bgm.melVol,bgmMelT); g.gain.linearRampToValueAtTime(0,bgmMelT+d*.88);
      o.start(bgmMelT); o.stop(bgmMelT+d);
    }
    bgmMelT+=d; bgmMelIdx++;
  }
  while(bgmBasT<now+ahead){
    const [f,b]=bgm.bas[bgmBasIdx%bgm.bas.length]; const d=b*bgm.bpm;
    if(f){
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type=bgm.basType; o.frequency.setValueAtTime(f,bgmBasT);
      g.gain.setValueAtTime(bgm.basVol,bgmBasT); g.gain.linearRampToValueAtTime(0,bgmBasT+d*.82);
      o.start(bgmBasT); o.stop(bgmBasT+d);
    }
    bgmBasT+=d; bgmBasIdx++;
  }
  requestAnimationFrame(scheduleBGM);
}

function startBGM(themeIdx=0){
  if(bgmMuted) return;
  ensureAudio();
  bgmThemeIdx=themeIdx;
  bgmOn=true; bgmMelIdx=0; bgmBasIdx=0;
  bgmMelT=bgmBasT=audioCtx.currentTime;
  scheduleBGM();
}

function stopBGM(){ bgmOn=false; }

}

  if(e.code==='KeyM'){ toggleMute(); return; }
  if(['KeyP','Escape'].includes(e.code)){ togglePause(); return; }
  if(paused) return;
  if(state === 'playing'){
    if(['ArrowUp','KeyW','Space'].includes(e.code)) tryJump();
    if(['ArrowDown','KeyS'].includes(e.code)) player.ducking = true;
    if(['KeyZ','KeyX','KeyF'].includes(e.code) && !player.attacking){
      player.attacking=true;
      player.attackTimer = selectedChar==='caveman' ? 22 : 26;
      player.attackDir = player.facing;
      if(selectedChar==='dino') sfxFire();
    }
  }
  if(state === 'playing'){
    if(e.code === 'KeyQ' && inventory.length >= 1){ activatePowerup(0); }
    if(e.code === 'KeyE' && inventory.length >= 2){ activatePowerup(1); }
  }
  if(e.code==='Space' && state==='dead')      restartPhase();
  if(e.code==='Space' && state==='phaseclear') nextPhase();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if(['ArrowDown','KeyS'].includes(e.code)) player.ducking = false;
});

// ─── MOUSE INPUT ──────────────────────────────────────────────────────────────
let mouseX = W / 2;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
});
canvas.addEventListener('mousedown', e => {
  if(state !== 'playing' || paused) return;
  e.preventDefault();
  if(e.button === 0) tryJump();
  else if(e.button === 2 && !player.attacking){
    player.attacking = true;
    player.attackTimer = selectedChar==='caveman' ? 22 : 26;
    player.attackDir = player.facing;
    if(selectedChar==='dino') sfxFire();
  }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ─── HTML MOBILE D-PAD WIRING ────────────────────────────────────────────────
// Uses HTML button elements (not canvas-drawn) wired via pointer events.
// This means they work outside the canvas clipping area on all screen sizes.
function wireMobileBtn(id, downFn, upFn){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('pointerdown', e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    el.classList.add('pressed');
    if(downFn) downFn();
  });
  el.addEventListener('pointerup', e=>{
    e.preventDefault(); el.classList.remove('pressed');
    if(upFn) upFn();
  });
  el.addEventListener('pointercancel', e=>{
    el.classList.remove('pressed');
    if(upFn) upFn();
  });
}

// Called after DOM is ready (at end of script)
function initMobileDpad(){
  wireMobileBtn('mbLeft',
    ()=>{ keys['ArrowLeft']=true; },
    ()=>{ keys['ArrowLeft']=false; }
  );
  wireMobileBtn('mbRight',
    ()=>{ keys['ArrowRight']=true; },
    ()=>{ keys['ArrowRight']=false; }
  );
  wireMobileBtn('mbDuck',
    ()=>{ keys['ArrowDown']=true; player.ducking=true; },
    ()=>{ keys['ArrowDown']=false; player.ducking=false; }
  );
  wireMobileBtn('mbJump',
    ()=>{ if(state==='playing'&&!paused) tryJump(); },
    null
  );
  wireMobileBtn('mbAtk',
    ()=>{
      if(state!=='playing'||paused||player.attacking) return;
      player.attacking=true;
      player.attackTimer=selectedChar==='caveman'?22:26;
      player.attackDir=player.facing;
      if(selectedChar==='dino') sfxFire();
    },
    null
  );
}

function tryJump(){
  if(player.onGround){
    player.vy = jumpForce(); player.onGround = false; player.jumpCount = 1;
    spawnParticles(player.x+player.w/2, player.y, '#4ecdc4', 6);
    sfxJump();
  } else if(player.jumpCount===1){
    player.vy = jumpForce() * 0.82; player.jumpCount = 2;
    spawnParticles(player.x+player.w/2, player.y-20, '#ffe66d', 8);
    sfxJump();
  }
}

// ─── PHASE GENERATION ─────────────────────────────────────────────────────────
function generatePhase(p){
  const secret = p === 5;
  currentTheme = secret ? THEMES[3] : THEMES[(p-1) % THEMES.length];
  const len = secret ? 2600 : 4000 + (p-1)*800;
  currentLen = len;
  portalX = len - 220;
  secretPortalX = secret ? 0 : Math.floor(len * 0.68);

  weatherParticles = [];

  // stars
  stars = [];
  if(currentTheme.stars){
    for(let i=0;i<120;i++)
      stars.push({x:Math.random()*len, y:Math.random()*(GROUND-80), s:Math.random()*1.8+0.4, b:Math.random()});
  }

  // clouds
  clouds = [];
  for(let i=0;i<14;i++)
    clouds.push({x:200+i*(len/14)+Math.random()*150, y:35+Math.random()*90, w:70+Math.random()*90, speed:0.25+Math.random()*0.35});

  // background trees
  trees = [];
  for(let i=0;i<Math.floor(len/160);i++)
    trees.push({x:100+i*160+Math.random()*80, h:50+Math.random()*50, w:18+Math.random()*14, layer:Math.random()<0.5?'far':'near'});

  // plataformas no ar — grupos variados estilo Mario
  phasePlatforms = [];
  const platTypes = ['stone','wood','grass'];
  let cx = 380;
  while(cx < len - 350){
    const style = Math.random();
    const ptype = platTypes[Math.floor(Math.random()*platTypes.length)];
    if(style < 0.35){
      // escada ascendente
      const steps = 3 + Math.floor(Math.random()*3);
      for(let s=0;s<steps;s++){
        phasePlatforms.push({x:cx+s*100, y:GROUND-100-s*55, w:90, type:ptype});
      }
      cx += steps*100 + 180;
    } else if(style < 0.65){
      // ilha flutuante dupla
      const h = GROUND - 110 - Math.random()*80;
      phasePlatforms.push({x:cx,       y:h,    w:110+Math.random()*60, type:ptype});
      phasePlatforms.push({x:cx+180,   y:h-50, w:90+Math.random()*40,  type:ptype});
      cx += 360 + Math.random()*80;
    } else {
      // plataforma única larga
      phasePlatforms.push({x:cx, y:GROUND-95-Math.random()*100, w:140+Math.random()*80, type:ptype});
      cx += 260 + Math.random()*100;
    }
  }

  // eggs — metade no chão, metade em cima de plataformas
  phaseEggs = [];
  const eggCount = secret ? 6 : 2+p;
  const eggKinds = ['normal','normal','gold','blue','red','rainbow','fossil','ghost','dragon'];
  for(let i=0;i<eggCount;i++){
    const onPlat = phasePlatforms.length>0 && i%2===1;
    const plat   = onPlat ? phasePlatforms[Math.floor(Math.random()*phasePlatforms.length)] : null;
    phaseEggs.push({
      x: plat ? plat.x + plat.w/2 + (Math.random()*30-15) : 450 + i*Math.floor((len-650)/eggCount) + Math.random()*80,
      y: plat ? plat.y - 24 : GROUND - 28 - Math.random()*60,
      r:16, collected:false, bob:Math.random()*Math.PI*2,
      kind: i===0 ? 'normal' : eggKinds[Math.floor(Math.random()*eggKinds.length)],
    });
  }

  // obstáculos só aparecem a partir da fase 3
  phaseObstacles = [];
  if(p >= 3 && !secret){
    const obsTypes = ['rock','cactus','fire','log'];
    const obsCount = DIFF[difficulty].obsBase + (p-2)*2;
    for(let i=0;i<obsCount;i++){
      const t = obsTypes[Math.floor(Math.random()*obsTypes.length)];
      phaseObstacles.push({
        x: 500 + i*Math.floor((len-700)/obsCount) + Math.random()*50,
        y: GROUND, type:t,
        w: t==='log'?80 : t==='rock'?44 : 38,
        h: t==='rock'?44 : t==='log'?30 : 56,
      });
    }
  }

  // coins
  phaseCoins = [];
  const coinCount = secret ? 24 : 8 + phase * 2;
  for(let i = 0; i < coinCount; i++){
    phaseCoins.push({
      x: 300 + Math.random() * (len - 700),
      y: GROUND - 15,
      collected: false,
      bob: Math.random() * Math.PI * 2,
    });
  }

  // spike traps
  phaseTraps = [];
  const trapCount = secret ? 0 : 3 + phase;
  for(let i = 0; i < trapCount; i++){
    const tx = 500 + Math.random() * (len - 1000);
    // avoid portal area
    if(Math.abs(tx - portalX) < 300){ continue; }
    phaseTraps.push({x: tx, y: GROUND, w: 28, h: 18});
  }

  // power-up items
  powerupItems = []; inventory = []; activeEffects = {speed:0, shield:0, fire:0};
  const puTypes = ['speed','shield','fire'];
  const puCount = secret ? 4 : 1 + phase;
  for(let i = 0; i < puCount; i++){
    powerupItems.push({
      x: 400 + i * Math.floor((len - 600) / puCount) + Math.random() * 80,
      y: GROUND - 20,
      type: puTypes[i % puTypes.length],
      collected: false,
      bob: Math.random() * Math.PI * 2,
    });
  }

  checkpointX = Math.floor(len * 0.52);
  checkpointReached = false;

  phaseSecrets = [];
  for(let i=0;i<2;i++){
    const plat = phasePlatforms[Math.floor(Math.random()*phasePlatforms.length)];
    phaseSecrets.push({
      x: plat ? plat.x + Math.min(plat.w-24, 18+Math.random()*(plat.w-36)) : 700+Math.random()*(len-1200),
      y: plat ? plat.y - 42 : GROUND - 95 - Math.random()*70,
      found:false,
    });
  }

  // enemies
  phaseEnemies = [];
  const enemyTypes = ['ptero','trex','anky','raptor'];
  const enemyCount = secret ? 0 : DIFF[difficulty].enemyBase + p;
  const speedMult = DIFF[difficulty].speedMult;
  for(let i=0;i<enemyCount;i++){
    const t = enemyTypes[Math.floor(Math.random()*enemyTypes.length)];
    const flying = t==='ptero';
    phaseEnemies.push({
      x: 620 + i*Math.floor((len-820)/enemyCount) + Math.random()*70,
      y: flying ? GROUND-110-Math.random()*50 : GROUND,
      type:t, w:54, h:flying?38:54,
      vx: -(1.4 + Math.random()*(0.5+p*0.25)) * speedMult,
      flying, frame:0, frameTimer:0, alive:true,
      bobOffset:Math.random()*Math.PI*2,
    });
  }
}

function launchPhase(p){
  phase = p;
  isSecretPhase = p === 5;
  document.getElementById('overlay').style.display='none';
  const seen = localStorage.getItem('dinogame_intro_seen');
  if(!seen && p===1){
    state='cutscene';
    cutsceneTimer=0;
    startBGM(0);
  } else {
    beginPhase();
    state='playing';
  }
}

function buyShopItem(id){
  const costs = {petRange:6, extraLife:10, starterShield:8, jumpBoost:7, speedBoost:7, timeBoost:6, tough:8};
  const maxLevels = {petRange:3, jumpBoost:3, speedBoost:3, timeBoost:3, tough:3};
  if(maxLevels[id] !== undefined){
    if(shopUpgrades[id] >= maxLevels[id]) return;
    const cost = costs[id] || 0;
    if(totalCoins < cost){ alert(tr('notEnough')); return; }
    totalCoins -= cost;
    shopUpgrades[id]++;
    saveProgress();
    renderShop();
    return;
  }
  if(id==='petRange' && shopUpgrades.petRange>=3) return;
  if(id!=='petRange' && shopUpgrades[id]) return;
  const cost = costs[id] || 0;
  if(totalCoins < cost){ alert(tr('notEnough')); return; }
  totalCoins -= cost;
  if(id==='petRange') shopUpgrades.petRange++;
  else {
    shopUpgrades[id]=true;
    if(id==='extraLife') lives = Math.min(5, lives+1);
  }
  saveProgress();
  renderShop();
}

function chooseSkin(char,id){
  const skin = SKINS[char].find(s=>s.id===id);
  if(!skin) return;
  if(!ownedSkins[char].has(id)){
    if(totalCoins < skin.cost){ alert(tr('notEnough')); return; }
    totalCoins -= skin.cost;
    ownedSkins[char].add(id);
  }
  selectedSkin[char] = id;
  saveProgress();
  renderWardrobe();
}

function chooseAccessory(char,id){
  const acc = ACCESSORIES[char].find(a=>a.id===id);
  if(!acc) return;
  // buy if not owned
  if(!ownedAccessories[char].has(id)){
    if(totalCoins < acc.cost){ alert(tr('notEnough')); return; }
    totalCoins -= acc.cost;
    ownedAccessories[char].add(id);
  }
  // toggle: remove se já selecionado, adicionar se < 5
  const arr = selectedAccessory[char];
  const idx = arr.indexOf(id);
  if(idx !== -1){
    arr.splice(idx, 1); // desequipar
  } else if(arr.length < 5){
    arr.push(id);       // equipar
  } else {
    // substituir o mais antigo
    arr.shift();
    arr.push(id);
  }
  saveProgress();
  renderWardrobe();
}

function beginPhase(){
  scrollX=0;
  player.x=100; player.y=GROUND;
  player.vx=0; player.vy=0;
  player.onGround=true; player.ducking=false;
  player.invincible=0; player.jumpCount=0; player.hp=3;
  particles=[]; phasePlatforms=[]; frameCount=0;
  pet.x=60; pet.y=GROUND; pet.vy=0; pet.onGround=true;
  pet.frame=0; pet.facing=1; pet.history=[];
  generatePhase(phase);
  if(shopUpgrades.starterShield) activeEffects.shield = Math.max(activeEffects.shield, 240);
  phaseFramesLeft = calcPhaseFrames(phase) + shopUpgrades.timeBoost * 600;
  updateUI();
  const ti=(phase-1)%BGMS.length;
  stopBGM(); startBGM(ti);
}

function restartPhase(){
  if(lives<=0){ showOverlay('gameover'); return; }
  if(checkpointReached){
    resumeFromCheckpoint();
  } else {
    beginPhase();
  }
  document.getElementById('overlay').style.display='none';
  state='playing';
}

function resumeFromCheckpoint(){
  scrollX = Math.max(0, Math.min(currentLen-W, checkpointX - W*0.28));
  player.x = W*0.28; player.y = GROUND;
  player.vx=0; player.vy=0; player.hp=3; player.invincible=90;
  player.onGround=true; player.ducking=false; player.jumpCount=0;
  pet.x = player.x - 48; pet.y = GROUND; pet.vy=0; pet.history=[];
  phaseFramesLeft = Math.max(phaseFramesLeft, Math.floor(calcPhaseFrames(phase)*0.35));
  stopBGM(); startBGM((phase-1)%BGMS.length);
}

function nextPhase(){
  const routes = {1:[2,3],2:[4],3:[4],4:[]};
  const next = routes[phase] || [];
  if(!next.length){ showOverlay('win'); return; }
  next.forEach(p=>unlockedPhase = Math.max(unlockedPhase, p));
  saveProgress();
  phase = next[0];
  renderWorldMap();
}

function update(){
  if(state==='cutscene'){ cutsceneTimer++; if(cutsceneTimer>=520) finishCutscene(); return; }
  if(state==='win'){ winTimer++; return; }
  if(state!=='playing') return;
  frameCount++;

  // phase timer countdown
  if(phaseFramesLeft > 0){
    phaseFramesLeft--;
    if(phaseFramesLeft === 0){
      lives--; player.hp=3; updateUI();
      sfxDie();
      if(lives<=0) showOverlay('gameover');
      else showOverlay('dead');
      return;
    }
  }
  updateTimerUI();

  // day/night cycle
  dayNight = (Math.sin(frameCount / 900 * Math.PI) + 1) / 2;

  // day/night music transition
  const tod = dayNight < 0.4 ? 'night' : 'day';
  if(tod !== lastTimeOfDay && !bgmMuted){
    lastTimeOfDay = tod;
    nightMusicActive = (tod === 'night');
    stopBGM();
    startBGM((phase-1) % 4);
  }

  // power-up effect countdowns
  Object.keys(activeEffects).forEach(k => activeEffects[k] = Math.max(0, activeEffects[k] - 1));
  // shield: keep player invincible
  if(activeEffects.shield > 0) player.invincible = Math.max(player.invincible, 2);

  // horizontal movement
  const mr = keys['ArrowRight']||keys['KeyD'];
  const ml = keys['ArrowLeft'] ||keys['KeyA'];
  const speedMult = activeEffects.speed > 0 ? 1.6 : 1.0;
  const baseMove = moveSpeed();
  player.vx = mr ? baseMove * speedMult : ml ? -baseMove * speedMult : 0;
  if(mr) player.facing=1; else if(ml) player.facing=-1;
  else player.facing = mouseX > player.x + player.w/2 ? 1 : -1;

  player.vy += GRAVITY;
  player.x  += player.vx;
  player.y  += player.vy;
  if(player.x < 20) player.x = 20;

  // colisão com plataformas (top-only — pode pular por baixo)
  let onPlatform = false;
  if(player.vy >= 0){
    phasePlatforms.forEach(plat=>{
      const px = plat.x - scrollX;
      if(px > W+200 || px+plat.w < -100) return;
      const prevBottom = player.y - player.vy;
      if(prevBottom <= plat.y && player.y >= plat.y &&
         player.x+player.w-10 > px && player.x+10 < px+plat.w){
        player.y = plat.y; player.vy = 0; onPlatform = true;
      }
    });
  }

  if(player.y >= GROUND){
    player.y=GROUND; player.vy=0; player.onGround=true; player.jumpCount=0;
  } else if(onPlatform){
    player.onGround=true; player.jumpCount=0;
  } else { player.onGround=false; }

  // camera scroll
  if(player.x > W*0.36){
    const dx = player.x - W*0.36;
    if(scrollX+dx <= currentLen-W){ scrollX+=dx; player.x=W*0.36; }
    else { scrollX=currentLen-W; }
  }
  if(!checkpointReached && player.x + scrollX > checkpointX){
    checkpointReached = true;
    petSpeech.text = tr('checkpoint');
    petSpeech.timer = 150;
    spawnParticles(player.x+player.w/2, player.y-40, '#4ecdc4', 18);
  }

  player.frameTimer++;
  if(player.frameTimer>6){ player.frame=(player.frame+1)%4; player.frameTimer=0; }
  if(player.invincible>0) player.invincible--;
  player.h = player.ducking ? 30 : 56;

  // ataque com clava (caveman)
  if(player.attacking){
    player.attackTimer--;
    if(player.attackTimer<=0){ player.attacking=false; }
    // hitbox da clava ativa nos frames centrais do swing (timer 18→8)
    if(player.attackTimer<=18 && player.attackTimer>=6 && selectedChar==='caveman'){
      const clubX = player.attackDir>0 ? player.x+player.w-4 : player.x-38;
      const clubY = player.y-54;
      phaseEnemies.forEach(enemy=>{
        if(!enemy.alive) return;
        const ex=enemy.x-scrollX;
        const emx=Math.floor(enemy.w*.28), emy=Math.floor(enemy.h*.2);
        if(rectsOverlap(clubX, clubY, 40, 44, ex+emx, enemy.y-enemy.h+emy, enemy.w-emx*2, enemy.h-emy)){
          discoverCreature(enemy.type);
          enemy.alive=false; score+=50;
          spawnParticles(ex+enemy.w/2, enemy.y-enemy.h/2, '#ffb300', 14); updateUI();
        }
      });
    }
    if(player.attackTimer<=22 && player.attackTimer>=4 && selectedChar==='dino'){
      const fw = activeEffects.fire > 0 ? 138 : 96;
      const fireX = player.attackDir>0 ? player.x+player.w : player.x-fw;
      const fireY = player.y-68, fireW=fw, fireH=activeEffects.fire > 0 ? 46 : 36;
      phaseEnemies.forEach(enemy=>{
        if(!enemy.alive) return;
        const ex=enemy.x-scrollX;
        const emx=Math.floor(enemy.w*.2), emy=Math.floor(enemy.h*.15);
        if(rectsOverlap(fireX, fireY, fireW, fireH, ex+emx, enemy.y-enemy.h+emy, enemy.w-emx*2, enemy.h-emy)){
          discoverCreature(enemy.type);
          enemy.alive=false; score+=50;
          spawnParticles(ex+enemy.w/2, enemy.y-enemy.h/2, '#fb923c', 16); updateUI();
        }
      });
    }
  }

  // player hitbox (tight)
  const ph2 = player.ducking ? 22 : 36;
  const pHX=player.x+15, pHY=player.y-ph2, pHW=player.w-30, pHH=ph2;

  // eggs
  phaseEggs.forEach(egg=>{
    if(egg.collected) return;
    egg.bob+=0.05;
    const ex=egg.x-scrollX, ey=egg.y+Math.sin(egg.bob)*5;
    if(rectsOverlap(pHX,pHY,pHW,pHH, ex-egg.r*.55, ey-egg.r, egg.r*1.1, egg.r*1.8)){
      collectEgg(egg, ex, ey, false);
    }
  });

  // coins
  phaseCoins.forEach(coin=>{
    if(coin.collected) return;
    coin.bob += 0.06;
    const cx = coin.x - scrollX;
    if(Math.abs(cx - (player.x + player.w/2)) < 24 && Math.abs(coin.y - player.y) < 50){
      coin.collected = true; totalCoins++; score += 25;
      saveProgress();
      updateUI(); spawnParticles(cx, coin.y, '#fbbf24', 8); sfxEgg();
    }
  });

  // spike traps
  phaseTraps.forEach(trap=>{
    const tx = trap.x - scrollX;
    if(tx < -60 || tx > W + 60) return;
    if(player.invincible > 0) return;
    if(player.y >= GROUND - 20 &&
       player.x + 8 < tx + trap.w &&
       player.x + player.w - 8 > tx){
      if(selectedChar==='caveman' && shopUpgrades.tough > 0 && Math.random() < shopUpgrades.tough * 0.18){
        player.invincible = 45;
        spawnParticles(player.x+player.w/2, player.y-20, '#fbbf24', 10);
        return;
      }
      hurt();
    }
  });

  // power-up items
  powerupItems.forEach(item=>{
    if(item.collected) return;
    item.bob += 0.07;
    const ix = item.x - scrollX;
    const iy = item.y + Math.sin(item.bob) * 5;
    const playerNear = Math.abs(ix - (player.x + player.w/2)) < 120 && Math.abs(iy - (player.y-24)) < 110;
    const petNear = Math.hypot(ix - (pet.x+14), iy - (pet.y-18)) < petCollectRadius();
    if((playerNear || petNear) && inventory.length < 2){
      collectPowerup(item, ix, iy, petNear);
    }
  });

  // segredos escondidos
  phaseSecrets.forEach(sec=>{
    if(sec.found) return;
    const sx = sec.x - scrollX;
    const sy = sec.y + Math.sin(frameCount*.08)*3;
    const playerNear = Math.hypot(sx-(player.x+player.w/2), sy-(player.y-30)) < 46;
    const petNear = Math.hypot(sx-(pet.x+14), sy-(pet.y-18)) < petCollectRadius();
    if(playerNear || petNear){
      sec.found = true;
      totalCoins += 3;
      score += 120;
      secretUnlocked = true;
      petFriend = Math.min(100, petFriend + 20);
      if(petFriend >= 100) triggerPetFriendPower();
      petSpeech.text = tr('secretFound');
      petSpeech.timer = 140;
      spawnParticles(sx, sy, '#a78bfa', 18);
      sfxEgg();
      saveProgress();
    }
  });

  // pet com habilidade própria
  if(selectedChar==='dino'){
    phaseCoins.forEach(coin=>{
      if(coin.collected) return;
      const cx = coin.x - scrollX;
      if(Math.hypot(cx-(pet.x+14), coin.y-(pet.y-18)) < petCollectRadius() * 0.8){
        coin.collected = true; totalCoins++; score += 25;
        spawnParticles(cx, coin.y, '#fbbf24', 6);
        saveProgress();
      }
    });
  }


  // obstacles
  phaseObstacles.forEach(obs=>{
    const ox=obs.x-scrollX;
    if(ox<-120||ox>W+120) return;
    if(player.invincible>0) return;
    const mx={rock:10,cactus:12,fire:11,log:7}[obs.type]||8;
    const my={rock:12,fire:8,log:6,cactus:6}[obs.type]||6;
    if(rectsOverlap(pHX,pHY,pHW,pHH, ox+mx, obs.y-obs.h+my, obs.w-mx*2, obs.h-my)) hurt();
  });

  // enemies
  phaseEnemies.forEach(enemy=>{
    if(!enemy.alive) return;
    enemy.x+=enemy.vx;
    if(enemy.flying) enemy.y=(GROUND-110)+Math.sin(frameCount*.03+enemy.bobOffset)*28;
    enemy.frameTimer++;
    if(enemy.frameTimer>8){enemy.frame=(enemy.frame+1)%2; enemy.frameTimer=0;}
    const ex=enemy.x-scrollX;
    if(ex>-80 && ex<W+80) discoverCreature(enemy.type);
    if(enemy.x<scrollX-60) enemy.vx=Math.abs(enemy.vx);
    if(enemy.x>scrollX+currentLen) enemy.vx=-Math.abs(enemy.vx);
    if(player.invincible>0) return;
    const emx=Math.floor(enemy.w*.3), emy=Math.floor(enemy.h*.2);
    const eHX=ex+emx, eHY=enemy.y-enemy.h+emy, eHW=enemy.w-emx*2, eHH=enemy.h-emy;
    if(rectsOverlap(pHX,pHY,pHW,pHH, eHX,eHY,eHW,eHH)){
      if(player.vy>1 && player.y<=enemy.y-enemy.h*.4){
        discoverCreature(enemy.type);
        enemy.alive=false; player.vy=JUMP_FORCE*.6; score+=50;
        spawnParticles(ex+enemy.w/2, enemy.y-enemy.h/2,'#ff6b6b',12); updateUI();
      } else { hurt(); }
    }
  });

  // ── pet update ──
  pet.history.push({x: player.x + scrollX, y: player.y});
  if(pet.history.length > 52) pet.history.shift();
  const target = pet.history[0] || {x: pet.x + scrollX, y: GROUND};
  const targetScreenX = target.x - scrollX - 36;
  // horizontal lerp suave
  pet.x += (targetScreenX - pet.x) * 0.18;
  if(pet.x < targetScreenX) pet.facing=1; else if(pet.x > targetScreenX+4) pet.facing=-1;
  // gravidade do pet
  pet.vy += GRAVITY;
  pet.y  += pet.vy;
  // colisão com plataformas (top-only)
  if(pet.vy >= 0){
    phasePlatforms.forEach(plat=>{
      const px=plat.x-scrollX;
      const prev=pet.y-pet.vy;
      if(prev<=plat.y && pet.y>=plat.y &&
         pet.x+22>px && pet.x+6<px+plat.w){
        pet.y=plat.y; pet.vy=0; pet.onGround=true;
      }
    });
  }
  if(pet.y >= target.y){ pet.y=target.y; pet.vy=0; pet.onGround=true; }
  else { pet.onGround=false; }
  // pula para alcançar o player se estiver muito abaixo
  if(pet.onGround && target.y < pet.y - 30) { pet.vy=-11; pet.onGround=false; }
  // animação
  pet.frameTimer++;
  if(pet.frameTimer>8){ pet.frame=(pet.frame+1)%4; pet.frameTimer=0; }
  pet.bobPhase += 0.1;

  // ── pet: coleta ovos próximos ──
  phaseEggs.forEach(egg=>{
    if(egg.collected) return;
    const ex = egg.x - scrollX;
    const ey = egg.y + Math.sin(egg.bob) * 5;
    const petDist = Math.hypot(ex - (pet.x+14), ey - (pet.y-18));
    const playerNear = Math.abs(ex - (player.x+player.w/2)) < 120 && Math.abs(ey - (player.y-28)) < 130;
    if(petDist < petCollectRadius() || playerNear){
      collectEgg(egg, ex, ey, petDist < petCollectRadius());
      pet.facing = ex > pet.x ? 1 : -1;
    }
  });

  // portal — depois da coleta do pet, para ativar imediatamente se o pet pegar o último ovo
  const allEggs = phaseEggs.every(e=>e.collected);
  const pxPor = portalX-scrollX;
  if(allEggs && rectsOverlap(player.x+10,player.y-52,player.w-20,52, pxPor,GROUND-110,64,110)){
    score+=500; updateUI(); showOverlay(isSecretPhase ? 'secretclear' : 'phaseclear');
  }
  const spxPor = secretPortalX-scrollX;
  if(!isSecretPhase && secretUnlocked && rectsOverlap(player.x+10,player.y-52,player.w-20,52, spxPor,GROUND-96,54,96)){
    startSecretPhase();
    return;
  }

  // pet speech triggers
  if(petSpeech.timer > 0) petSpeech.timer--;
  if(petSpeech.timer === 0 && Math.random() < 0.014){
    const nearEnemy = phaseEnemies.some(e=>e.alive && Math.abs((e.x-scrollX)-(pet.x+14))<160);
    const portalNear = Math.abs(portalX-scrollX-pet.x) < 220;
    if(player.hp <= 1)                               petSpeech.text = petLine('lowHp');
    else if(nearEnemy)                               petSpeech.text = petLine('enemy');
    else if(portalNear && phaseEggs.every(e=>e.collected)) petSpeech.text = petLine('portal');
    else if(dayNight < 0.35)                         petSpeech.text = petLine('night');
    else if(Math.random() < 0.3)                     petSpeech.text = petLine('weather');
    else                                             petSpeech.text = petLine('idle');
    petSpeech.timer = 200;
  }

  // weather spawn & update
  const wTheme = currentTheme ? THEMES.indexOf(currentTheme) : -1;
  if(wTheme === 0){
    if(Math.random()<0.35) weatherParticles.push({x:Math.random()*W+scrollX*.05, y:-10, vx:-0.5, vy:14+Math.random()*4, life:60, type:'rain'});
  } else if(wTheme === 1){
    if(Math.random()<0.2) weatherParticles.push({x:Math.random()*W, y:Math.random()*H*.6, vx:1.2+Math.random(), vy:0.3+Math.random()*.5, life:120+Math.floor(Math.random()*80), type:'ash'});
  } else if(wTheme === 2){
    if(Math.random()<0.18) weatherParticles.push({x:Math.random()*W, y:-8, vx:Math.sin(frameCount*.02)*.8, vy:1.5+Math.random()*1.5, life:200, type:'snow'});
  } else if(wTheme === 3){
    if(Math.random()<0.15) weatherParticles.push({x:Math.random()*W, y:GROUND-Math.random()*100, vx:(Math.random()-.5)*.6, vy:-1.2-Math.random(), life:180, type:'spore'});
  }
  weatherParticles.forEach(w=>{ w.x+=w.vx; w.y+=w.vy; w.life--; });
  weatherParticles = weatherParticles.filter(w=>w.life>0 && w.y<H+20 && w.y>-30);
  if(weatherParticles.length > 200) weatherParticles = weatherParticles.slice(-200);

  // particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--;});
  particles=particles.filter(p=>p.life>0);
  clouds.forEach(c=>{c.x-=c.speed; if(c.x+c.w<0) c.x=currentLen;});
}

function activatePowerup(slot){
  if(slot >= inventory.length) return;
  const type = inventory[slot];
  inventory.splice(slot, 1);
  const durations = {speed: 480, shield: 360, fire: 600};
  activeEffects[type] = durations[type] || 480;
  spawnParticles(player.x + player.w/2, player.y - 30,
    type==='speed'?'#fb923c':type==='shield'?'#60a5fa':'#ef4444', 14);
  sfxJump();
}

function collectEgg(egg, ex, ey, byPet=false){
  if(egg.collected) return;
  egg.collected = true;
  let bonus = 100;
  if(egg.kind==='gold'){
    bonus = 250;
    totalCoins += 2;
    saveProgress();
    petSpeech.text = tr('specialEggGold');
  } else if(egg.kind==='blue'){
    phaseFramesLeft += 600;
    petSpeech.text = tr('specialEggBlue');
  } else if(egg.kind==='red'){
    activeEffects.shield = Math.max(activeEffects.shield, 300);
    petSpeech.text = tr('specialEggRed');
  } else if(egg.kind==='rainbow'){
    petFriend = 100;
    triggerPetFriendPower();
    petSpeech.text = tr('specialEggRainbow');
  } else if(egg.kind==='fossil'){
    bonus = 150;
    totalCoins += 4;
    petSpeech.text = tr('specialEggFossil');
  } else if(egg.kind==='ghost'){
    activeEffects.shield = Math.max(activeEffects.shield, 520);
    petSpeech.text = tr('specialEggGhost');
  } else if(egg.kind==='dragon'){
    activeEffects.fire = Math.max(activeEffects.fire, 700);
    petSpeech.text = tr('specialEggDragon');
  } else {
    petSpeech.text = petLine('egg');
  }
  if(egg.kind && egg.kind !== 'normal') discoveredEggs.add(egg.kind);
  score += bonus;
  addPetXP(byPet ? 2 : 1);
  if(byPet && petFriend >= 100) triggerPetFriendPower();
  updateUI();
  sfxEgg();
  spawnParticles(ex, ey, egg.kind==='red'?'#f87171':egg.kind==='blue'?'#60a5fa':egg.kind==='gold'?'#fde047':'#fde68a', 14);
  petSpeech.timer = 130;
}

function collectPowerup(item, ix, iy, byPet=false){
  if(item.collected || inventory.length >= 2) return;
  item.collected = true;
  inventory.push(item.type);
  addPetXP(byPet ? 2 : 1);
  pet.facing = ix > pet.x ? 1 : -1;
  petSpeech.text = petLine('egg');
  petSpeech.timer = 120;
  spawnParticles(ix, iy, item.type==='speed'?'#fb923c':item.type==='shield'?'#60a5fa':'#ef4444', 10);
  sfxEgg();
}

function hurt(){
  if(activeEffects.shield > 0) return;
  if(selectedChar==='caveman' && shopUpgrades.tough > 0 && Math.random() < shopUpgrades.tough * 0.16){
    player.invincible=80;
    petSpeech.text='Pet protegeu!';
    petSpeech.timer=120;
    spawnParticles(player.x+player.w/2,player.y-22,'#60a5fa',14);
    return;
  }
  player.hp--;
  player.invincible=70; flashTimer=22;
  spawnParticles(player.x+player.w/2,player.y-22,'#ff6b6b',16);
  if(player.hp<=0){
    player.hp=3;
    lives--;
    updateUI();
    if(lives<=0){ sfxDie(); showOverlay('gameover'); } else { sfxHurt(); showOverlay('dead'); }
  } else {
    sfxHurt();
    updateUI();
  }
}

function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}
function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,color,life:20+Math.random()*20,size:3+Math.random()*3.5});
  }
}

// ─── CUTSCENE ─────────────────────────────────────────────────────────────────
function finishCutscene(){
  localStorage.setItem('dinogame_intro_seen','1');
  beginPhase(); state='playing';
}
function skipCutscene(){ if(state==='cutscene') finishCutscene(); }

function drawCutscene(){
  const T = cutsceneTimer;

  // sky
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#5ba3d9'); sg.addColorStop(.6,'#b8ddf5'); sg.addColorStop(1,'#a8d8a8');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);

  // sun
  ctx.fillStyle='rgba(255,220,50,.14)'; ctx.beginPath(); ctx.arc(W*.82,52,50,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fde047'; ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(W*.82,52,24,0,Math.PI*2); ctx.fill(); ctx.stroke();

  // far mountains
  ctx.fillStyle='#4a8a4a';
  for(let i=-1;i<4;i++){
    const mx=i*280;
    ctx.beginPath(); ctx.moveTo(mx,GROUND);
    ctx.bezierCurveTo(mx+56,GROUND,mx+70,GROUND-100,mx+140,GROUND-100);
    ctx.bezierCurveTo(mx+210,GROUND-100,mx+224,GROUND,mx+280,GROUND);
    ctx.closePath(); ctx.fill();
  }

  // background trees
  [[80,.55],[180,.7],[320,.5],[470,.8],[580,.6],[690,.75]].forEach(([tx,s])=>{
    const th=80*s,tw=50*s;
    ctx.fillStyle='#5c3317';
    roundRect(ctx,tx-tw*.15,GROUND-th*.45,tw*.3,th*.45,4,true,false);
    ctx.fillStyle='#2d7a2d';
    ctx.beginPath(); ctx.arc(tx,GROUND-th*.72,tw*.52,0,Math.PI*2); ctx.fill();
  });

  // ground
  ctx.fillStyle='#7c4a1e'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#4a8f3f'; ctx.fillRect(0,GROUND-6,W,14);
  // grass tufts
  ctx.strokeStyle='#4a8f3f'; ctx.lineWidth=2.2; ctx.lineCap='round';
  for(let i=0;i<22;i++){
    const gx=i*38+4;
    ctx.beginPath(); ctx.moveTo(gx,GROUND-1); ctx.lineTo(gx-2,GROUND-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx+6,GROUND-1); ctx.lineTo(gx+6,GROUND-10); ctx.stroke();
  }

  // home (nest or cave) on far left
  drawCutsceneHome();

  // family waving
  const wave = Math.sin(T*.18)*14;
  // kid tries to follow (T 200-300) then gets held
  const kidStep = T>200&&T<300 ? Math.min((T-200)/40,1)*18 - (T>260?((T-260)/40)*18:0) : 0;
  drawCutsceneFamily(wave, kidStep);

  // player character: stands at x=230 until T=145, then walks right
  const walkP = Math.max(0, Math.min(1,(T-145)/230));
  const charX  = 230 + walkP*(W+80-230);
  const prevVx = player.vx;
  player.vx = walkP>0 ? MOVE_SPEED : 0;
  if(charX < W+90){
    if(selectedChar==='dino') drawDinoOn(ctx,charX,GROUND,0,false,1);
    else                      drawCavemanOn(ctx,charX,GROUND,0,false,1);
  }
  player.vx = prevVx;

  // speech bubble (T 55-135)
  if(T>55 && T<138){
    const a = T<75?(T-55)/20 : T>118?(138-T)/20 : 1;
    const lines = selectedChar==='dino' ? trArray('cutsceneDino') : trArray('cutsceneCaveman');
    drawCutsceneBubble(charX+18, GROUND-88, lines, a);
  }

  // footer text (T 400+)
  if(T>400){
    const a=Math.min(1,(T-400)/35);
    ctx.globalAlpha=a;
    ctx.fillStyle='#fff'; ctx.font='bold 13px "Press Start 2P"';
    ctx.textAlign='center';
    ctx.fillText(tr('cutsceneStart'),W/2,H/2+8);
    ctx.textAlign='left'; ctx.globalAlpha=1;
  }

  // fade in
  if(T<40){ ctx.fillStyle=`rgba(0,0,0,${1-T/40})`; ctx.fillRect(0,0,W,H); }
  // fade out
  if(T>455){ ctx.fillStyle=`rgba(0,0,0,${(T-455)/65})`; ctx.fillRect(0,0,W,H); }

  // skip hint
  if(T<450){
    ctx.fillStyle='rgba(255,255,255,.38)'; ctx.font='7px "Press Start 2P"';
    ctx.textAlign='right'; ctx.fillText(tr('cutsceneSkip'),W-14,H-12); ctx.textAlign='left';
  }
}

function drawCutsceneHome(){
  if(selectedChar==='dino'){
    // nest: woven mound + eggs
    ctx.fillStyle='#78350f'; ctx.strokeStyle='#3a1f0a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(52,GROUND-4,44,Math.PI,Math.PI*2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#92400e'; ctx.lineWidth=1.2;
    for(let i=0;i<5;i++){
      ctx.beginPath(); ctx.arc(52,GROUND+6,20+i*4,Math.PI+.1,Math.PI*2-.1); ctx.stroke();
    }
    ['#fef3c7','#fce7f3','#e0f2fe'].forEach((col,i)=>{
      ctx.fillStyle=col; ctx.strokeStyle='#b45309'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.ellipse(30+i*14,GROUND-7,7,9,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    });
  } else {
    // cave entrance
    ctx.fillStyle='#92400e'; ctx.strokeStyle='#3a1f0a'; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(8,GROUND); ctx.lineTo(8,GROUND-78);
    ctx.bezierCurveTo(8,GROUND-112,94,GROUND-112,94,GROUND-78);
    ctx.lineTo(94,GROUND); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#1c0f00';
    ctx.beginPath();
    ctx.moveTo(18,GROUND); ctx.lineTo(18,GROUND-70);
    ctx.bezierCurveTo(18,GROUND-100,84,GROUND-100,84,GROUND-70);
    ctx.lineTo(84,GROUND); ctx.closePath(); ctx.fill();
    // torch flicker
    const fa=.5+Math.sin(cutsceneTimer*.3)*.2;
    ctx.fillStyle=`rgba(255,155,30,${fa})`;
    ctx.beginPath(); ctx.arc(51+Math.sin(cutsceneTimer*.2)*2,GROUND-34,9,0,Math.PI*2); ctx.fill();
  }
}

function drawCutsceneFamily(wave, kidStep){
  if(selectedChar==='dino'){
    // mama (bigger, faces right = toward player leaving)
    drawFamDino(155,GROUND,1.12,'#6ee7b7',wave);
    // kid 1
    drawFamDino(92+kidStep,GROUND,.58,'#4ade80',wave*1.4);
    // kid 2
    drawFamDino(116,GROUND,.48,'#86efac',wave*.7);
  } else {
    drawFamCavewoman(148,GROUND,wave);
    drawFamKid(88+kidStep,GROUND,wave*1.3,'#fbbf24');
    drawFamKid(112,GROUND,wave*.6,'#f87171');
  }
}

function drawFamDino(x,y,sc,col,wave){
  const c=ctx;
  c.save(); c.translate(x+24*sc,y); c.scale(-sc,sc); c.translate(-(x+24*sc),-y);
  // tail
  c.strokeStyle='#15803d'; c.lineWidth=9*sc; c.lineCap='round';
  c.beginPath(); c.moveTo(x+8,y-26*sc); c.quadraticCurveTo(x-12,y-10*sc,x-14,y-1); c.stroke();
  c.strokeStyle=OL; c.lineWidth=1.8; c.stroke();
  // body
  c.fillStyle=col; c.strokeStyle=OL; c.lineWidth=2;
  c.beginPath(); c.ellipse(x+24,y-34*sc,19*sc,18*sc,0,0,Math.PI*2); c.fill(); c.stroke();
  // wave arm
  const ang=-0.4+wave/55;
  c.strokeStyle=col; c.lineWidth=6*sc; c.lineCap='round';
  c.beginPath(); c.moveTo(x+38,y-40*sc);
  c.lineTo(x+38+Math.cos(ang)*18*sc, y-40*sc+Math.sin(ang)*16*sc); c.stroke();
  c.strokeStyle=OL; c.lineWidth=1.5; c.stroke();
  // head
  c.fillStyle=col; c.strokeStyle=OL; c.lineWidth=2;
  c.beginPath(); c.arc(x+43,y-54*sc,11*sc,0,Math.PI*2); c.fill(); c.stroke();
  // eye
  c.fillStyle='#fff'; c.beginPath(); c.arc(x+41,y-58*sc,4*sc,0,Math.PI*2); c.fill();
  c.fillStyle='#1e3a8a'; c.beginPath(); c.arc(x+41,y-58*sc,2.2*sc,0,Math.PI*2); c.fill();
  // smile
  c.strokeStyle='#166534'; c.lineWidth=1.5;
  c.beginPath(); c.arc(x+45,y-50*sc,4*sc,.2,Math.PI-.2); c.stroke();
  c.restore();
}

function drawFamCavewoman(x,y,wave,sc=1){
  const c=ctx;
  c.save(); c.translate(x+24,y); c.scale(-1,1); c.translate(-(x+24),-y);

  // wave arm
  const ang=-0.5+wave/50;
  c.strokeStyle='#d97706'; c.lineWidth=7; c.lineCap='round';
  c.beginPath(); c.moveTo(x+33,y-36); c.lineTo(x+33+Math.cos(ang)*20,y-36+Math.sin(ang)*18); c.stroke();
  c.strokeStyle=OL; c.lineWidth=1.8; c.stroke();
  // head
  c.fillStyle='#fbbf24'; c.strokeStyle=OL; c.lineWidth=2;
  c.beginPath(); c.arc(x+24,y-47,13,0,Math.PI*2); c.fill(); c.stroke();
  // bun
  c.fillStyle='#292524'; c.strokeStyle=OL; c.lineWidth=1.5;
  c.beginPath(); c.arc(x+24,y-58,9,0,Math.PI*2); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(x+24,y-62,11,5,0,Math.PI,Math.PI*2); c.fill(); c.stroke();
  // eyes
  c.fillStyle='#fff';
  c.beginPath(); c.arc(x+18,y-48,4,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+30,y-48,4,0,Math.PI*2); c.fill();
  c.fillStyle='#1c1917';
  c.beginPath(); c.arc(x+19,y-48,2.5,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+31,y-48,2.5,0,Math.PI*2); c.fill();
  c.strokeStyle='#b45309'; c.lineWidth=1.5;
  c.beginPath(); c.arc(x+24,y-42,4,.2,Math.PI-.2); c.stroke();
  c.restore();
}

function drawCutsceneBubble(x,y,lines,alpha){
  const lh=14, pad=10, bw=118, bh=lines.length*lh+pad*2;
  ctx.globalAlpha=alpha;
  ctx.fillStyle='#fff'; ctx.strokeStyle=OL; ctx.lineWidth=2;
  roundRect(ctx,x-bw/2,y-bh,bw,bh,8,true,true);
  // tail
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(x-6,y); ctx.lineTo(x+6,y); ctx.lineTo(x,y+14); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=OL; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x-6,y); ctx.lineTo(x,y+14); ctx.moveTo(x+6,y); ctx.lineTo(x,y+14); ctx.stroke();
  // text
  ctx.fillStyle='#1e293b'; ctx.font='8px "Press Start 2P"'; ctx.textAlign='center';
  lines.forEach((l,i)=>ctx.fillText(l,x,y-bh+pad+9+i*lh));
  ctx.textAlign='left'; ctx.globalAlpha=1;
}

// ─── COLOR HELPERS ────────────────────────────────────────────────────────────
function lerpColor(c1, c2, t){
  const p = s => parseInt(s, 16);
  const r1=p(c1.slice(1,3)), g1=p(c1.slice(3,5)), b1=p(c1.slice(5,7));
  const r2=p(c2.slice(1,3)), g2=p(c2.slice(3,5)), b2=p(c2.slice(5,7));
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function draw(){
  if(state==='cutscene'){ drawCutscene(); return; }
  if(!currentTheme){ ctx.fillStyle='#060d18'; ctx.fillRect(0,0,W,H); return; }
  flashTimer=Math.max(0,flashTimer-1);
  const t=currentTheme;

  // sky — day/night lerp
  const nightSky0='#0a0a1a', nightSky1='#0d1b2a';
  const skyTop    = lerpColor(t.sky[0],    nightSky0, 1 - dayNight);
  const skyBot    = lerpColor(t.sky[1],    nightSky1, 1 - dayNight);
  const skyHoriz  = lerpColor(t.horizon,   nightSky1, 1 - dayNight);
  const skyG = ctx.createLinearGradient(0,0,0,H);
  skyG.addColorStop(0, skyTop); skyG.addColorStop(.6, skyBot); skyG.addColorStop(1, skyHoriz);
  ctx.fillStyle=skyG; ctx.fillRect(0,0,W,H);

  // flash
  if(flashTimer>0 && Math.floor(flashTimer/4)%2===0){
    ctx.fillStyle='rgba(255,40,40,.28)'; ctx.fillRect(0,0,W,H);
  }

  // stars — visible at night for all themes
  const starsAlpha = Math.max(t.stars ? 0.4 : 0, (1 - dayNight) * 0.9);
  if(starsAlpha > 0.02){
    // ensure stars array exists even for non-star themes
    if(stars.length === 0){
      for(let i=0;i<80;i++)
        stars.push({x:Math.random()*currentLen, y:Math.random()*(GROUND-80), s:Math.random()*1.8+0.4, b:Math.random()});
    }
    ctx.fillStyle='#fff';
    stars.forEach(s=>{
      const sx=(s.x-scrollX*.12)%(W+20);
      ctx.globalAlpha=starsAlpha*(0.4+Math.sin(frameCount*.04+s.b*6)*.4);
      ctx.beginPath(); ctx.arc(sx,s.y,s.s,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
  }

  // moon (night: dayNight < 0.3)
  if(dayNight < 0.3){
    const moonA = (0.3 - dayNight) / 0.3;
    ctx.globalAlpha = moonA;
    ctx.fillStyle='rgba(255,255,240,0.9)';
    ctx.beginPath(); ctx.arc(W-80, 60, 18, 0, Math.PI*2); ctx.fill();
    // crescent shadow
    ctx.fillStyle=lerpColor(nightSky0, nightSky1, 0.5);
    ctx.beginPath(); ctx.arc(W-72, 56, 15, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // sun (day: dayNight > 0.6)
  if(dayNight > 0.6){
    const sunA = (dayNight - 0.6) / 0.4;
    ctx.globalAlpha = sunA;
    ctx.fillStyle='#fde68a';
    ctx.beginPath(); ctx.arc(W-80, 60, 22, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // far mountains (parallax 0.1)
  drawMountains(scrollX*.1, t.mountainFar, 100, 180, 280);
  // near mountains (parallax 0.2)
  drawMountains(scrollX*.2, t.mountainNear, 70, 130, 220);

  // far trees (parallax 0.35)
  trees.filter(tr=>tr.layer==='far').forEach(tr=>{
    const tx=(tr.x-scrollX*.35);
    if(tx<-80||tx>W+80) return;
    drawTree(tx, GROUND, tr.h*.7, tr.w*.8, t, .55);
  });

  // clouds
  clouds.forEach(c=>{
    const cx=(c.x-scrollX*.28);
    drawCloud(cx, c.y, c.w, t);
  });

  // near trees (parallax 0.65)
  trees.filter(tr=>tr.layer==='near').forEach(tr=>{
    const tx=(tr.x-scrollX*.65);
    if(tx<-80||tx>W+80) return;
    drawTree(tx, GROUND, tr.h, tr.w, t, .85);
  });

  // ground layers
  drawGround(t);
  drawWeather();

  // plataformas
  phasePlatforms.forEach(plat=>{
    const px=plat.x-scrollX;
    if(px>W+200||px+plat.w<-100) return;
    drawPlatform(px, plat.y, plat.w, plat.type);
  });

  // eggs
  phaseEggs.forEach(egg=>{
    if(egg.collected) return;
    const ex=egg.x-scrollX;
    if(ex<-60||ex>W+60) return;
    drawEgg(ex, egg.y+Math.sin(egg.bob)*5, egg.r, egg.kind);
  });

  // obstacles
  phaseObstacles.forEach(obs=>{
    const ox=obs.x-scrollX;
    if(ox<-120||ox>W+120) return;
    drawObstacle(obs,ox);
  });

  // enemies
  phaseEnemies.forEach(enemy=>{
    if(!enemy.alive) return;
    const ex=enemy.x-scrollX;
    if(ex<-120||ex>W+120) return;
    drawEnemy(enemy,ex);
  });

  // coins
  drawCoins();

  // spike traps
  drawTraps();

  // power-up items
  drawPowerupItems();

  // hidden secrets
  drawSecrets();

  // checkpoint
  drawCheckpoint();

  // secret portal (before main portal)
  if(!isSecretPhase && secretUnlocked){
    const spx = secretPortalX - scrollX;
    if(spx>-100 && spx<W+100) drawSecretPortal(spx);
  }

  // portal
  const pxP=portalX-scrollX;
  if(pxP>-100&&pxP<W+100) drawPortal(pxP, phaseEggs.every(e=>e.collected));

  // pet (atrás do player)
  if(selectedChar==='dino') drawBabyDino(pet.x, pet.y, pet.frame, pet.facing, pet.bobPhase);
  else                      drawSaberTooth(pet.x, pet.y, pet.frame, pet.facing, pet.bobPhase);
  drawPetSpeech();
  drawPetHUD();

  // player
  if(player.invincible===0 || Math.floor(player.invincible/6)%2===0){
    if(player.invincible===0||Math.floor(player.invincible/6)%2===0){
      if(selectedChar==='dino') drawDinoOn(ctx,player.x,player.y,player.frame,player.ducking,1);
      else                      drawCavemanOn(ctx,player.x,player.y,player.frame,player.ducking,1);
    }
  }

  // fire breath (dino power)
  drawFireBreath();

  // particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/38;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // phase intro text
  if(frameCount<150){
    const alpha=Math.min(1,(150-frameCount)/50);
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(0,0,0,.5)';
    roundRect(ctx, W/2-160, H/2-38, 320, 64, 12, true, false);
    ctx.fillStyle='#fff'; ctx.font='bold 18px "Press Start 2P"';
    ctx.textAlign='center';
    const themeIdx = Math.max(0, THEMES.indexOf(currentTheme));
    ctx.fillText(trArray('placeNames')[themeIdx] || currentTheme.name, W/2, H/2-10);
    ctx.font='10px "Press Start 2P"';
    ctx.fillStyle='#4ecdc4';
    ctx.fillText(`${tr('phaseHud')} ${phase}`, W/2, H/2+16);
    ctx.textAlign='left'; ctx.globalAlpha=1;
  }

  if(state==='win') drawWinScene();
  drawHUD();
}

function drawHUD(){
  if(state==='menu'||state==='cutscene'||state==='win') return;
  const bh=34, pad=12;
  // background bar
  ctx.fillStyle='rgba(5,10,22,.72)';
  roundRect(ctx,8,8,W-16,bh,8,true,false);
  ctx.strokeStyle='rgba(78,205,196,.25)'; ctx.lineWidth=1;
  roundRect(ctx,8,8,W-16,bh,8,false,true);

  ctx.font='8px "Press Start 2P"';
  ctx.textBaseline='middle';
  const my=8+bh/2;

  // fase
  ctx.fillStyle='#4ecdc4';
  ctx.textAlign='left';
  ctx.fillText(`${tr('phaseHud')} ${phase}`,20,my);
  // player name
  if(playerName){ ctx.fillStyle='#94a3b8'; ctx.font='6px "Press Start 2P"'; ctx.fillText(playerName,20,my+16); ctx.font='8px "Press Start 2P"'; }

  // ovos
  const eggsCol=phaseEggs.filter(e=>e.collected).length;
  ctx.fillText(`🥚 ${eggsCol}/${phaseEggs.length}`,100,my);

  // moedas
  ctx.fillStyle='#fbbf24';
  ctx.fillText(`💰 ${totalCoins}`,196,my);

  // pontos
  ctx.fillStyle='#4ecdc4';
  ctx.fillText(`${tr('ptsHud')} ${score}`,270,my);

  ctx.fillStyle='#a7f3d0';
  ctx.fillText(`PET ${petLevel}`,520,my);
  ctx.fillStyle='rgba(255,255,255,.12)';
  roundRect(ctx,580,my-7,72,10,4,true,false);
  ctx.fillStyle=petFriend>=100?'#fde047':'#a7f3d0';
  roundRect(ctx,580,my-7,Math.max(4,72*(petFriend/100)),10,4,true,false);

  // timer (centro)
  if(state==='playing' && phaseFramesLeft>0){
    const secs=Math.max(0,Math.ceil(phaseFramesLeft/60));
    const mm=String(Math.floor(secs/60)).padStart(2,'0');
    const ss=String(secs%60).padStart(2,'0');
    const urgent=secs<=10 && Math.floor(frameCount/10)%2===0;
    ctx.fillStyle=urgent?'#fca5a5':'#4ecdc4';
    ctx.textAlign='center';
    ctx.fillText(`⏱ ${mm}:${ss}`,W/2,my);
  }

  // vidas (direita)
  ctx.textAlign='right';
  ctx.font='9px "Press Start 2P"';
  ctx.fillStyle='#ff6b6b';
  ctx.fillText(`♥x${lives}`, W-86, my);

  // HP dots
  ctx.font='7px "Press Start 2P"';
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<player.hp?'#ff9944':'#2a2a3a';
    ctx.fillText(i<player.hp?'●':'○', W-52+i*10, my+1);
  }

  // ── INVENTÁRIO (centro-baixo) ──────────────────────────────────────────────
  if(state==='playing'){
    const puColors = {speed:'#fb923c', shield:'#60a5fa', fire:'#ef4444'};
    const puIcons  = {speed:'⚡', shield:'🛡', fire:'🔥'};
    const effDurs  = {speed:480, shield:360, fire:600};
    const slotSize = 36, slotGap = 10;
    const totalW = slotSize*2 + slotGap + 24;
    const cx = W/2 - totalW/2;
    const cy = H - 50;

    // container
    ctx.fillStyle='rgba(5,10,22,0.78)';
    roundRect(ctx, cx-6, cy-4, totalW+12, slotSize+8, 10, true, false);
    ctx.strokeStyle='rgba(78,205,196,0.25)'; ctx.lineWidth=1;
    roundRect(ctx, cx-6, cy-4, totalW+12, slotSize+8, 10, false, true);

    // dois slots
    for(let i=0; i<2; i++){
      const sx = cx + i*(slotSize+slotGap);
      const hasItem = !!inventory[i];
      const col = hasItem ? puColors[inventory[i]] : 'rgba(255,255,255,0.06)';
      const border = hasItem ? puColors[inventory[i]] : 'rgba(78,205,196,0.3)';

      ctx.fillStyle=col; ctx.strokeStyle=border; ctx.lineWidth=1.8;
      roundRect(ctx, sx, cy, slotSize, slotSize, 7, true, true);

      // label da tecla [Q] / [E]
      ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='5px "Press Start 2P"';
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText(i===0?'[Q]':'[E]', sx+slotSize/2, cy+3);

      // ícone do item
      if(hasItem){
        ctx.font='17px serif'; ctx.textBaseline='middle';
        ctx.fillText(puIcons[inventory[i]], sx+slotSize/2, cy+slotSize/2+4);
      } else {
        ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.font='14px serif';
        ctx.textBaseline='middle';
        ctx.fillText('—', sx+slotSize/2, cy+slotSize/2+3);
      }
    }

    // efeitos ativos — barras abaixo do container
    let barY = cy + slotSize + 10;
    ['speed','shield','fire'].forEach(k=>{
      if(activeEffects[k] <= 0) return;
      const frac = activeEffects[k] / effDurs[k];
      const barW = totalW + 12;
      ctx.fillStyle='rgba(5,10,22,0.7)';
      roundRect(ctx, cx-6, barY, barW, 12, 4, true, false);
      ctx.fillStyle=puColors[k];
      roundRect(ctx, cx-6, barY, Math.max(6, barW*frac), 12, 4, true, false);
      ctx.fillStyle='#fff'; ctx.font='6px "Press Start 2P"';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(puIcons[k]+' '+Math.ceil(activeEffects[k]/60)+'s', cx-6+barW/2, barY+6);
      barY += 16;
    });
  }

  // Mobile D-pad is now HTML (not canvas-drawn). Visibility handled by updateMobileControls().

  ctx.textBaseline='alphabetic';
  ctx.textAlign='left';
  drawPlaceName();
}

function drawPlaceName(){
  if(!currentTheme) return;
  const themeIdx = Math.max(0, THEMES.indexOf(currentTheme));
  const name = trArray('placeNames')[themeIdx] || trArray('themeNames')[themeIdx] || currentTheme.name;
  const x = 16, y = H - 30;

  ctx.save();
  ctx.font='8px "Press Start 2P"';
  ctx.textAlign='left';

  roundRect(ctx,x,y-14,w,26,8,true,false);
  ctx.strokeStyle='rgba(255,255,255,.18)';

  roundRect(ctx,x,y-14,w,26,8,false,true);

  ctx.fillStyle='#fef3c7';
  ctx.fillText('📍',x+10,y+1);
