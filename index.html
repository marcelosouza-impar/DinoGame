// ─── COLOR HELPERS ────────────────────────────────────────────────────────────
function lerpColor(c1, c2, t){
  const p = s => parseInt(s, 16);
  const r1=p(c1.slice(1,3)), g1=p(c1.slice(3,5)), b1=p(c1.slice(5,7));
  const r2=p(c2.slice(1,3)), g2=p(c2.slice(3,5)), b2=p(c2.slice(5,7));
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function draw(){
  if(state==='cutscene'){ drawCutscene(); return; }
  if(!currentTheme){ ctx.fillStyle='#060d18'; ctx.fillRect(0,0,W,H); return; }
  flashTimer=Math.max(0,flashTimer-1);
  const t=currentTheme;

  // sky — day/night lerp
  const nightSky0='#0a0a1a', nightSky1='#0d1b2a';
  const neonLight = dayNight;
  const skyTop    = lerpColor(t.sky[0],    nightSky0, 1 - neonLight);
  const skyBot    = lerpColor(t.sky[1],    nightSky1, 1 - neonLight);
  const skyHoriz  = lerpColor(t.horizon,   nightSky1, 1 - neonLight);
  const skyG = ctx.createLinearGradient(0,0,0,H);
  skyG.addColorStop(0, skyTop); skyG.addColorStop(.6, skyBot); skyG.addColorStop(1, skyHoriz);
  ctx.fillStyle=skyG; ctx.fillRect(0,0,W,H);

  drawNeonAtmosphere(t);

  // flash
  if(flashTimer>0 && Math.floor(flashTimer/4)%2===0){
    ctx.fillStyle='rgba(255,40,40,.28)'; ctx.fillRect(0,0,W,H);
  }

  // stars — visible at night for all themes
  const starsAlpha = Math.max(t.stars ? 0.4 : 0, (1 - neonLight) * 0.9);
  if(starsAlpha > 0.02){
    // ensure stars array exists even for non-star themes
    if(stars.length === 0){
      for(let i=0;i<80;i++)
        stars.push({x:Math.random()*currentLen, y:Math.random()*(GROUND-80), s:Math.random()*1.8+0.4, b:Math.random()});
    }
    ctx.fillStyle='#fff';
    stars.forEach(s=>{
      const sx=(s.x-scrollX*.12)%(W+20);
      ctx.globalAlpha=starsAlpha*(0.4+Math.sin(frameCount*.04+s.b*6)*.4);
      ctx.beginPath(); ctx.arc(sx,s.y,s.s,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
  }

  // moon (night: dayNight < 0.3)
  if(dayNight < 0.3){
    const moonA = (0.3 - dayNight) / 0.3;
    ctx.globalAlpha = moonA;
    ctx.fillStyle='rgba(255,255,240,0.9)';
    ctx.beginPath(); ctx.arc(W-80, 60, 18, 0, Math.PI*2); ctx.fill();
    // crescent shadow
    ctx.fillStyle=lerpColor(nightSky0, nightSky1, 0.5);
    ctx.beginPath(); ctx.arc(W-72, 56, 15, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // sun (day: dayNight > 0.6)
  if(dayNight > 0.6){
    const sunA = (dayNight - 0.6) / 0.4;
    ctx.globalAlpha = sunA;
    ctx.fillStyle='#fde68a';
    ctx.beginPath(); ctx.arc(W-80, 60, 22, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // far mountains (parallax 0.1)
  drawMountains(scrollX*.1, t.mountainFar, 100, 180, 280);
  // near mountains (parallax 0.2)
  drawMountains(scrollX*.2, t.mountainNear, 70, 130, 220);
  drawDepthHaze(t);

  // far trees (parallax 0.35)
  trees.filter(tr=>tr.layer==='far').forEach(tr=>{
    const tx=(tr.x-scrollX*.35);
    if(tx<-80||tx>W+80) return;
    drawTree(tx, GROUND, tr.h*.7, tr.w*.8, t, .55);
  });

  // clouds
  clouds.forEach(c=>{
    const cx=(c.x-scrollX*.28);
    drawCloud(cx, c.y, c.w, t);
  });

  // near trees (parallax 0.65)
  trees.filter(tr=>tr.layer==='near').forEach(tr=>{
    const tx=(tr.x-scrollX*.65);
    if(tx<-80||tx>W+80) return;
    drawTree(tx, GROUND, tr.h, tr.w, t, .85);
  });

  // ground layers
  drawGround(t);
  drawWeather();

  // plataformas
  phasePlatforms.forEach(plat=>{
    const px=plat.x-scrollX;
    if(px>W+200||px+plat.w<-100) return;
    drawPlatform(px, plat.y, plat.w, plat.type);
  });

  // eggs
  phaseEggs.forEach(egg=>{
    if(egg.collected) return;
    const ex=egg.x-scrollX;
    if(ex<-60||ex>W+60) return;
    drawEgg(ex, egg.y+Math.sin(egg.bob)*5, egg.r, egg.kind);
  });

  // obstacles
  phaseObstacles.forEach(obs=>{
    const ox=obs.x-scrollX;
    if(ox<-120||ox>W+120) return;
    drawObstacle(obs,ox);
  });

  // enemies
  phaseEnemies.forEach(enemy=>{
    if(!enemy.alive) return;
    const ex=enemy.x-scrollX;
    if(ex<-120||ex>W+120) return;
    drawEnemy(enemy,ex);
  });

  // alavanca
  if(phaseLever){
    const lx=phaseLever.x-scrollX;
    if(lx>-80&&lx<W+80) drawLever(lx, phaseLever.y, phaseLever.activated);
  }

  // pedra rolando
  if(boulderRoll && boulderRoll.active){
    const brx=boulderRoll.x-scrollX;
    if(brx>-120&&brx<W+120) drawBoulder(brx, boulderRoll.y, boulderRoll.r, boulderRoll.angle);
  }

  // boss
  if(phaseBoss && phaseBoss.alive){
    const bx=phaseBoss.x-scrollX, by=phaseBoss.y-phaseBoss.h;
    // flash branco ao tomar dano
    ctx.save();
    if(phaseBoss.hitFlash>0){ ctx.globalAlpha=phaseBoss.hitFlash/18*0.6; ctx.fillStyle='#fff'; ctx.fillRect(bx,by,phaseBoss.w,phaseBoss.h); }
    ctx.restore();
    // corpo grande — trex gigante vermelho
    ctx.save();
    ctx.translate(bx+phaseBoss.w/2, phaseBoss.y);
    ctx.scale(1.7,1.7);
    drawDinoOn(ctx, -27, 0, phaseBoss.frame, false, 1);
    ctx.restore();
    // tint vermelho
    ctx.save(); ctx.globalAlpha=0.35; ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle='#ef4444'; ctx.fillRect(bx,by,phaseBoss.w,phaseBoss.h);
    ctx.restore();
    // HP bar do boss (topo da tela)
    const bpct=phaseBoss.hp/phaseBoss.maxHp;
    ctx.fillStyle='rgba(5,10,22,.85)'; roundRect(ctx,W/2-100,6,200,14,5,true,false);
    ctx.fillStyle='#ef4444'; roundRect(ctx,W/2-98,8,Math.round(196*bpct),10,4,true,false);
    ctx.fillStyle='#fbbf24'; ctx.font='5px "Press Start 2P"'; ctx.textAlign='center';
    ctx.fillText(`💀 CHEFE  ${phaseBoss.hp}/${phaseBoss.maxHp}`,W/2,20);
  }

  // coins
  drawCoins();

  // spike traps
  drawTraps();

  // power-up items
  drawPowerupItems();

  // hidden secrets
  drawSecrets();

  // checkpoint
  drawCheckpoint();

  // secret portal (before main portal)

  // portal
  const pxP=portalX-scrollX;
  if(pxP>-100&&pxP<W+100) drawPortal(pxP, phaseEggs.every(e=>e.collected));

  // pet (atrás do player)
  drawGroundShadow(pet.x+15, pet.y+2, 19, .26);
  drawGroundShadow(player.x+player.w/2, GROUND+2, 26, .34);
  if(selectedChar==='dino') drawBabyDino(pet.x, pet.y, pet.frame, pet.facing, pet.bobPhase);
  else                      drawSaberTooth(pet.x, pet.y, pet.frame, pet.facing, pet.bobPhase);
  drawPetHUD();

  // player
  if(player.invincible===0 || Math.floor(player.invincible/6)%2===0){
    if(player.invincible===0||Math.floor(player.invincible/6)%2===0){
      if(selectedChar==='dino') drawDinoOn(ctx,player.x,player.y,player.frame,player.ducking,1,{vx:player.vx,vy:player.vy,onGround:player.onGround,idleMs:state==='playing'?performance.now()-lastInputAt:0});
      else                      drawCavemanOn(ctx,player.x,player.y,player.frame,player.ducking,1);
    }
  }
  drawPetSpeech();
  // nome do jogador acima do boneco
  if(playerName){
    ctx.save();
    hudFont(900,12); ctx.textAlign='center'; ctx.textBaseline='middle';
    const nw=ctx.measureText(playerName).width+16;
    ctx.fillStyle='#FFFFFF'; ctx.strokeStyle='#2B2A4C'; ctx.lineWidth=2;
    roundRect(ctx, player.x+24-nw/2, player.y-96, nw, 20, 10, true, true);
    ctx.fillStyle='#2B2A4C'; ctx.fillText(playerName, player.x+24, player.y-85);
    ctx.restore();
  }

  // fire breath (dino power)
  drawFireBreath();

  // particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/38;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // phase intro text
  if(frameCount<150){
    const alpha=Math.min(1,(150-frameCount)/50);
    ctx.globalAlpha=alpha;
    ctx.fillStyle='#2B2A4C'; roundRect(ctx, W/2-170, H/2-44+5, 340, 84, 22, true, false);
    ctx.fillStyle='#FFF8E7'; ctx.strokeStyle='#2B2A4C'; ctx.lineWidth=3;
    roundRect(ctx, W/2-170, H/2-44, 340, 84, 22, true, true);
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#2B2A4C';
    const themeIdx = Math.max(0, THEMES.indexOf(currentTheme));
    hudFont(700,30,'d');
    ctx.fillText(trArray('placeNames')[themeIdx] || currentTheme.name, W/2, H/2-12);
    hudFont(900,14); ctx.fillStyle='#4A4968';
    ctx.fillText(`${tr('phaseHud')} ${phase}`, W/2, H/2+20);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.globalAlpha=1;
  }

  if(state==='win') drawWinScene();
  drawHUD();

  // float texts (combo, bônus)
  floatTexts.forEach(ft=>{
    ctx.globalAlpha=Math.min(1,ft.life/20);
    ctx.font='7px "Press Start 2P"';
    ctx.textAlign='center'; ctx.fillStyle=ft.color;
    const sx=ft.x-scrollX;
    ctx.fillText(ft.text, sx, ft.y);
  });
  floatTexts.forEach(ft=>{ft.y+=ft.vy;ft.life--;});
  floatTexts=floatTexts.filter(ft=>ft.life>0);
  ctx.globalAlpha=1; ctx.textAlign='left';

  // achievement notification
  if(achieveNotifQueue.length>0 && achieveNotifTimer>0){
    const a=achieveNotifQueue[0];
    const alpha=achieveNotifTimer<30?achieveNotifTimer/30:achieveNotifTimer>150?1:(achieveNotifTimer-150)/30;
    const ny=50+Math.min(0,(180-achieveNotifTimer)*2);
    ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,alpha));
    ctx.fillStyle='rgba(5,10,22,.92)'; roundRect(ctx,W-200,ny,192,34,8,true,false);
    ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.5; roundRect(ctx,W-200,ny,192,34,8,false,true);
    ctx.font='10px serif'; ctx.textAlign='left'; ctx.fillStyle='#ffe66d';
    ctx.fillText(a.icon,W-194,ny+22);
    ctx.font='5px "Press Start 2P"'; ctx.fillStyle='#ffe66d';
    ctx.fillText('Conquista!',W-178,ny+12);
    ctx.font='4.5px "Press Start 2P"'; ctx.fillStyle='#e2e8f0';
    ctx.fillText(a.name,W-178,ny+24);
    ctx.restore();
    if(achieveNotifTimer===1){ achieveNotifQueue.shift(); if(achieveNotifQueue.length>0) achieveNotifTimer=180; }
  }
}

function drawNeonAtmosphere(t){
  ctx.save();
  // Brilho de sol e partículas suaves, como um mundo 3D de brinquedo.
  const glow=ctx.createLinearGradient(0,GROUND-150,0,GROUND+5);
  glow.addColorStop(0,'rgba(0,0,0,0)');
  glow.addColorStop(1,'rgba(255,246,185,.23)');
  ctx.fillStyle=glow; ctx.fillRect(0,GROUND-150,W,155);
  for(let i=0;i<16;i++){
    const px=((i*137+31-scrollX*.12)%(W+20)+W+20)%(W+20)-10;
    const py=78+(i*53%(GROUND-130));
    ctx.globalAlpha=.16+.14*Math.sin(frameCount*.035+i);
    ctx.fillStyle='#fff8ca'; ctx.beginPath(); ctx.arc(px,py,1.5+(i%3),0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawDepthHaze(t){
  // Faixas transparentes entre os planos criam distância entre montanhas e cenário.
  const haze=ctx.createLinearGradient(0,GROUND-165,0,GROUND);
  haze.addColorStop(0,'rgba(0,0,0,0)');
  haze.addColorStop(1,'rgba(82,240,255,.12)');
  ctx.fillStyle=haze; ctx.fillRect(0,GROUND-165,W,165);
}

function drawGroundShadow(x,y,width,alpha){
  ctx.save();
  const shadow=ctx.createRadialGradient(x,y,2,x,y,width);
  shadow.addColorStop(0,`rgba(0,0,10,${alpha})`);
  shadow.addColorStop(1,'rgba(0,0,10,0)');
  ctx.fillStyle=shadow;
  ctx.beginPath(); ctx.ellipse(x,y,width,width*.22,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

const HUD_INK='#2B2A4C';
const HUD_ICON={
  music:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  musicOff:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2A4C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M3 3l18 18" stroke="#FF6B6B"/></svg>',
  pause:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#2B2A4C"><rect x="5" y="4" width="5" height="16" rx="2"/><rect x="14" y="4" width="5" height="16" rx="2"/></svg>',
  play:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#2B2A4C"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>'
};
const HUD_P = {
  heart:new Path2D('M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z'),
  speed:new Path2D('M13 2L4 14h7l-1 8 9-12h-7z'),
  shield:new Path2D('M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'),
  fire:new Path2D('M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-3-1-5 0-8z')
};
function hudFont(weight,size,fam){
  ctx.font = `${weight} ${size}px ${fam==='d'?'Fredoka':'Nunito'}, system-ui, sans-serif`;
}
function hudPill(x,y,w,h,fill='#FFFFFF'){
  ctx.fillStyle=HUD_INK; roundRect(ctx,x,y+3,w,h,h/2,true,false);
  ctx.fillStyle=fill; ctx.strokeStyle=HUD_INK; ctx.lineWidth=2.5;
  roundRect(ctx,x,y,w,h,h/2,true,true);
}
function hudIcon(path,x,y,size,fill){
  ctx.save(); ctx.translate(x,y); ctx.scale(size/24,size/24);
  ctx.fillStyle=fill; ctx.fill(path);
  ctx.strokeStyle=HUD_INK; ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.stroke(path);
  ctx.restore();
}
function drawCoin(cx,cy,r){
  ctx.fillStyle='#FFD23F'; ctx.strokeStyle=HUD_INK; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=HUD_INK; hudFont(700,r*1.2,'d'); ctx.textAlign='center'; ctx.fillText('$',cx,cy+1);
}

function drawHUD(){
  if(state==='menu'||state==='cutscene'||state==='win') return;
  ctx.save();
  ctx.textBaseline='middle';
  const Y=10, PH=34, my=Y+PH/2;
  let x=12, w;

  // corações (HP) + vidas
  const livesTxt='×'+lives;
  hudFont(900,15);
  w=10+3*24+6+ctx.measureText(livesTxt).width+12;
  hudPill(x,Y,w,PH);
  for(let i=0;i<3;i++) hudIcon(HUD_P.heart,x+8+i*24,Y+5,24,i<player.hp?'#FF6B6B':'#E4E2EE');
  ctx.fillStyle=HUD_INK; ctx.textAlign='left'; ctx.fillText(livesTxt,x+10+72+4,my+1);
  x+=w+8;

  // moedas
  hudFont(900,16);
  const coinTxt=String(totalCoins);
  w=6+26+8+ctx.measureText(coinTxt).width+12;
  hudPill(x,Y,w,PH);
  drawCoin(x+6+13,my,12);
  hudFont(900,16); ctx.textAlign='left'; ctx.fillStyle=HUD_INK; ctx.fillText(coinTxt,x+6+26+8,my+1);
  x+=w+8;

  // ovos
  const eggsCol=phaseEggs.filter(e=>e.collected).length;
  const eggTxt=`${eggsCol}/${phaseEggs.length}`;
  w=8+18+8+ctx.measureText(eggTxt).width+12;
  hudPill(x,Y,w,PH);
  ctx.fillStyle='#FFF8E7'; ctx.strokeStyle=HUD_INK; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(x+8+9,my,8,10.5,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=HUD_INK; ctx.fillText(eggTxt,x+8+18+8,my+1);

  // nível do pet (segunda linha)
  hudFont(900,13);
  const petTxt=`Pet ${petLevel}`;
  const pw=12+ctx.measureText(petTxt).width+8+48+12;
  hudPill(12,Y+PH+10,pw,26);
  ctx.fillStyle=HUD_INK; ctx.textAlign='left'; ctx.fillText(petTxt,24,Y+PH+10+14);
  const pbx=24+ctx.measureText(petTxt).width+8, pby=Y+PH+10+8;
  ctx.fillStyle='#E4E2EE'; roundRect(ctx,pbx,pby,48,10,5,true,false);
  ctx.fillStyle=petFriend>=100?'#FFD23F':'#7ED957';
  roundRect(ctx,pbx,pby,Math.max(6,48*Math.min(1,petFriend/100)),10,5,true,false);
  ctx.strokeStyle=HUD_INK; ctx.lineWidth=1.8; roundRect(ctx,pbx,pby,48,10,5,false,true);

  // progresso da fase + bandeira
  const prog = portalX>0 ? Math.min(1,Math.max(0,(scrollX+player.x)/portalX)) : 0;
  const bw=150, bx=W/2-bw/2-8, bh=16, by=Y+9;
  ctx.fillStyle='#FFFFFF'; roundRect(ctx,bx,by,bw,bh,8,true,false);
  if(prog>0){
    ctx.save(); roundRect(ctx,bx,by,bw,bh,8,false,false); ctx.clip();
    ctx.fillStyle='#7ED957'; ctx.fillRect(bx,by,bw*prog,bh);
    ctx.strokeStyle=HUD_INK; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(bx+bw*prog,by); ctx.lineTo(bx+bw*prog,by+bh); ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle=HUD_INK; ctx.lineWidth=2.5; roundRect(ctx,bx,by,bw,bh,8,false,true);
  const fx=bx+bw+10;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(fx,by+bh+4); ctx.lineTo(fx,by-6); ctx.stroke();
  ctx.fillStyle='#FF6B6B'; ctx.beginPath(); ctx.moveTo(fx,by-6); ctx.lineTo(fx+14,by-6); ctx.lineTo(fx+10,by-1); ctx.lineTo(fx+14,by+4); ctx.lineTo(fx,by+4); ctx.closePath(); ctx.fill(); ctx.stroke();

  // tempo
  if(state==='playing' && phaseFramesLeft>0){
    const secs=Math.max(0,Math.ceil(phaseFramesLeft/60));
    const tt=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
    const urgent=secs<=10;
    const blinkOn=urgent && Math.floor(frameCount/10)%2===0;
    hudFont(900,14);
    const tw=ctx.measureText(tt).width+26;
    hudPill(W/2-8-tw/2,by+bh+10,tw,24,blinkOn?'#FF6B6B':urgent?'#FFE4E4':'#FFFFFF');
    ctx.fillStyle=HUD_INK; ctx.textAlign='center'; ctx.fillText(tt,W/2-8,by+bh+10+13);
  }

  // pontos (à esquerda dos botões HTML)
  const ptsTxt=`${score} ${tr('ptsHud')}`;
  hudFont(900,15);
  const sw=ctx.measureText(ptsTxt).width+28;
  const sx=632-sw;
  hudPill(sx,Y,sw,PH, scorePopTimer>0?'#FFD23F':'#FFFFFF');
  ctx.save();
  ctx.translate(sx+sw/2,my+1);
  if(scorePopTimer>0){ const k=1+0.3*(scorePopTimer/22); ctx.scale(k,k); }
  ctx.fillStyle=HUD_INK; ctx.textAlign='center'; ctx.fillText(ptsTxt,0,0);
  ctx.restore();

  // inventário (centro-baixo)
  if(state==='playing'){
    const puColors={speed:'#FF9F6B', shield:'#5BC0FF', fire:'#FF6B6B'};
    const effDurs={speed:480, shield:360, fire:600};
    const slot=42, gap=12, totalW=slot*2+gap;
    const cx=W/2-totalW/2, cy=H-slot-14;
    for(let i=0;i<2;i++){
      const sx2=cx+i*(slot+gap), item=inventory[i];
      ctx.fillStyle=HUD_INK; roundRect(ctx,sx2,cy+3,slot,slot,12,true,false);
      ctx.fillStyle=item?'#FFFFFF':'#EDEBF5'; ctx.strokeStyle=HUD_INK; ctx.lineWidth=2.5;
      roundRect(ctx,sx2,cy,slot,slot,12,true,true);
      if(item) hudIcon(HUD_P[item],sx2+slot/2-12,cy+slot/2-12,24,puColors[item]);
      // tecla
      ctx.fillStyle='#FFFFFF'; ctx.strokeStyle=HUD_INK; ctx.lineWidth=2;
      roundRect(ctx,sx2-6,cy-8,20,20,6,true,true);
      hudFont(700,12,'d'); ctx.fillStyle=HUD_INK; ctx.textAlign='center';
      ctx.fillText(i===0?'Q':'E',sx2+4,cy+2);
    }
    // efeitos ativos (acima dos espaços)
    let barY=cy-30;
    ['speed','shield','fire'].forEach(k=>{
      if(activeEffects[k]<=0) return;
      const frac=activeEffects[k]/effDurs[k], bw2=totalW+40, bx2=W/2-bw2/2;
      ctx.fillStyle='#FFFFFF'; roundRect(ctx,bx2,barY,bw2,18,9,true,false);
      ctx.fillStyle=puColors[k]; roundRect(ctx,bx2,barY,Math.max(10,bw2*frac),18,9,true,false);
      ctx.strokeStyle=HUD_INK; ctx.lineWidth=2; roundRect(ctx,bx2,barY,bw2,18,9,false,true);
      hudIcon(HUD_P[k],bx2+4,barY+1,16,'#FFFFFF');
      hudFont(900,12); ctx.fillStyle=HUD_INK; ctx.textAlign='center';
      ctx.fillText(Math.ceil(activeEffects[k]/60)+'s',bx2+bw2/2+8,barY+10);
      barY-=24;
    });
  }
  ctx.restore();
  ctx.textBaseline='alphabetic';
  ctx.textAlign='left';
  drawPlaceName();
}

function drawPlaceName(){
  if(!currentTheme) return;
  const themeIdx = Math.max(0, THEMES.indexOf(currentTheme));
  const name = trArray('placeNames')[themeIdx] || trArray('themeNames')[themeIdx] || currentTheme.name;
  const txt = `${tr('phaseHud')} ${phase} · ${name}`;
  ctx.save();
  hudFont(900,13);
  ctx.textAlign='left'; ctx.textBaseline='middle';
  const w = ctx.measureText(txt).width+28, h=28;
  const mobile = document.getElementById('mobileControls')?.classList.contains('active');
  const x = mobile ? 130 : 12, y = mobile ? 54 : H-h-14;
  hudPill(x,y,w,h);
  ctx.fillStyle=HUD_INK; ctx.fillText(txt,x+14,y+h/2+1);
  ctx.restore();
}

// ─── SCENE HELPERS ────────────────────────────────────────────────────────────
function roundRect(c,x,y,w,h,r,fill,stroke){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y);
  c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
  if(fill) c.fill();
  if(stroke) c.stroke();
}

function drawCloud(x,y,w,theme){
  ctx.save(); ctx.globalAlpha=.80;
  const g=ctx.createLinearGradient(x,y-22,x,y+28);
  g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#d7eef8'); ctx.fillStyle=g;
  [[.5,0,.45,18],[.28,10,.28,15],[.72,8,.26,14],[.5,14,.42,14]].forEach(([a,b,c,d])=>{
    ctx.beginPath(); ctx.ellipse(x+w*a,y+b,w*c,d,0,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=.28; ctx.fillStyle='#6db5d2';
  ctx.beginPath(); ctx.ellipse(x+w*.5,y+24,w*.34,5,0,0,Math.PI*2); ctx.fill(); ctx.restore();
}

function drawMountains(offset,color,heightA,heightB,spacing){
  ctx.fillStyle=color;
  const mo = offset%spacing;
  for(let i=-1;i<Math.ceil(W/spacing)+2;i++){
    const mx=i*spacing-mo;
    ctx.beginPath();
    ctx.moveTo(mx,GROUND); ctx.lineTo(mx+spacing*.18,GROUND-heightA*.35);
    ctx.lineTo(mx+spacing*.36,GROUND-heightA*.72); ctx.lineTo(mx+spacing*.5,GROUND-heightA);
    ctx.lineTo(mx+spacing*.7,GROUND-heightA*.48); ctx.lineTo(mx+spacing,GROUND);
    ctx.closePath(); ctx.fill();
    // uma face iluminada por montanha dá volume sem quebrar o pixel art
    ctx.fillStyle='rgba(170,245,255,.10)';
    ctx.beginPath(); ctx.moveTo(mx+spacing*.5,GROUND-heightA);
    ctx.lineTo(mx+spacing*.7,GROUND-heightA*.48); ctx.lineTo(mx+spacing,GROUND);
    ctx.lineTo(mx+spacing*.66,GROUND); ctx.closePath(); ctx.fill();
    ctx.fillStyle=color;

    const ox=mx+spacing*.55;
    ctx.beginPath();
    ctx.moveTo(ox,GROUND); ctx.lineTo(ox+spacing*.15,GROUND-heightB*.4);
    ctx.lineTo(ox+spacing*.3,GROUND-heightB); ctx.lineTo(ox+spacing*.48,GROUND-heightB*.5);
    ctx.lineTo(ox+spacing*.65,GROUND);
    ctx.closePath(); ctx.fill();
  }
}

function drawTree(x,y,h,w,theme,opacity){
  ctx.globalAlpha=opacity;
  ctx.fillStyle=theme.treeTrunk;
  const tw=Math.max(6,Math.round(w*.3)), tx=Math.round(x-tw/2);
  const trunk=ctx.createLinearGradient(tx,0,tx+tw,0);
  trunk.addColorStop(0,'rgba(45,25,15,.28)'); trunk.addColorStop(.45,theme.treeTrunk); trunk.addColorStop(1,'#d69b54');
  ctx.fillStyle=trunk; roundRect(ctx,tx,y-h*.45,tw,h*.45,tw/2,true,false);
  const leaf=ctx.createRadialGradient(x-w*.16,y-h*.75,2,x,y-h*.62,w*.62);
  leaf.addColorStop(0,'#d8ff9b'); leaf.addColorStop(.42,theme.treeLeaf); leaf.addColorStop(1,'#2c773e');
  ctx.fillStyle=leaf;
  [[x,y-h*.72,w*.55],[x-w*.3,y-h*.55,w*.38],[x+w*.28,y-h*.52,w*.36]].forEach(([cx,cy,cr])=>{
    ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawWeather(){
  if(!weatherParticles.length) return;
  ctx.save();
  weatherParticles.forEach(w=>{
    const a = Math.min(1, w.life/40);
    if(w.type==='rain'){
      ctx.strokeStyle=`rgba(180,210,255,${a*0.55})`; ctx.lineWidth=1.2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(w.x,w.y); ctx.lineTo(w.x+w.vx*3,w.y-8); ctx.stroke();
    } else if(w.type==='ash'){
      ctx.fillStyle=`rgba(160,80,20,${a*0.5})`;
      ctx.beginPath(); ctx.arc(w.x,w.y,2+Math.random(),0,Math.PI*2); ctx.fill();
    } else if(w.type==='snow'){
      ctx.fillStyle=`rgba(220,240,255,${a*0.75})`;
      ctx.beginPath(); ctx.arc(w.x,w.y,2.5,0,Math.PI*2); ctx.fill();
    } else if(w.type==='spore'){
      ctx.fillStyle=`rgba(0,230,160,${a*0.6})`;
      ctx.beginPath(); ctx.arc(w.x,w.y,1.8,0,Math.PI*2); ctx.fill();
    }
  });
  ctx.restore();
}

function drawPetSpeech(){
  if(!petSpeech.timer || !petSpeech.text) return;
  const alpha = Math.min(1, petSpeech.timer/20);
  const bx = pet.x - 10;
  const by = pet.y - 70;
  ctx.save();
  hudFont(800,12);
  const tw = ctx.measureText(petSpeech.text).width + 20;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#FFFFFF';
  roundRect(ctx, bx, by, tw, 22, 6, true, false);
  ctx.strokeStyle = '#2B2A4C'; ctx.lineWidth = 1.5;
  roundRect(ctx, bx, by, tw, 22, 6, false, true);
  // tail
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.moveTo(bx+14, by+22);
  ctx.lineTo(bx+10, by+30);
  ctx.lineTo(bx+22, by+22);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2B2A4C'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(bx+14, by+22); ctx.lineTo(bx+10, by+30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx+22, by+22); ctx.lineTo(bx+10, by+30); ctx.stroke();
  // text
  ctx.fillStyle = '#2B2A4C';
  hudFont(800,12);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(petSpeech.text, bx+9, by+11);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function drawGround(t){
  // Solo com iluminação e camadas, para parecer um diorama 3D em vez de uma grade neon.
  const floor=ctx.createLinearGradient(0,GROUND,0,H);
  floor.addColorStop(0,t.groundTop);
  floor.addColorStop(.12,t.groundMid);
  floor.addColorStop(1,t.ground);
  ctx.fillStyle=floor;
  ctx.fillRect(0,GROUND,W,H-GROUND);

  ctx.fillStyle=t.groundMid;
  ctx.fillRect(0,GROUND,W,5);

  // Sulcos discretos convergem para o horizonte e sugerem volume no terreno.
  ctx.save();
  ctx.strokeStyle='rgba(65,98,39,.22)'; ctx.globalAlpha=.45; ctx.lineWidth=1;
  const vanishX=W*.52, horizon=GROUND+2;
  for(let x=-240;x<=W+240;x+=92){
    ctx.beginPath(); ctx.moveTo(vanishX,horizon); ctx.lineTo(x,H); ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle=t.groundTop;
  const humpOff=(scrollX*.8)%24;
  for(let x=-24-humpOff;x<W+24;x+=24){
    ctx.fillRect(Math.round(x),GROUND,16,8);
    ctx.fillRect(Math.round(x+4),GROUND-4,8,4);
  }

  ctx.strokeStyle=t.groundTop;
  ctx.lineWidth=2.5;
  for(let i=0;i<18;i++){
    const gx=((i*113+37)-scrollX*.95)%W;
    const gy=GROUND-1;
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx-3,gy-7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx+4,gy); ctx.lineTo(gx+4,gy-9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx+8,gy); ctx.lineTo(gx+11,gy-6); ctx.stroke();
  }

  ctx.fillStyle='rgba(0,0,0,.18)';
  for(let i=0;i<14;i++){
    const px=((i*173+91)-scrollX*.9)%W;
    ctx.beginPath(); ctx.ellipse(px,GROUND+22,8,5,0,0,Math.PI*2); ctx.fill();
  }

  ctx.fillStyle='rgba(54,88,37,.16)';
  for(let i=0;i<18;i++){
    const x=((i*61-scrollX*.9)%W+W)%W;
    ctx.fillRect(Math.round(x),GROUND+34+(i%3)*9,12+(i%4)*5,4);
  }
}

// ─── FLAT DESIGN HELPERS ──────────────────────────────────────────────────────
const OL='#1a1a2e'; // outline color
function flat(c,fill,outline=OL,lw=2.5){ c.fillStyle=fill; c.strokeStyle=outline; c.lineWidth=lw; }
function circle(c,x,y,r,fill,outline=OL,lw=2.5){
  flat(c,fill,outline,lw);
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.stroke();
}
function block(c,x,y,w,h,r,fill,outline=OL,lw=2.5){
  flat(c,fill,outline,lw);
  roundRect(c,x,y,w,h,r,true,false);
  c.strokeStyle=outline; c.lineWidth=lw;
  roundRect(c,x,y,w,h,r,false,true);
}

function drawPlatform(x, y, w, type){
  const h=20;
  // sombra
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(x+w/2,y+7,w*.42,5,0,0,Math.PI*2); ctx.fill();

  // face inferior inclinada: cada plataforma vira um pequeno bloco 3D.
  const side=type==='stone'?'#536a79':type==='wood'?'#8a4b19':'#6e4829';
  ctx.fillStyle=side;
  ctx.beginPath();
  ctx.moveTo(x,y-h+7); ctx.lineTo(x+w,y-h+7); ctx.lineTo(x+w-7,y+8); ctx.lineTo(x+7,y+8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.16)';
  ctx.beginPath(); ctx.moveTo(x,y-h+7); ctx.lineTo(x+7,y-h+12); ctx.lineTo(x+7,y+8); ctx.lineTo(x,y-h+3); ctx.closePath(); ctx.fill();

  if(type==='stone'){
    block(ctx,x,y-h,w,h,6,'#94a3b8','#334155',2.5);
    // divisórias dos blocos
    ctx.strokeStyle='#64748b'; ctx.lineWidth=2;
    for(let i=40;i<w;i+=40){ ctx.beginPath(); ctx.moveTo(x+i,y-h+3); ctx.lineTo(x+i,y-3); ctx.stroke(); }
    // topo claro
    ctx.fillStyle='rgba(255,255,255,0.25)';
    roundRect(ctx,x+4,y-h+3,w-8,5,2,true,false);
  } else if(type==='wood'){
    block(ctx,x,y-h,w,h,6,'#d97706','#78350f',2.5);
    ctx.strokeStyle='#92400e'; ctx.lineWidth=1.5;
    for(let i=40;i<w;i+=40){ ctx.beginPath(); ctx.moveTo(x+i,y-h+3); ctx.lineTo(x+i,y-3); ctx.stroke(); }
    ctx.fillStyle='rgba(255,255,255,0.2)';
    roundRect(ctx,x+4,y-h+3,w-8,4,2,true,false);
  } else {
    block(ctx,x,y-h+7,w,h-7,5,'#92400e','#1a1a2e',2.5);
    block(ctx,x,y-h,w,10,5,currentTheme.groundTop,'#1a1a2e',2.5);
    ctx.strokeStyle=currentTheme.groundTop; ctx.lineWidth=2.5; ctx.lineCap='round';
    for(let i=0;i<Math.floor(w/16);i++){
      const gx=x+8+i*16;
      ctx.beginPath(); ctx.moveTo(gx,y-h); ctx.lineTo(gx-2,y-h-6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx+5,y-h); ctx.lineTo(gx+5,y-h-8); ctx.stroke();
    }
  }
}

function drawEgg(x,y,r,kind='normal'){
  const configs = {
    normal: {top:'#fef3c7',mid:'#fbbf24',bot:'#b45309',band:'#f59e0b',glow:'rgba(251,191,36,0.35)'},
    gold:   {top:'#fef9c3',mid:'#facc15',bot:'#a16207',band:'#fde68a',glow:'rgba(250,204,21,0.45)'},
    blue:   {top:'#eff6ff',mid:'#60a5fa',bot:'#1d4ed8',band:'#93c5fd',glow:'rgba(96,165,250,0.4)'},
    red:    {top:'#fff1f2',mid:'#f87171',bot:'#b91c1c',band:'#fca5a5',glow:'rgba(248,113,113,0.4)'},
    rainbow:{top:'#fdf4ff',mid:'#e879f9',bot:'#7e22ce',band:'#f0abfc',glow:'rgba(232,121,249,0.4)'},
    fossil: {top:'#fafaf9',mid:'#a8a29e',bot:'#44403c',band:'#78716c',glow:'rgba(120,113,108,0.3)'},
    ghost:  {top:'#f5f3ff',mid:'#a5b4fc',bot:'#4338ca',band:'#c4b5fd',glow:'rgba(165,180,252,0.4)'},
    dragon: {top:'#fff7ed',mid:'#fb923c',bot:'#c2410c',band:'#fed7aa',glow:'rgba(251,146,60,0.4)'},
  };
  const cfg = configs[kind] || configs.normal;

  // outer glow pulse (uses frameCount for animation)
  const pulse = 0.6 + Math.sin(frameCount * 0.08) * 0.4;
  ctx.save();
  ctx.globalAlpha = pulse * 0.5;
  const grd0 = ctx.createRadialGradient(x,y,r*0.6,x,y,r*2.4);
  grd0.addColorStop(0, cfg.glow); grd0.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = grd0;
  ctx.beginPath(); ctx.ellipse(x,y,r*2.2,r*2.5,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // body gradient
  const grd = ctx.createRadialGradient(x-r*.2,y-r*.35,r*.05, x,y,r*1.1);
  grd.addColorStop(0, cfg.top);
  grd.addColorStop(0.45, cfg.mid);
  grd.addColorStop(1, cfg.bot);
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(x,y,r*.82,r,0,0,Math.PI*2); ctx.fill();

  // outline with shadow
  ctx.shadowColor = cfg.bot; ctx.shadowBlur = 4;
  ctx.strokeStyle = cfg.bot; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.ellipse(x,y,r*.82,r,0,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  // equator band
  ctx.strokeStyle = cfg.band; ctx.lineWidth = 2;
  ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.ellipse(x,y,r*.82,r*.42,0,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;

  // kind-specific decoration
  if(kind==='rainbow'){
    ['#ef4444','#f97316','#facc15','#22c55e','#3b82f6','#a855f7'].forEach((col,i)=>{
      ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.arc(x,y,r*.28+i*2.4,Math.PI*.18,Math.PI*.82); ctx.stroke();
    });
    ctx.globalAlpha=1;
  } else if(kind==='fossil'){
    ctx.strokeStyle='#57534e'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-r*.4,y+r*.3); ctx.lineTo(x+r*.4,y-r*.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-r*.3,y-r*.35); ctx.lineTo(x+r*.3,y+r*.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-r*.5); ctx.lineTo(x-r*.25,y+r*.1); ctx.lineTo(x+r*.25,y+r*.1); ctx.closePath(); ctx.stroke();
  } else if(kind==='ghost'){
    ctx.fillStyle='rgba(99,102,241,0.85)';
    ctx.beginPath(); ctx.ellipse(x-r*.28,y-r*.18,r*.16,r*.22,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+r*.28,y-r*.18,r*.16,r*.22,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(99,102,241,0.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y+r*.2,r*.18,.1,Math.PI-.1); ctx.stroke();
  } else if(kind==='dragon'){
    ctx.fillStyle='#dc2626'; ctx.strokeStyle=OL; ctx.lineWidth=1.2;
    [[-r*.32,-r*.85],[0,-r*1.15],[r*.32,-r*.85]].forEach(([dx,dy])=>{
      ctx.beginPath(); ctx.moveTo(x+dx-r*.12,y+dy+r*.18);
      ctx.lineTo(x+dx,y+dy-r*.1); ctx.lineTo(x+dx+r*.12,y+dy+r*.18);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    });
  } else if(kind==='gold'){
    // star burst
    ctx.strokeStyle='rgba(255,255,200,0.7)'; ctx.lineWidth=1.5;
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r*.28,y+Math.sin(a)*r*.34);
      ctx.lineTo(x+Math.cos(a)*r*.58,y+Math.sin(a)*r*.68); ctx.stroke();
    }
  }

  // specular highlight
  const hl = ctx.createRadialGradient(x-r*.28,y-r*.35,0, x-r*.18,y-r*.2,r*.42);
  hl.addColorStop(0,'rgba(255,255,255,0.82)');
  hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl;
  ctx.beginPath(); ctx.ellipse(x-r*.2,y-r*.28,r*.3,r*.2,-0.3,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawObstacle(obs,x){
  const t=obs.type, oy=obs.y, ow=obs.w, oh=obs.h;
  if(t==='rock'){
    ctx.fillStyle='#94a3b8';
    ctx.beginPath();
    ctx.moveTo(x+ow*.15,oy);
    ctx.bezierCurveTo(x,oy, x+ow*.05,oy-oh*.7, x+ow*.2,oy-oh);
    ctx.bezierCurveTo(x+ow*.4,oy-oh*1.12, x+ow*.6,oy-oh*1.12, x+ow*.8,oy-oh);
    ctx.bezierCurveTo(x+ow*.95,oy-oh*.7, x+ow,oy, x+ow*.85,oy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#475569'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(x+ow*.28,oy-oh*.68,ow*.12,oh*.08,-.3,0,Math.PI*2); ctx.fill();

  } else if(t==='cactus'){
    const cc='#22c55e', cd='#15803d';
    block(ctx,x+ow*.33,oy-oh,ow*.34,oh,8,cc,cd,2.5);
    block(ctx,x+ow*.04,oy-oh*.68,ow*.3,ow*.22,8,cc,cd,2.5);
    block(ctx,x+ow*.04,oy-oh*.88,ow*.22,oh*.22,8,cc,cd,2.5);
    block(ctx,x+ow*.66,oy-oh*.62,ow*.3,ow*.22,8,cc,cd,2.5);
    block(ctx,x+ow*.74,oy-oh*.82,ow*.22,oh*.22,8,cc,cd,2.5);

  } else if(t==='fire'){
    const ft=frameCount*.12, mx=x+ow/2;
    [['#fde047',oh*.9],['#fb923c',oh*.7],['#ef4444',oh*.5]].forEach(([col,h2],i)=>{
      ctx.fillStyle=col;
      ctx.beginPath();
      ctx.moveTo(x+4,oy);
      ctx.quadraticCurveTo(mx+Math.sin(ft+i)*8,oy-h2*.5, mx+Math.cos(ft+i*1.3)*5,oy-h2+Math.sin(ft*1.4+i)*5);
      ctx.quadraticCurveTo(mx+Math.sin(ft+i+1)*8,oy-h2*.5, x+ow-4,oy);
      ctx.closePath(); ctx.fill();
    });

  } else if(t==='log'){
    block(ctx,x,oy-oh,ow,oh,6,'#b45309','#78350f',2.5);
    ctx.strokeStyle='#92400e'; ctx.lineWidth=1.5;
    for(let i=1;i<4;i++){
      ctx.beginPath(); ctx.moveTo(x+5,oy-oh+i*oh/3); ctx.lineTo(x+ow-5,oy-oh+i*oh/3); ctx.stroke();
    }
    ctx.fillStyle='rgba(255,255,255,0.18)';
    roundRect(ctx,x+5,oy-oh+3,ow-10,5,2,true,false);
  }
}

// ─── ENEMY DRAW ───────────────────────────────────────────────────────────────
function drawEnemy(enemy,ex){
  const flip=enemy.vx>0;
  ctx.save();
  if(flip){ctx.translate(ex+enemy.w,0); ctx.scale(-1,1); ex=0;}
  const legOff=Math.sin(frameCount*.22)*5;
  if(enemy.type==='ptero')   drawPtero(ex, enemy.y, enemy.frame);
  else if(enemy.type==='trex')   drawTRex(ex,  enemy.y, legOff);
  else if(enemy.type==='anky')   drawAnky(ex,  enemy.y, legOff);
  else if(enemy.type==='raptor') drawRaptor(ex,enemy.y, legOff);
  ctx.restore();
}

function pill(c,x,y,w,h,r){
  roundRect(c,x,y,w,h,Math.min(r,w/2,h/2),true,false);
}

function drawPtero(x,y,frame){
  const wUp=frame===0;
  const wy = wUp ? -48 : 8;
  // wing membrane — curved bezier
  ctx.fillStyle='#6d28d9'; ctx.strokeStyle=OL; ctx.lineWidth=2;
  // left wing
  ctx.beginPath();
  ctx.moveTo(x+18,y-26);
  ctx.bezierCurveTo(x+4,y-30, x-10,y+wy*.6, x-6,y+wy);
  ctx.bezierCurveTo(x+2,y+wy*.3, x+10,y-22, x+18,y-26);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // right wing
  ctx.beginPath();
  ctx.moveTo(x+34,y-26);
  ctx.bezierCurveTo(x+48,y-30, x+62,y+wy*.6, x+58,y+wy);

// ─── COINS ────────────────────────────────────────────────────────────────────
function drawCoins(){
  phaseCoins.forEach(coin=>{
    if(coin.collected) return;
    const cx = coin.x - scrollX;
    if(cx < -30 || cx > W + 30) return;
    const cy = coin.y + Math.sin(coin.bob) * 4;
    // glow
    ctx.fillStyle='rgba(251,191,36,0.25)';
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.fill();
    // outer circle
    ctx.fillStyle='#fbbf24';
    ctx.strokeStyle='#92400e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // inner highlight
    ctx.fillStyle='#fde68a';
    ctx.beginPath(); ctx.arc(cx - 2, cy - 2, 4, 0, Math.PI*2); ctx.fill();
  });
}

// ─── SPIKE TRAPS ──────────────────────────────────────────────────────────────
function drawTraps(){
  phaseTraps.forEach(trap=>{
    const tx = trap.x - scrollX;
    if(tx < -60 || tx > W + 60) return;
    const ty = trap.y;
    const spikeW = 7, spikeH = trap.h, count = 4;
    for(let i = 0; i < count; i++){
      const sx = tx + i * spikeW;
      ctx.fillStyle='#475569';
      ctx.strokeStyle=OL; ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(sx, ty);
      ctx.lineTo(sx + spikeW/2, ty - spikeH);
      ctx.lineTo(sx + spikeW, ty);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  });
}

// ─── POWER-UP ITEMS ───────────────────────────────────────────────────────────
function drawPowerupItems(){
  const puColors = {speed:'#fb923c', shield:'#60a5fa', fire:'#ef4444'};
  const puIcons  = {speed:'⚡', shield:'🛡', fire:'🔥'};
  powerupItems.forEach(item=>{
    if(item.collected) return;
    const ix = item.x - scrollX;
    if(ix < -40 || ix > W + 40) return;
    const iy = item.y + Math.sin(item.bob) * 4;
    // glow
    ctx.fillStyle = puColors[item.type] + '44';
    ctx.beginPath(); ctx.arc(ix + 10, iy - 10, 18, 0, Math.PI*2); ctx.fill();
    // box
    ctx.fillStyle = puColors[item.type];
    ctx.strokeStyle = OL; ctx.lineWidth = 2;
    roundRect(ctx, ix, iy - 20, 20, 20, 5, true, true);
    // icon
    ctx.font = '12px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(puIcons[item.type], ix + 10, iy - 10);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  });
}

function drawSecrets(){
  phaseSecrets.forEach(sec=>{
    if(sec.found) return;
    const sx = sec.x - scrollX;
    if(sx < -40 || sx > W+40) return;
    const sy = sec.y + Math.sin(frameCount*.08)*3;
    ctx.save();
    ctx.globalAlpha = 0.38 + Math.sin(frameCount*.08)*0.18;
    ctx.fillStyle='#a78bfa';
    ctx.strokeStyle=OL; ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+i*Math.PI*2/5;
      const r=i%2===0?12:5;
      const px=sx+Math.cos(a)*r, py=sy+Math.sin(a)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  });
}

function drawCheckpoint(){
  const x = checkpointX - scrollX;
  if(x < -50 || x > W+50) return;
  const y = GROUND;
  ctx.save();
  ctx.strokeStyle = checkpointReached ? '#4ecdc4' : '#64748b';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-82); ctx.stroke();
  ctx.fillStyle = checkpointReached ? '#4ecdc4' : '#94a3b8';
  ctx.strokeStyle = OL; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x+2,y-78); ctx.lineTo(x+44,y-66); ctx.lineTo(x+2,y-54);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  if(checkpointReached){
    ctx.fillStyle='rgba(78,205,196,.16)';
    ctx.beginPath(); ctx.arc(x,y-38,34,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}


// ─── PORTAL ───────────────────────────────────────────────────────────────────
function drawPortal(x,active){
  const t=frameCount*.05;
  const pw=64,ph=110,py=GROUND-ph;
  const cx2=x+pw/2;
  if(active){
    ctx.fillStyle=`rgba(20,184,166,${.12+Math.sin(t)*.06})`;
    ctx.beginPath(); ctx.ellipse(cx2,py+ph*.5,pw*.9,ph*.72,0,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = active ? `rgba(20,184,166,${.28+Math.sin(t)*.1})` : 'rgba(60,60,80,.1)';
  ctx.beginPath();
  ctx.moveTo(x+4,py+ph); ctx.lineTo(x+4,py+ph*.35);
  ctx.bezierCurveTo(x+4,py,x+pw-4,py,x+pw-4,py+ph*.35);
  ctx.lineTo(x+pw-4,py+ph); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=OL; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x+4,py+ph); ctx.lineTo(x+4,py+ph*.35);
  ctx.bezierCurveTo(x+4,py,x+pw-4,py,x+pw-4,py+ph*.35);
  ctx.lineTo(x+pw-4,py+ph); ctx.stroke();
  ctx.strokeStyle=active?'#14b8a6':'#475569'; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x+4,py+ph); ctx.lineTo(x+4,py+ph*.35);
  ctx.bezierCurveTo(x+4,py,x+pw-4,py,x+pw-4,py+ph*.35);
  ctx.lineTo(x+pw-4,py+ph); ctx.stroke();
  if(active){
    for(let i=0;i<5;i++){
      const ang = Math.PI + i*(Math.PI/4) + t*.5;
      const rx=cx2+Math.cos(ang)*28, ry=(py+ph*.35-22)+Math.sin(ang)*22;
      circle(ctx,rx,ry,4,'#5eead4');
    }
  }

  ctx.textAlign='center';
  ctx.fillText(active?tr('enter'):tr('collectEggs'),cx2,py-10);

function drawSecretPortal(x){

// drawDinoOn / drawCavemanOn: desenha no contexto c passado, com escala s
// drawAccessory: desenha TODOS os acessórios ativos do personagem
function drawAccessory(c,char,x,y,ducking=false){
  const accs = Array.isArray(selectedAccessory[char])
    ? selectedAccessory[char]
    : (selectedAccessory[char] && selectedAccessory[char]!=='none' ? [selectedAccessory[char]] : []);
  if(accs.length===0) return;
  const isDino = char === 'dino';
  const ax0 = isDino ? (ducking ? x+43 : x+42) : x+24;
  const ay0 = isDino ? (ducking ? y-30 : y-70) : y-60;
  c.save();
  c.lineCap='round'; c.lineJoin='round';
  // cada acessório tem posição fixa na cabeça (não empilha)
  accs.forEach((acc)=>{
    const ax = ax0, ay = ay0;
    if(acc==='sunglasses'){
      c.fillStyle='#111827'; c.strokeStyle=OL; c.lineWidth=1.5;
      c.beginPath(); c.roundRect(ax-8,ay-3,7,5,2); c.fill(); c.stroke();
      c.beginPath(); c.roundRect(ax+1,ay-3,7,5,2); c.fill(); c.stroke();
      c.strokeStyle='#111827'; c.lineWidth=2; c.beginPath(); c.moveTo(ax-1,ay-1); c.lineTo(ax+1,ay-1); c.stroke();
    } else if(acc==='glasses'){
      c.strokeStyle='#0f172a'; c.lineWidth=1.8;
      c.beginPath(); c.arc(ax-5,ay-1,4,0,Math.PI*2); c.stroke();
      c.beginPath(); c.arc(ax+5,ay-1,4,0,Math.PI*2); c.stroke();
      c.beginPath(); c.moveTo(ax-1,ay-1); c.lineTo(ax+1,ay-1); c.stroke();
    } else if(acc==='cap'){
      // boné fica no topo da cabeça
      c.fillStyle='#ef4444'; c.strokeStyle=OL; c.lineWidth=1.8;
      c.beginPath(); c.ellipse(ax,ay-15,13,7,0,Math.PI,Math.PI*2); c.fill(); c.stroke();
      c.fillStyle='#dc2626'; c.beginPath(); c.ellipse(ax+9,ay-12,10,3.5,.15,0,Math.PI*2); c.fill(); c.stroke();
    } else if(acc==='headphones'){
      // fone envolve a cabeça
      c.strokeStyle='#111827'; c.lineWidth=3;
      c.beginPath(); c.arc(ax,ay-9,15,Math.PI*1.05,Math.PI*1.95); c.stroke();
      c.fillStyle='#38bdf8'; c.strokeStyle=OL; c.lineWidth=1.5;
      c.beginPath(); c.roundRect(ax-16,ay-8,7,12,3); c.fill(); c.stroke();
      c.beginPath(); c.roundRect(ax+9,ay-8,7,12,3); c.fill(); c.stroke();
    } else if(acc==='bow'){
      // laço no topo da cabeça (lado)
      c.fillStyle='#f472b6'; c.strokeStyle=OL; c.lineWidth=1.5;
      c.beginPath(); c.moveTo(ax+6,ay-16); c.lineTo(ax-4,ay-23); c.lineTo(ax-1,ay-11); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(ax+8,ay-16); c.lineTo(ax+19,ay-23); c.lineTo(ax+16,ay-11); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.arc(ax+7,ay-16,3,0,Math.PI*2); c.fill(); c.stroke();
    }
  });
  c.restore();
}

let DINO_P = null;
const JUMP_KEYS = [
  {t:0,sx:1,sy:1,legs:0,tail:0,head:0},{t:.14,sx:1.14,sy:.84,legs:0,tail:0,head:0},
  {t:.28,sx:.88,sy:1.16,legs:-14,tail:-10,head:-6},{t:.5,sx:1,sy:1,legs:-28,tail:-16,head:-2},
  {t:.72,sx:.94,sy:1.08,legs:12,tail:0,head:0},{t:.86,sx:1.16,sy:.82,legs:0,tail:8,head:6},
  {t:1,sx:1,sy:1,legs:0,tail:0,head:0}
];
const HOP_KEYS = [
  {t:0,ty:0,sx:1,sy:1},{t:.6,ty:0,sx:1,sy:1},{t:.68,ty:0,sx:1.06,sy:.94},
  {t:.78,ty:-12,sx:.97,sy:1.04},{t:.9,ty:0,sx:1.04,sy:.96},{t:1,ty:0,sx:1,sy:1}
];
function poseAt(keys,t){
  let i=0; while(i<keys.length-2 && t>keys[i+1].t) i++;
  const a=keys[i], b=keys[i+1];
  let f=Math.min(1,Math.max(0,(t-a.t)/((b.t-a.t)||1)));
  f=f*f*(3-2*f);
  const o={}; for(const k in a) o[k]=a[k]+(b[k]-a[k])*f; return o;
}
function shadeHex(hex,f){
  const n=parseInt(hex.slice(1),16);
  const ch=v=>Math.max(0,Math.min(255,Math.round(v*f))).toString(16).padStart(2,'0');
  return '#'+ch(n>>16)+ch((n>>8)&255)+ch(n&255);
}
let lastInputAt = performance.now();
const dinoAnim = {wasGround:true, landAt:-1e9, waitAt:0};

function drawDinoOn(c,x,y,frame,ducking,s,anim){
  if(!DINO_P){ DINO_P={}; for(const k in DINO_D) DINO_P[k]=new Path2D(DINO_D[k]); }
  const P=DINO_P, INK=DINO_INK;
  const sk=skinPalette('dino');
  const body=sk.primary, shade=shadeHex(sk.primary,.82), belly=sk.belly, bellyLine=shadeHex(sk.belly,.86), spike=sk.spike;
  const now=performance.now(), T=now/1000, TAU=Math.PI*2;
  const moving = anim ? Math.abs(anim.vx)>0.1 : false;

  // repouso: respira, rabo balança, pisca
  const br=(1-Math.cos((T%2.4)/2.4*TAU))/2;
  let rsx=1+.015*br, rsy=1+.035*br, rty=0, tail=-3+8*br, headDeg=-2*br;
  let legN=0, legF=0, legNdx=0, legFdx=0, spkSy=1;
  let hTx=0, hTy=0, hSx=1, hSy=1, wait=false, pop=1, pupDx=0, pupDy=0;
  const blink=(T%3.6)>3.48;

  if(anim){
    if(anim.onGround && !dinoAnim.wasGround) dinoAnim.landAt=now;
    dinoAnim.wasGround=anim.onGround;
  }
  if(ducking){
    rsx=1.12; rsy=.74; tail=10; spkSy=.6;
    hTx=8; hTy=22; headDeg=10; hSx=.89; hSy=1.3;
    const sh=Math.sin(T/.5*TAU)*3; legNdx=sh; legFdx=-sh;
  } else if(anim && !anim.onGround){
    const t = anim.vy<0 ? .28+.22*Math.min(1,Math.max(0,1-(-anim.vy)/-JUMP_FORCE))
                        : .5+.22*Math.min(1,anim.vy/8);
    const k=poseAt(JUMP_KEYS,t);
    rsx=k.sx; rsy=k.sy; legN=legF=k.legs; tail=k.tail; headDeg=k.head;
  } else if(anim && now-dinoAnim.landAt<80){
    const k=poseAt(JUMP_KEYS,.86+.14*(now-dinoAnim.landAt)/80);
    rsx=k.sx; rsy=k.sy; legN=legF=k.legs; tail=k.tail; headDeg=k.head;
  } else if(anim && anim.idleMs>4000 && !moving){
    wait=true;
    if(!dinoAnim.waitAt) dinoAnim.waitAt=now;
    const h=poseAt(HOP_KEYS,(T%1.6)/1.6);
    rty=h.ty; rsx=h.sx; rsy=h.sy;
    tail=2+12*Math.sin(T/.35*TAU);
    legN=-10*Math.max(0,Math.sin(T/.5*TAU));
    const d=(T%2.2)/2.2;
    if(d>=.35&&d<.6){pupDx=-3;pupDy=1;} else if(d>=.65&&d<.85){pupDx=3;pupDy=1;}
    const w=(now-dinoAnim.waitAt)/400;
    pop = w<.6 ? .6+.48*(w/.6) : w<1 ? 1.08-.08*((w-.6)/.4) : 1;
  } else if(moving){
    const sw=Math.sin(frameCount*.25)*16; legN=sw; legF=-sw;
  }
  if(anim && !wait) dinoAnim.waitAt=0;

  const part=(ox,oy,deg,sx,sy,dx,dy,fn)=>{
    c.save(); c.translate(ox+dx,oy+dy); c.rotate(deg*Math.PI/180); c.scale(sx,sy); c.translate(-ox,-oy); fn(); c.restore();
  };
  const fs=(path,fill,lw=5)=>{ c.fillStyle=fill; c.fill(path); c.lineWidth=lw; c.strokeStyle=INK; c.stroke(path); };
  const ell=(cx,cy,rx,ry,fill,lw)=>{ c.beginPath(); c.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); c.fillStyle=fill; c.fill(); if(lw){c.lineWidth=lw;c.strokeStyle=INK;c.stroke();} };

  c.save();
  c.translate(x,y); c.scale(s,s);
  c.translate(24-103*DINO_K,-162*DINO_K); c.scale(DINO_K,DINO_K);
  c.lineJoin='round'; c.lineCap='round';

  // sombra
  c.globalAlpha=.16; ell(104,166,58*rsx,7,INK); c.globalAlpha=1;

  part(104,162,0,rsx,rsy,0,rty,()=>{
    // rabo
    part(68,94,tail,1,1,0,0,()=>{
      fs(P.tail,body);
      c.lineWidth=4; c.strokeStyle=shade; c.stroke(P.tailStripe);
    });
    // espinhos
    part(88,82,0,1,spkSy,0,0,()=>fs(P.spk,spike));
    // perna de trás
    part(125,135,legF,1,1,legFdx,0,()=>fs(P.legF,shade));
    // tronco + barriga
    fs(P.torso,body);
    c.fillStyle=belly; c.fill(P.belly);
    c.lineWidth=3; c.strokeStyle=bellyLine; c.stroke(P.bellyLines);
    c.fillStyle=shade;
    [[72,88,5],[86,80,3.5],[66,104,3]].forEach(([cx,cy,r])=>{c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fill();});
    // perna da frente
    part(81,106,legN,1,1,legNdx,0,()=>{
      fs(P.thigh,body); fs(P.foot,body);
      c.lineWidth=3; c.strokeStyle=INK; c.stroke(P.toes);
    });
    // braço
    fs(P.arm,body);
    // cabeça
    if(!wait){
      part(143,80,headDeg,hSx,hSy,hTx,hTy,()=>{
        fs(P.spkP,spike);
        fs(P.headP,body);
        ell(160,40,14,16,'#FFFFFF',4);
        c.fillStyle=sk.eye||INK; c.beginPath(); c.arc(165,42,8,0,Math.PI*2); c.fill();
        c.fillStyle='#FFFFFF'; c.beginPath(); c.arc(168,38,3,0,Math.PI*2); c.fill();
        if(blink) ell(160,40,15,17,body,4);
        c.lineWidth=4; c.strokeStyle=INK; c.stroke(P.browP);
        ell(200,44,2.5,3.5,INK);
        c.globalAlpha=.85; ell(182,66,8,5,'#FF9FA0'); c.globalAlpha=1;
        c.lineWidth=4; c.strokeStyle=INK; c.stroke(P.smile);
        c.fillStyle='#FFFFFF'; c.fill(P.tooth); c.lineWidth=2.5; c.stroke(P.tooth);
        c.save(); c.translate(160,40); c.scale(1/DINO_K,1/DINO_K); drawAccessory(c,'dino',-42,70,false); c.restore();
      });
    } else {
      part(143,80,0,pop,pop,0,0,()=>{
        fs(P.spkF,spike);
        fs(P.headF,body);
        ell(164,70,22,14,belly);
        ell(146,42,12,14,'#FFFFFF',4); ell(182,42,12,14,'#FFFFFF',4);
        c.fillStyle=sk.eye||INK;
        [[146,45],[182,45]].forEach(([cx,cy])=>{c.beginPath();c.arc(cx+pupDx,cy+pupDy,7,0,Math.PI*2);c.fill();});
        c.fillStyle='#FFFFFF';
        [[148.5,41.5],[184.5,41.5]].forEach(([cx,cy])=>{c.beginPath();c.arc(cx+pupDx,cy+pupDy,2.6,0,Math.PI*2);c.fill();});
        if(blink){ ell(146,42,13,15,body,4); ell(182,42,13,15,body,4); }
        c.lineWidth=4; c.strokeStyle=INK; c.stroke(P.browsF);
        c.globalAlpha=.85; ell(132,62,7,4.5,'#FF9FA0'); ell(196,62,7,4.5,'#FF9FA0'); c.globalAlpha=1;
        fs(P.mouthF,'#E35D6A',4);
        c.save(); c.translate(164,42); c.scale(1/DINO_K,1/DINO_K); drawAccessory(c,'dino',-42,70,false); c.restore();
      });
    }
  });
  c.restore();
}

function drawCavemanOn(c,x,y,frame,ducking,s){
  const ft=frameCount*.14;
  const bh=ducking?30:56;
  const moving = Math.abs(player.vx) > 0.1;
  const lo=ducking?0:(moving?Math.sin(ft)*5:0);
  const look = skinPalette('caveman');
  // flip horizontalmente se virado para a esquerda
  const facingDir = (s===1) ? player.facing : 1;
  c.save();
  if(facingDir===-1){
    c.translate(x + player.w, y); c.scale(-s, s); c.translate(-x, -y);
  } else {
    c.translate(x,y); c.scale(s,s); c.translate(-x,-y);
  }

  const skinDark=look.bodyDark, skin=look.body, skinLight=look.skin;

  // club (in hand) — swing animado quando atacando
  if(!ducking){
    // progresso do swing: 0=início, 1=fim
    const swingP = player.attacking ? 1-(player.attackTimer/22) : 0;
    // ângulo: repouso=0.4rad (diagonal pra baixo), swing: -1.1rad (acima) → 1.0rad (abaixo)
    const baseAngle = 0.4;
    const swingAngle = player.attacking
      ? (-1.1 + swingP * 2.3) * player.attackDir
      : baseAngle * (player.attackDir>0?1:1);
    const armX = x + (player.attackDir>0 ? 40 : 8);
    const armY = y-40;
    const clavLen = 28;
    const tipX = armX + Math.cos(swingAngle)*clavLen * player.attackDir;
    const tipY = armY + Math.sin(swingAngle)*clavLen;

    // trail de swing (linhas amarelas nos frames ativos)
    if(player.attacking && player.attackTimer<=18 && player.attackTimer>=6){
      for(let t2=0;t2<4;t2++){
        const tp = 1-((player.attackTimer+t2*2)/22);
        const ta = (-1.1+tp*2.3)*player.attackDir;
        const tx2=armX+Math.cos(ta)*clavLen*player.attackDir, ty2=armY+Math.sin(ta)*clavLen;
        c.globalAlpha=(t2+1)/7;
        c.strokeStyle='#fbbf24'; c.lineWidth=6; c.lineCap='round';
        c.beginPath(); c.moveTo(armX,armY); c.lineTo(tx2,ty2); c.stroke();
      }
      c.globalAlpha=1;
    }

    // cabo
    c.strokeStyle=look.club; c.lineWidth=7; c.lineCap='round';
    c.beginPath(); c.moveTo(armX,armY); c.lineTo(tipX,tipY); c.stroke();
    // cabeça da clava
    c.fillStyle=look.club; c.strokeStyle=OL; c.lineWidth=2;
    c.beginPath(); c.ellipse(tipX,tipY,9,7,swingAngle,0,Math.PI*2); c.fill(); c.stroke();
    // espinhos da clava
    for(let i=0;i<5;i++){
      const sa=swingAngle+i*(Math.PI*2/5);
      c.strokeStyle='#9ca3af'; c.lineWidth=2;
      c.beginPath();
      c.moveTo(tipX+Math.cos(sa)*7,tipY+Math.sin(sa)*6);
      c.lineTo(tipX+Math.cos(sa)*13,tipY+Math.sin(sa)*11);
      c.stroke();
    }
  }

  // legs
  if(!ducking){
    block(c,x+12,y-22+Math.abs(lo),13,22,7,skinDark);
    block(c,x+28,y-22+Math.abs(lo),13,22,7,skinDark);
    block(c,x+9,y-5,16,7,4,look.boot);
    block(c,x+26,y-5,16,7,4,look.boot);
  } else {
    block(c,x+8,y-14,14,14,6,skinDark);

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
// ─── FIRE BREATH ──────────────────────────────────────────────────────────────
function drawFireBreath(){
  if(!player.attacking || selectedChar!=='dino') return;
  const progress = 1 - player.attackTimer/26; // 0→1 over attack duration
  const fade = player.attackTimer <= 6 ? player.attackTimer/6 : 1;
  const dir = player.attackDir;
  // origin: dino snout
  const ox = dir>0 ? player.x+60 : player.x-12;
  const oy = player.y-60;
  const maxLen = activeEffects.fire > 0 ? 138 : 96;
  const len = maxLen * Math.min(1, progress*2.4);
  const layers = [
    { col:'#fef08a', rad:13, offset:0    },
    { col:'#fb923c', rad:10, offset:.25  },
    { col:'#ef4444', rad:7,  offset:.55  },
  ];
  ctx.save();
  for(const {col,rad,offset} of layers){
    const count = 5;
    for(let i=0;i<count;i++){
      const t2 = (i/count) + offset;
      if(t2 > progress) continue;
      const fx = ox + dir * t2 * len + Math.sin(frameCount*.3+i*1.3)*(3+i*1.5)*(1-t2);
      const fy = oy + Math.cos(frameCount*.25+i*0.9)*(2+i*1.2)*(1-t2);
      const r  = rad * (1 - t2*.55);
      ctx.globalAlpha = fade * (0.85 - t2*.4);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI*2); ctx.fill();
    }
  }
  // heat shimmer ring at tip
  if(progress > .4){
    const tx = ox + dir*len, ty = oy;
    ctx.globalAlpha = fade * .5;
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(tx, ty, 8+progress*6, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ─── WIN SCENE ────────────────────────────────────────────────────────────────
function drawCrackingEgg(ex, ey, t, idx){
  const eggColors  = ['#fef3c7','#fce7f3','#e0f2fe','#d1fae5','#ede9fe'];
  const dinoColors = ['#22c55e','#f97316','#60a5fa','#facc15','#e879f9'];
  const col = eggColors[idx];
  const dcol = dinoColors[idx];
  const shake = (t>3 && t<48) ? Math.sin(t*1.1)*(3-t/20) : 0;
  const cx = ex + shake;

  if(t < 55){
    // whole egg
    ctx.fillStyle=col; ctx.strokeStyle=OL; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.ellipse(cx, ey, 22, 28, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // cracks appear at t>18
    if(t>18){
      const cp = Math.min(1,(t-18)/30);
      ctx.strokeStyle=OL; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(cx,ey-12); ctx.lineTo(cx+7*cp,ey-2); ctx.lineTo(cx-5*cp,ey+9*cp); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-10,ey-6); ctx.lineTo(cx-3*cp,ey+6*cp); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+8,ey-8); ctx.lineTo(cx+4*cp,ey+4*cp); ctx.stroke();
    }
  } else {
    // egg splits open
    const openP = Math.min(1,(t-55)/35);
    const liftY  = openP * 30;

    // bottom shell
    ctx.fillStyle=col; ctx.strokeStyle=OL; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.ellipse(cx, ey+6, 22, 20, 0, 0, Math.PI); ctx.fill(); ctx.stroke();

    // baby dino peeks out — proper dino silhouette
    if(t > 65){
      const peekP = Math.min(1,(t-65)/30);
      const hy = ey + 4 - peekP*22;
      const sc = peekP;
      const headColors=['#86efac','#fdba74','#bfdbfe','#fef08a','#f5d0fe'];
      const hcol = headColors[idx];

      // tail hint (left side)
      ctx.strokeStyle=dcol; ctx.lineWidth=Math.max(1,5*sc); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(cx-8*sc,hy+6); ctx.quadraticCurveTo(cx-18*sc,hy+2,cx-20*sc,hy-4); ctx.stroke();

      // body
      ctx.fillStyle=dcol; ctx.strokeStyle=OL; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(cx, hy+5, 14*sc, 10*sc, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

      if(peekP > 0.4){
        // dorsal spike
        ctx.fillStyle='#fbbf24'; ctx.strokeStyle=OL; ctx.lineWidth=1.2;
        ctx.beginPath();
        ctx.moveTo(cx-5,hy-4); ctx.lineTo(cx,hy-14*sc); ctx.lineTo(cx+5,hy-4);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // neck
        ctx.fillStyle=dcol; ctx.strokeStyle=OL; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.ellipse(cx+10*sc, hy, 5*sc, 8*sc, 0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        // head (offset to right)
        ctx.fillStyle=hcol; ctx.strokeStyle=OL; ctx.lineWidth=1.8;
        ctx.beginPath(); ctx.arc(cx+17*sc, hy-5, 9*sc, 0, Math.PI*2); ctx.fill(); ctx.stroke();

        // snout triangle (pointing right)
        ctx.fillStyle=dcol; ctx.strokeStyle=OL; ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(cx+22*sc,hy-5); ctx.lineTo(cx+29*sc,hy-2); ctx.lineTo(cx+29*sc,hy-8);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // eye (single, on head)
        ctx.fillStyle='#fff'; ctx.strokeStyle=OL; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(cx+15*sc, hy-8, 3.5*sc, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#1e3a8a'; ctx.beginPath(); ctx.arc(cx+16*sc, hy-8, 2*sc, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx+17*sc, hy-9, 0.9, 0, Math.PI*2); ctx.fill();
      }
    }

    // top shell rises above baby
    ctx.fillStyle=col; ctx.strokeStyle=OL; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.ellipse(cx, ey-6-liftY, 22, 20, 0, Math.PI, Math.PI*2); ctx.fill(); ctx.stroke();

    // burst sparkles when egg first opens
    if(t >= 55 && t < 78){
      const sp = (t-55)/23;
      for(let s=0;s<8;s++){
        const ang = (s/8)*Math.PI*2;
        const sr = 18+sp*40;
        const sx2 = cx+Math.cos(ang)*sr, sy2 = ey+Math.sin(ang)*sr*.55;
        ctx.globalAlpha = 1-sp;
        ctx.fillStyle = ['#fbbf24','#34d399','#60a5fa','#f472b6','#a78bfa'][s%5];
        ctx.beginPath(); ctx.arc(sx2,sy2,3.5,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
    }
  }
}

function drawWinScene(){
  // dark overlay fade in
  const fadeA = Math.min(0.88, winTimer/40);
  ctx.fillStyle=`rgba(4,8,28,${fadeA})`;
  ctx.fillRect(0,0,W,H);

  // title
  const ta = Math.min(1,(winTimer-10)/25);
  if(ta>0){
    ctx.globalAlpha=ta;
    ctx.fillStyle='#fbbf24'; ctx.font='bold 20px "Press Start 2P"';
    ctx.textAlign='center';
    ctx.fillText(tr('win'), W/2, 68);
    ctx.fillStyle='#a5f3fc'; ctx.font='8px "Press Start 2P"';
    ctx.fillText(tr('hatching'), W/2, 96);
    ctx.globalAlpha=1;
  }

  // 5 eggs staggered
  const delays = [0, 35, 70, 105, 140];
  const ey = 300;
  const spacing = 130;
  const startX = W/2 - spacing*2;
  for(let i=0;i<5;i++){
    const t = Math.max(0, winTimer - delays[i]);
    drawCrackingEgg(startX + i*spacing, ey, t, i);
  }

  // score fades in after all eggs open
  if(winTimer > 260){
    const sa = Math.min(1,(winTimer-260)/30);
    ctx.globalAlpha=sa;
    ctx.fillStyle='#fef9c3'; ctx.font='11px "Press Start 2P"';
    ctx.textAlign='center';
    ctx.fillText(tr('finalScore', score), W/2, 400);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

function startEditor(){
  editorBlocks = [];
  stopMenuAnimation();
  player.x=100; player.y=GROUND; player.vx=0; player.vy=0;
  player.onGround=true; player.ducking=false; player.invincible=0; player.jumpCount=0; player.hp=3;
  scrollX=0; currentLen=5000;
  phasePlatforms=[]; phaseEggs=[]; phaseEnemies=[]; phaseObstacles=[]; phaseTraps=[]; phaseCoins=[]; powerupItems=[];
  currentTheme=THEMES[0];
  document.getElementById('overlay').style.display='none';
  state='editor';
}

function updateEditor(){
  if(keys['ArrowRight']||keys['KeyD']){ player.vx=MOVE_SPEED; player.facing=1; }
  else if(keys['ArrowLeft']||keys['KeyA']){ player.vx=-MOVE_SPEED*.7; player.facing=-1; }
  else player.vx=0;
  player.vy+=GRAVITY;
  player.x+=player.vx; player.y+=player.vy;
  if(player.y>=GROUND){ player.y=GROUND; player.vy=0; player.onGround=true; player.jumpCount=0; }
  for(const b of editorBlocks){
    if(player.x+18>b.x && player.x-10<b.x+b.w && player.y<=b.y+3 && player.y-player.vy>=b.y-26){
      player.y=b.y; player.vy=0; player.onGround=true; player.jumpCount=0;
    }
  }
  player.x=Math.max(60,Math.min(currentLen-60,player.x));
  scrollX=Math.max(0,Math.min(currentLen-W,player.x-200));
  player.frame=player.vx!==0?Math.floor(Date.now()/120)%4:0;
}

function placeEditorBlock(wx, wy){
  const bt=EDITOR_BTYPES[editorBlockType];
  const bx=Math.round((wx-bt.w/2)/bt.w)*bt.w;
  const by=wy!==undefined?Math.min(Math.round(wy/bt.h)*bt.h,GROUND):player.y;
  if(editorBlocks.some(b=>Math.abs(b.x-bx)<8&&Math.abs(b.y-by)<8)) return;
  editorBlocks.push({x:bx,y:by,w:bt.w,h:bt.h,typeIdx:editorBlockType,type:'stone'});
}

function drawEditorBlock(c,b,sx){
  const bt=EDITOR_BTYPES[b.typeIdx]||EDITOR_BTYPES[0];
  bt.draw(c,sx,b.y-bt.h,b.w,bt.h);
}

function drawEditor(){
  // sky
  const skyG=ctx.createLinearGradient(0,0,0,GROUND);
  skyG.addColorStop(0,'#4ab6ed'); skyG.addColorStop(1,'#c8f0a0');
  ctx.fillStyle=skyG; ctx.fillRect(0,0,W,GROUND);
  // ground strip
  ctx.fillStyle='#72c94b'; ctx.fillRect(0,GROUND,W,8);
  ctx.fillStyle='#85512e'; ctx.fillRect(0,GROUND+8,W,H-GROUND-8);
  // grid
  ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=1;
  for(let gx=Math.floor(scrollX/60)*60;gx<scrollX+W+60;gx+=60){
    ctx.beginPath(); ctx.moveTo(gx-scrollX,0); ctx.lineTo(gx-scrollX,GROUND); ctx.stroke();
  }
  // blocos colocados
  for(const b of editorBlocks){
    const sx=b.x-scrollX;
    if(sx>-b.w-10&&sx<W+10) drawEditorBlock(ctx,b,sx);
  }
  // preview do bloco selecionado no player
  const bt=EDITOR_BTYPES[editorBlockType];
  const previewX=Math.round((player.x-bt.w/2+scrollX)/bt.w)*bt.w-scrollX;
  ctx.save(); ctx.globalAlpha=0.4;
  bt.draw(ctx,previewX,player.y-bt.h,bt.w,bt.h);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5;
  ctx.setLineDash([5,4]); ctx.strokeRect(previewX,player.y-bt.h,bt.w,bt.h); ctx.setLineDash([]);
  // fim da fase
  const endX=currentLen-220-scrollX;
  if(endX>-20&&endX<W+20){
    ctx.fillStyle='rgba(168,85,247,0.4)'; ctx.fillRect(endX,GROUND-70,16,70);
    ctx.fillStyle='#a855f7'; ctx.font='5px "Press Start 2P"';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('FIM',endX+8,GROUND-82);
  }
  // player
  if(typeof drawDinoOn==='function') drawDinoOn(ctx,player.x-scrollX,player.y,player.frame,false,1);

  // ── GAVETA DE BLOCOS ──────────────────────────────────────────────────────
  const drawerY=GROUND+10, drawerH=H-GROUND-10;
  ctx.fillStyle='rgba(5,10,22,0.92)'; ctx.fillRect(0,drawerY,W,drawerH);
  ctx.strokeStyle='rgba(78,205,196,0.25)'; ctx.lineWidth=1; ctx.strokeRect(0,drawerY,W,drawerH);
  const slotW=Math.floor(W/EDITOR_BTYPES.length);
  EDITOR_BTYPES.forEach((bt,i)=>{
    const sx=i*slotW, sy=drawerY+4, sw=slotW-8, sh=drawerH-16;
    const isActive=i===editorBlockType;
    // slot bg
    ctx.fillStyle=isActive?'rgba(78,205,196,0.18)':'rgba(255,255,255,0.04)';
    roundRect(ctx,sx+4,sy,sw,sh,6,true,false);
    ctx.strokeStyle=isActive?'#4ecdc4':'rgba(255,255,255,0.1)';
    ctx.lineWidth=isActive?2:1;
    roundRect(ctx,sx+4,sy,sw,sh,6,false,true);
    // preview do bloco (miniatura centrada no slot)
    const scale=Math.min((sw-12)/bt.w, (sh-20)/bt.h, 1);
    const bw=Math.round(bt.w*scale), bh=Math.round(bt.h*scale);
    const bx=sx+4+(sw-bw)/2, by=sy+(sh-bh)/2-4;
    ctx.save(); bt.draw(ctx,bx,by,bw,bh); ctx.restore();
    // nome
    ctx.fillStyle=isActive?'#4ecdc4':'#5a7a8a';
    ctx.font='4.5px "Press Start 2P"';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(bt.name,sx+slotW/2,sy+sh);
    // tecla de atalho
    ctx.fillStyle=isActive?'#ffe66d':'#2a3a4a';
    ctx.font='4px "Press Start 2P"';
    ctx.textBaseline='top';
    ctx.fillText(`[${i+1}]`,sx+slotW/2,sy+3);
  });

  // HUD topo
  ctx.fillStyle='rgba(5,10,22,.88)'; roundRect(ctx,8,8,W-16,28,6,true,false);
  ctx.strokeStyle='rgba(78,205,196,.25)'; ctx.lineWidth=1; roundRect(ctx,8,8,W-16,28,6,false,true);
  ctx.fillStyle='#4ecdc4'; ctx.font='5.5px "Press Start 2P"';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('B/CLIQUE=Bloco  ·  1-5=Tipo  ·  DEL=Desfazer  ·  ENTER=Concluir',16,22);
  ctx.fillStyle='#ffe66d'; ctx.textAlign='right';
  ctx.fillText(`${editorBlocks.length} blocos`,W-16,22);
}

function frLighten(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${Math.min(255,Math.round(r*1.35))},${Math.min(255,Math.round(g*1.35))},${Math.min(255,Math.round(b*1.35))})`;}
function frTileFloorColor(wx,wy){const tx=Math.floor(wx),ty=Math.floor(wy);if(tx<0||tx>=FR_SZ||ty<0||ty>=FR_SZ)return'#111';const t=FR_MAP[ty][tx];if(t===9)return'#0c4a6e';if(t===2)return'#1a3d1a';if(t===1)return'#2a2f3a';if(t===0)return'#1e1e1e';return'#111';}


function frIso(tx,ty,cx,cy){return{x:(tx-ty)*FR_TW/2+cx, y:(tx+ty)*FR_TH/2+cy};}
function frBlocked(tx,ty){const ix=Math.floor(tx),iy=Math.floor(ty);if(ix<0||iy<0||ix>=FR_SZ||iy>=FR_SZ)return true;return FR_MAP[iy][ix]>=3;}

function startFreeRoam(){
  stopMenuAnimation();
  document.getElementById('overlay').style.display='none';
  frPlayer={tx:14.5,ty:3.0,vx:0,vy:0,frame:0,frameT:0,facing:Math.PI/2};
  frNPCs=[
    {tx:2.5, ty:3.0, vx:0.4, vy:0,    frame:0,frameT:0,c:'#f472b6'},
    {tx:8.5, ty:0.5, vx:0,   vy:0.3,  frame:0,frameT:0,c:'#38bdf8'},
    {tx:14.5,ty:5.5, vx:-0.4,vy:0,    frame:0,frameT:0,c:'#4ade80'},
    {tx:20.5,ty:3.0, vx:0,   vy:-0.3, frame:0,frameT:0,c:'#fbbf24'},
    {tx:26.5,ty:0.5, vx:-0.3,vy:0,    frame:0,frameT:0,c:'#c084fc'},
    {tx:7.5, ty:5.5, vx:0.3, vy:0,    frame:0,frameT:0,c:'#fb923c'},
  ];
  frCoins=[];
  for(let ty=0;ty<FR_SZ;ty++)for(let tx=0;tx<FR_SZ;tx++){
    if((FR_MAP[ty][tx]===0||FR_MAP[ty][tx]===1||FR_MAP[ty][tx]===2)&&Math.random()<0.07)
      frCoins.push({tx:tx+0.5+Math.random()*0.3,ty:ty+0.5+Math.random()*0.3,bob:Math.random()*Math.PI*2,collected:false});
  }
  frCars=[
    {tx:2.5, ty:0.5,color:'#ef4444',occupied:false,facing:0},
    {tx:8.5, ty:3.0,color:'#3b82f6',occupied:false,facing:0},
    {tx:14.5,ty:0.5,color:'#22c55e',occupied:false,facing:0},
    {tx:20.5,ty:3.0,color:'#f97316',occupied:false,facing:Math.PI},
    {tx:27.5,ty:0.5,color:'#eab308',occupied:false,facing:0},
  ];
  frDriving=null;
  frCoinCount=0;
  state='freeroam';
}

function updateFreeRoam(){
  if(frDriving){
    const turn=0.052,spd=0.11;
    if(keys['KeyA']||keys['ArrowLeft'])frDriving.facing-=turn;
    if(keys['KeyD']||keys['ArrowRight'])frDriving.facing+=turn;
    let move=0;
    if(keys['KeyW']||keys['ArrowUp'])move=spd;
    if(keys['KeyS']||keys['ArrowDown'])move=-spd*0.6;
    if(move){
      const nx=frDriving.tx+Math.cos(frDriving.facing)*move;
      const ny=frDriving.ty+Math.sin(frDriving.facing)*move;
      if(!frBlocked(nx,frDriving.ty)&&nx>0.3&&nx<FR_SZ-0.3)frDriving.tx=nx;
      if(!frBlocked(frDriving.tx,ny)&&ny>0.3&&ny<FR_SZ-0.3)frDriving.ty=ny;
    }
    frPlayer.tx=frDriving.tx;frPlayer.ty=frDriving.ty;frPlayer.facing=frDriving.facing;
    frPlayer.frameT++;if(frPlayer.frameT>6){frPlayer.frame=(frPlayer.frame+1)%4;frPlayer.frameT=0;}
  } else {
    const turn=0.055,spd=0.055;
    if(keys['KeyA']||keys['ArrowLeft'])frPlayer.facing-=turn;
    if(keys['KeyD']||keys['ArrowRight'])frPlayer.facing+=turn;
    let move=0;
    if(keys['KeyW']||keys['ArrowUp'])move=spd;
    if(keys['KeyS']||keys['ArrowDown'])move=-spd*0.6;
    if(move){
      const nx=frPlayer.tx+Math.cos(frPlayer.facing)*move;
      const ny=frPlayer.ty+Math.sin(frPlayer.facing)*move;
      if(!frBlocked(nx,frPlayer.ty)&&nx>0.1&&nx<FR_SZ-0.1)frPlayer.tx=nx;
      if(!frBlocked(frPlayer.tx,ny)&&ny>0.1&&ny<FR_SZ-0.1)frPlayer.ty=ny;
      frPlayer.frameT++;if(frPlayer.frameT>8){frPlayer.frame=(frPlayer.frame+1)%4;frPlayer.frameT=0;}
    } else frPlayer.frame=0;
  }
  frCoins.forEach(c=>{
    c.bob+=0.06;
    if(c.collected)return;
    if(Math.abs(c.tx-frPlayer.tx)<0.65&&Math.abs(c.ty-frPlayer.ty)<0.65){
      c.collected=true;frCoinCount++;frTotalCoins++;totalCoins++;saveProgress();
    }
  });
  frNPCs.forEach(n=>{
    const nx2=n.tx+n.vx*0.04,ny2=n.ty+n.vy*0.04;
    if(frBlocked(nx2,n.ty)||nx2<0.5||nx2>FR_SZ-0.5)n.vx*=-1;else n.tx=nx2;
    if(frBlocked(n.tx,ny2)||ny2<0.5||ny2>6.5)n.vy*=-1;else n.ty=ny2;
    n.frameT++;if(n.frameT>10){n.frame=(n.frame+1)%4;n.frameT=0;}
  });
}

function drawFreeRoam(){
  // 3D perspective chase-cam (like a car game)
  const FOCAL=370, CAM_BACK=1.9, CAM_H=0.62;
  const HOR=Math.round(H*0.4);
  const camA=frDriving?frDriving.facing:frPlayer.facing;
  const camX=frPlayer.tx-Math.cos(camA)*CAM_BACK;
  const camY=frPlayer.ty-Math.sin(camA)*CAM_BACK;
  const cosA=Math.cos(-camA),sinA=Math.sin(-camA);

  // perspective projection: world(wx,wy,wz) → screen{x,y,sc,d}
  function proj(wx,wy,wz){
    const dx=wx-camX,dy=wy-camY;
    const lz=dx*cosA-dy*sinA;  // depth (positive = in front of camera)
    const lx=dx*sinA+dy*cosA;  // lateral (positive = right of camera)
    if(lz<0.08)return null;
    const sc=FOCAL/lz;
    return{x:W/2+lx*sc,y:HOR+(CAM_H-wz)*sc,sc,d:lz};
  }

  // SKY
  const sg=ctx.createLinearGradient(0,0,0,HOR);
  sg.addColorStop(0,'#07101f');sg.addColorStop(0.65,'#0d2a52');sg.addColorStop(1,'#1a5080');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,HOR);
  ctx.fillStyle='rgba(253,224,100,.1)';ctx.beginPath();ctx.arc(640,50,55,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(640,50,22,0,Math.PI*2);ctx.fill();
  [[60,30],[120,15],[200,45],[300,20],[430,35],[560,10],[700,42],[760,22]].forEach(([sx,sy])=>{
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(sx,sy,1,0,Math.PI*2);ctx.fill();});
  // horizon haze
  const hz=ctx.createLinearGradient(0,HOR-18,0,HOR+12);
  hz.addColorStop(0,'transparent');hz.addColorStop(0.5,'rgba(26,80,128,.4)');hz.addColorStop(1,'transparent');
  ctx.fillStyle=hz;ctx.fillRect(0,HOR-18,W,30);

  // TILES + BUILDINGS — sorted far→near (painter's algorithm)
  const draws=[];
  for(let ty=0;ty<FR_SZ;ty++)for(let tx=0;tx<FR_SZ;tx++){
    const tile2=FR_MAP[ty][tx];
    const dist=(tx+0.5-camX)**2+(ty+0.5-camY)**2;
    if(dist<(tile2===9?400:196))draws.push({tx,ty,tile:tile2,dist});
  }
  draws.sort((a,b)=>b.dist-a.dist);

  draws.forEach(({tx,ty,tile,dist})=>{
    const pa=proj(tx,ty,0),pb=proj(tx+1,ty,0),pc=proj(tx+1,ty+1,0),pd=proj(tx,ty+1,0);
    if(tile<3||tile===9){
      // Ground tile quad (inclui oceano)
      const pts=[pa,pb,pc,pd].filter(Boolean);
      if(pts.length<3)return;
      const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
      if(Math.min(...xs)>W+30||Math.max(...xs)<-30||Math.min(...ys)>H+10)return;
      ctx.fillStyle=tile===9?(ty%2===0?'#0c4a6e':'#0e5c82'):tile===2?'#1a3d1a':tile===1?'#28303f':'#191f1f';
      ctx.beginPath();let first=true;
      [pa,pb,pc,pd].forEach(p=>{if(!p)return;first?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);first=false;});
      ctx.closePath();ctx.fill();
      if(tile===0&&pts.length===4){ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=0.4;ctx.stroke();}
      if(tile===2){const mc=proj(tx+0.5,ty+0.5,0.04);if(mc){ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(mc.x,mc.y,Math.max(1,mc.sc*0.07),0,Math.PI*2);ctx.fill();}}
    } else {
      // Building 3D box
      const bldg=FR_BLDG[tile];if(!bldg)return;
      const wh=bldg.fl*0.28;
      const pat=proj(tx,ty,wh),pbt=proj(tx+1,ty,wh),pct=proj(tx+1,ty+1,wh),pdt=proj(tx,ty+1,wh);
      const fog=Math.min(0.72,dist/160);
      function bFace(p0,p1,p1t,p0t,clr){
        if(!p0||!p1||!p1t||!p0t)return;
        const xs=[p0.x,p1.x,p1t.x,p0t.x],ys=[p0.y,p1.y,p1t.y,p0t.y];
        if(Math.min(...xs)>W+40||Math.max(...xs)<-40||Math.min(...ys)>H+40||Math.max(...ys)<-40)return;
        ctx.globalAlpha=1-fog;ctx.fillStyle=clr;
        ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p1t.x,p1t.y);ctx.lineTo(p0t.x,p0t.y);ctx.closePath();ctx.fill();
        // window bands
        if(bldg.fl>1){
          ctx.fillStyle='rgba(255,250,160,.28)';
          for(let f=1;f<bldg.fl;f++){
            const t0=f/bldg.fl,t1=(f+0.38)/bldg.fl;
            const ax0=p0t.x+(p0.x-p0t.x)*t0,ay0=p0t.y+(p0.y-p0t.y)*t0;
            const bx0=p1t.x+(p1.x-p1t.x)*t0,by0=p1t.y+(p1.y-p1t.y)*t0;
            const ax1=p0t.x+(p0.x-p0t.x)*t1,ay1=p0t.y+(p0.y-p0t.y)*t1;
            const bx1=p1t.x+(p1.x-p1t.x)*t1,by1=p1t.y+(p1.y-p1t.y)*t1;
            ctx.beginPath();ctx.moveTo(ax0,ay0);ctx.lineTo(bx0,by0);ctx.lineTo(bx1,by1);ctx.lineTo(ax1,ay1);ctx.closePath();ctx.fill();
          }
        }
        ctx.globalAlpha=1;
      }
      // south or north face (Y axis)
      if(camY>ty+0.5)bFace(pd,pc,pct,pdt,bldg.c);else bFace(pa,pb,pbt,pat,bldg.d);
      // east or west face (X axis)
      if(camX>tx+0.5)bFace(pb,pc,pct,pbt,bldg.c);else bFace(pa,pd,pdt,pat,bldg.d);
      // roof top
      if(pat&&pbt&&pct&&pdt){
        ctx.globalAlpha=1-fog;ctx.fillStyle=bldg.t;
        ctx.beginPath();ctx.moveTo(pat.x,pat.y);ctx.lineTo(pbt.x,pbt.y);ctx.lineTo(pct.x,pct.y);ctx.lineTo(pdt.x,pdt.y);ctx.closePath();ctx.fill();
        ctx.globalAlpha=1;
      }
    }
  });
  ctx.globalAlpha=1;

  // TREES (billboard)
  FR_TREES.forEach(([tx,ty])=>{
    const dist2=(tx+0.5-camX)**2+(ty+0.5-camY)**2;if(dist2>250)return;
    const p0=proj(tx+0.5,ty+0.5,0),p1=proj(tx+0.5,ty+0.5,0.28),p2=proj(tx+0.5,ty+0.5,0.62);
    if(!p0||!p1||!p2)return;
    ctx.globalAlpha=Math.max(0.1,1-dist2/70);
    ctx.fillStyle='#5a3a1a';ctx.fillRect(p1.x-p1.sc*0.04,p1.y,p1.sc*0.08,p0.y-p1.y);
    const r=p2.sc*0.3;
    ctx.fillStyle='#166534';ctx.beginPath();ctx.arc(p2.x,p2.y,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(p2.x-r*0.3,p2.y-r*0.42,r*0.62,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });

  // SPRITES — NPCs, coins, parked cars (sorted far→near)
  const sprites=[];
  frNPCs.forEach(n=>sprites.push({tx:n.tx,ty:n.ty,type:'npc',data:n,dist2:(n.tx-camX)**2+(n.ty-camY)**2}));
  frCars.forEach(c=>{if(!c.occupied)sprites.push({tx:c.tx,ty:c.ty,type:'car',data:c,dist2:(c.tx-camX)**2+(c.ty-camY)**2});});
  frCoins.forEach(c=>{if(!c.collected)sprites.push({tx:c.tx,ty:c.ty,type:'coin',data:c,dist2:(c.tx-camX)**2+(c.ty-camY)**2});});
  sprites.sort((a,b)=>b.dist2-a.dist2);
  sprites.forEach(s=>{
    const pf=proj(s.tx,s.ty,0);if(!pf||pf.d<0.3||pf.d>13)return;
    const fog=Math.min(0.82,s.dist2/110);ctx.globalAlpha=Math.max(0.1,1-fog);
    if(s.type==='coin'){
      const c=s.data,pc=proj(c.tx,c.ty,0.14+Math.sin(c.bob)*0.03);if(!pc)return;
      const r=Math.max(2,pc.sc*0.11);
      ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(pc.x,pc.y,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#78350f';ctx.lineWidth=Math.max(0.5,r*0.3);ctx.stroke();
      if(s.dist2<2.5){ctx.globalAlpha=1;ctx.font='4px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle='#fde68a';ctx.fillText('[coletar]',pc.x,pc.y-r-4);}
    } else if(s.type==='npc'){
      const n=s.data,ph=proj(n.tx,n.ty,0.5);if(!ph)return;
      const h=Math.max(5,pf.y-ph.y),w=h*0.5;
      ctx.fillStyle=n.c;ctx.fillRect(ph.x-w/2,ph.y+h*0.35,w,h*0.5);
      ctx.beginPath();ctx.arc(ph.x,ph.y+h*0.2,w*0.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ph.x+w*0.1,ph.y+h*0.12,w*0.13,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#1e3a8a';ctx.beginPath();ctx.arc(ph.x+w*0.12,ph.y+h*0.12,w*0.07,0,Math.PI*2);ctx.fill();
    } else if(s.type==='car'){
      const car=s.data,pt=proj(car.tx,car.ty,0.3);if(!pt)return;
      const ch=Math.max(4,pf.y-pt.y),cw=ch*1.9;
      ctx.fillStyle=car.color;ctx.fillRect(pt.x-cw/2,pt.y,cw,ch*0.6);
      ctx.fillStyle=frDarken(car.color);ctx.fillRect(pt.x-cw/2,pt.y+ch*0.6,cw,ch*0.4);
      ctx.fillStyle='rgba(147,210,255,.5)';ctx.fillRect(pt.x-cw*0.3,pt.y+ch*0.06,cw*0.6,ch*0.25);
      ctx.fillStyle='#111';const wr=Math.max(1.5,ch*0.2);
      ctx.beginPath();ctx.arc(pt.x-cw*0.33,pf.y,wr,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(pt.x+cw*0.33,pf.y,wr,0,Math.PI*2);ctx.fill();
      if(s.dist2<4){ctx.globalAlpha=1;ctx.font='5px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle='#fde68a';ctx.fillText('[C] Entrar',pt.x,pt.y-6);}
    }
    ctx.globalAlpha=1;
  });

  // PLAYER (bottom-center, 3rd-person style)
  if(!frDriving){
    drawDinoOn(ctx,W/2-20,H-62,frPlayer.frame,false,0.72);
  } else {
    ctx.strokeStyle='rgba(80,55,30,.75)';ctx.lineWidth=14;
    ctx.beginPath();ctx.arc(W/2,H+20,70,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
    ctx.lineWidth=5;ctx.strokeStyle='rgba(60,40,20,.75)';
    ctx.beginPath();ctx.moveTo(W/2,H-50);ctx.lineTo(W/2,H-16);ctx.stroke();
    drawDinoOn(ctx,W/2-56,H-54,frPlayer.frame,false,0.5);
    drawDinoOn(ctx,W/2+10,H-54,frPlayer.frame,false,0.5);
  }

  // MINIMAP
  const MM=50,MX=W-MM-8,MY=H-MM-8,MS=MM/FR_SZ;
  ctx.fillStyle='rgba(5,10,22,.82)';ctx.fillRect(MX-2,MY-2,MM+4,MM+4);
  for(let mty=0;mty<FR_SZ;mty++)for(let mtx=0;mtx<FR_SZ;mtx++){
    const t=FR_MAP[mty][mtx];
    ctx.fillStyle=t===9?'#0c4a6e':t===0?'#333':t===1?'#555':t===2?'#1a4a1a':'#1d3a6a';
    ctx.fillRect(MX+mtx*MS,MY+mty*MS,MS,MS);
  }
  frCars.forEach(c=>{ctx.fillStyle=c.color;ctx.fillRect(MX+c.tx*MS-1,MY+c.ty*MS-1,2,2);});
  const mpx=MX+camX*MS,mpy=MY+camY*MS;
  ctx.fillStyle='#4ecdc4';ctx.save();ctx.translate(mpx,mpy);ctx.rotate(camA);
  ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(2.5,3);ctx.lineTo(-2.5,3);ctx.closePath();ctx.fill();
  ctx.restore();

  // HUD
  ctx.fillStyle='rgba(5,10,22,.88)';roundRect(ctx,8,8,220,50,7,true,false);
  ctx.strokeStyle='rgba(78,205,196,.25)';ctx.lineWidth=1;roundRect(ctx,8,8,220,50,7,false,true);
  ctx.font='6px "Press Start 2P"';ctx.textAlign='left';ctx.fillStyle='#4ecdc4';
  ctx.fillText('🏙️ Jogo Livre',16,22);
  ctx.fillStyle='#fbbf24';ctx.fillText(`💰 ${frCoinCount} coletadas`,16,36);
  ctx.font='4px "Press Start 2P"';ctx.fillStyle='#64748b';
  ctx.fillText(frDriving?'W/S=acelerar · A/D=virar · C=sair':'W/S=andar · A/D=virar · C=entrar · ESC=sair',16,48);
}

function startMenuAnimation(){
  if(menuAnimRAF) cancelAnimationFrame(menuAnimRAF);
  function step(){
    const cvs = document.getElementById('menuDinoAnim');
    if(!cvs){ menuAnimRAF = null; return; }
    const c = cvs.getContext('2d');
    c.clearRect(0,0,cvs.width,cvs.height);
    menuAnimTick++;
    c.fillStyle='rgba(43,42,76,.16)';
    c.beginPath(); c.ellipse(90, cvs.height-8, 46, 6, 0, 0, Math.PI*2); c.fill();
    if(typeof drawDinoOn === 'function') drawDinoOn(c, 40, cvs.height-8, 0, false, 1.5);
    menuAnimRAF = requestAnimationFrame(step);
  }
  step();
}
function stopMenuAnimation(){
  if(menuAnimRAF){ cancelAnimationFrame(menuAnimRAF); menuAnimRAF = null; }
}

function loop(){
  try{
    if(state==='freeroam'){ updateFreeRoam(); drawFreeRoam(); requestAnimationFrame(loop); return; }
    if(state==='editor'){ updateEditor(); drawEditor(); updateMobileControls(); requestAnimationFrame(loop); return; }
    if(!paused){ update(); draw(); }
    else { draw(); drawPauseOverlay(); }
    updateMobileControls();
  } catch(e){
    // Never let a draw/update error kill the game loop
    console.error('DinoGame loop error:', e);
  }
  requestAnimationFrame(loop);
}
// ─── LOADING SCREEN ──────────────────────────────────────────────────────────
(function initLoading(){
  const bar = document.getElementById('loadBar');
  const ls = document.getElementById('loadingScreen');
  const ov = document.getElementById('overlay');
  let pct = 0;
  const tick = setInterval(()=>{
    pct = Math.min(pct + 8 + Math.random()*12, 90);
    if(bar) bar.style.width = pct+'%';
  }, 120);
  document.fonts.ready.then(()=>{
    clearInterval(tick);
    if(bar) bar.style.width = '100%';
    setTimeout(()=>{
      if(ls) ls.style.display = 'none';
      if(ov) ov.style.display = 'flex';
    }, 400);
  });
  // fallback se fonts.ready não disparar
  setTimeout(()=>{
    clearInterval(tick);
    if(ls) ls.style.display = 'none';
    if(ov) ov.style.display = 'flex';
  }, 4000);
})();

initMobileDpad();
requestAnimationFrame(loop);
