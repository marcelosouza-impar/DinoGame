<style>
body{margin:0}
.coin{transform-box:fill-box;transform-origin:center;animation:spin 1.2s ease-in-out infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
@keyframes bubble{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bub{animation:bubble 1.4s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1deg)}}
.drv{animation:drive .5s ease-in-out infinite}

.rig,.rig g,.shadow{transform-box:fill-box}
.rig{transform-origin:50% 100%;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.tail{transform-origin:100% 40%}
.headP,.headF{transform-origin:30% 90%;transition:opacity .15s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.legN,.legF{transform-origin:50% 10%}
.torso{transform-origin:50% 100%}
.lid,.lidF{transform-origin:50% 0%;transform:scaleY(0)}
.shadow{transform-origin:50% 50%}
.pupP,.pupF{transform-box:fill-box}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg) translateY(-1px)}}
.m-idle .torso{animation:breathe 2.4s ease-in-out infinite}
.m-idle .tail{animation:sway 2.4s ease-in-out infinite}
.m-idle .lid,.m-wait .lidF{animation:blink 3.6s infinite}
.m-idle .headP{animation:nod 2.4s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}14%{transform:translateY(0) scale(1.14,.84)}28%{transform:translateY(-34px) scale(.88,1.16)}50%{transform:translateY(-70px) scale(1,1)}72%{transform:translateY(-28px) scale(.94,1.08)}86%{transform:translateY(0) scale(1.16,.82)}100%{transform:translateY(0) scale(1,1)}}
@keyframes tuck{0%,14%{transform:rotate(0)}40%,60%{transform:rotate(-28deg) translateY(-6px)}80%{transform:rotate(12deg)}100%{transform:rotate(0)}}
@keyframes tailUp{0%,14%{transform:rotate(0)}40%,60%{transform:rotate(-16deg)}86%{transform:rotate(8deg)}100%{transform:rotate(0)}}
@keyframes shadowJ{0%,14%,100%{transform:scale(1);opacity:.16}50%{transform:scale(.5);opacity:.07}86%{transform:scale(1.12);opacity:.2}}
@keyframes headJ{0%,14%{transform:rotate(0)}30%{transform:rotate(-6deg)}50%{transform:rotate(-2deg)}86%{transform:rotate(6deg)}100%{transform:rotate(0)}}
.m-jump .rig{animation:jump .9s cubic-bezier(.3,0,.3,1) both}
.m-jump .legN,.m-jump .legF{animation:tuck .9s ease-in-out both}
.m-jump .tail{animation:tailUp .9s ease-in-out both}
.m-jump .shadow{animation:shadowJ .9s ease-in-out both}
.m-jump .headP{animation:headJ .9s ease-in-out both}
.m-duck .rig{transform:scale(1.12,.74)}
.m-duck .headP{transform:translate(8px,22px) rotate(10deg) scale(.89,1.3)}
.m-duck .spk{transform:scaleY(.6);transform-origin:50% 100%}
@keyframes shuffle{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.m-duck .legN{animation:shuffle .5s ease-in-out infinite}
.m-duck .legF{animation:shuffle .5s ease-in-out infinite reverse}
.m-duck .tail{transform:rotate(10deg)}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg)}60%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes dart{0%,30%{transform:translate(0,0)}35%,60%{transform:translate(-3px,1px)}65%,85%{transform:translate(3px,1px)}90%,100%{transform:translate(0,0)}}
@keyframes hop{0%,60%,100%{transform:translateY(0) scale(1,1)}68%{transform:translateY(0) scale(1.06,.94)}78%{transform:translateY(-12px) scale(.97,1.04)}90%{transform:translateY(0) scale(1.04,.96)}}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
@keyframes tap{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}}
@keyframes mouth{0%,60%,100%{transform:scaleY(1)}75%{transform:scaleY(1.5)}}
.m-wait .headF{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
.m-wait .pupF{animation:dart 2.2s ease-in-out infinite}
.m-wait .rig{animation:hop 1.6s ease-in-out infinite}
.m-wait .tail{animation:wag .35s ease-in-out infinite}
.m-wait .legN{animation:tap .5s ease-in-out infinite}
.m-wait .mouthF{transform-box:fill-box;transform-origin:50% 0;animation:mouth 1.6s ease-in-out infinite}

</style>
